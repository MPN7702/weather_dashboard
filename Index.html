<!DOCTYPE html><html lang='sv'><head><meta charset='utf-8'><title>Vädertest</title></head><body>
<h2>Copilot Prognos</h2>
<button onclick='updateWeather()'>Uppdatera</button>
<pre id='out'>Redo</pre>
<script>
async function updateWeather(){
 const out=document.getElementById('out');
 out.textContent='Hämtar data...';
 try{
  const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=60.1333&longitude=13&current=temperature_2m');
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json();
  out.textContent='Temperatur Torsby: '+j.current.temperature_2m+' °C';
 }catch(e){
  out.textContent='Fel: '+e.message+'\n\nOm du öppnar HTML-filen lokalt kan företagets webbläsarpolicy eller nätverk blockera API-anrop.';
 }
}
</script></body></html>
