<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Väder Torsby</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#1e293b;
    text-align:center;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1e293b;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.current{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
}

.info{
    flex:1;
    min-width:180px;
    background:#334155;
    border-radius:8px;
    padding:15px;
    text-align:center;
}

.label{
    font-size:14px;
    opacity:.8;
}

.value{
    font-size:32px;
    font-weight:bold;
}

.forecast{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:10px;
}

.day{
    background:#334155;
    padding:12px;
    border-radius:8px;
    text-align:center;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

#status{
    text-align:center;
    margin-top:15px;
}
</style>

</head>
<body>

<header>
<h1>🌤 Väder Torsby</h1>
</header>

<div class="container">

<div class="card">

<div style="text-align:center;">
<button onclick="loadWeather()">
Uppdatera väder
</button>
</div>

<div id="status">
Laddar...
</div>

</div>

<div class="card">

<!-- ÄNDRING: Rubrik ändrad till Dagens väder -->
<h2>Dagens väder</h2>

<div class="current">

<!-- ÄNDRING: Etiketter och ID:n ändrade för att visa Copilot-datan istället -->
<div class="info">
<div class="label">Temperatur</div>
<div id="copilotTemp" class="value">-</div>
</div>

<div class="info">
<div class="label">Regnrisk</div>
<div id="copilotRain" class="value">-</div>
</div>

<div class="info">
<div class="label">Åskrisk</div>
<div id="copilotThunder" class="value">-</div>
</div>

<div class="info">
<div class="label">Säkerhet</div>
<div id="copilotConfidence" class="value">-</div>
</div>

<div class="info">
<div class="label">Källor</div>
<div id="copilotSources" class="value">-</div>
</div>

</div>

</div>

<!-- ÄNDRING: Rubrik förtydligad till Copilot-bedömning -->
<div class="card">

<h2>7-dagars prognos (Copilot-bedömning)</h2>

<div id="forecast" class="forecast">
</div>

</div>

</div>

<script>

const LAT = 60.1333;
const LON = 13.0;

async function loadWeather(){

const status =
document.getElementById("status");

status.textContent =
"Hämtar väderdata...";

try{
const openMeteoUrl =
`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FStockholm`;

const response =
await fetch(openMeteoUrl);

if(!response.ok){
    throw new Error(
        "Open‑Meteo " +
        response.status
    );
}

const data =
await response.json();

let smhiTemp = null;
let smhiWind = null;
let smhiHumidity = null;
let smhiRain = null;
let smhiThunder = null;
let smhiPressure = null;

try{

    const smhiResponse =
    await fetch(
        "https://smhi-proxy.mr-magoo21.workers.dev/"
    );

    if(smhiResponse.ok){

        const smhiData =
        await smhiResponse.json();

        if(
            smhiData.timeSeries &&
            smhiData.timeSeries.length > 0 &&
            smhiData.timeSeries[0].data
        ){

            const current =
            smhiData.timeSeries[0].data;

            smhiTemp =
            current.air_temperature;

            smhiWind =
            current.wind_speed;

            smhiHumidity =
            current.relative_humidity;

            smhiRain =
            current.probability_of_precipitation;

            smhiThunder =
            current.thunderstorm_probability;

            smhiPressure =
            current.air_pressure_at_mean_sea_level;

        }

    }

}
catch(smhiError){

    console.error(
        "SMHI-fel:",
        smhiError
    );

}

// ÄNDRING: Hämtar dygnsprognoser från Yr.no (MET Norway) via en publik proxy för att hantera CORS
let yrForecastDays = {};
try {
    const yrUrl = `https://met.no{LAT}&lon=${LON}`;
    const yrResponse = await fetch(`https://allorigins.win{encodeURIComponent(yrUrl)}`);
    
    if (yrResponse.ok) {
        const yrProxyData = await yrResponse.json();
        const yrData = JSON.parse(yrProxyData.contents);
        
        if (yrData.properties && yrData.properties.timeseries) {
            yrData.properties.timeseries.forEach(slot => {
                const dateStr = slot.time.split("T")[0];
                if (!yrForecastDays[dateStr]) {
                    yrForecastDays[dateStr] = { temps: [], rains: [] };
                }
                if (slot.data.instant && slot.data.instant.details) {
                    yrForecastDays[dateStr].temps.push(slot.data.instant.details.air_temperature);
                }
                if (slot.data.next_6_hours && slot.data.next_6_hours.details) {
                    yrForecastDays[dateStr].rains.push(slot.data.next_6_hours.details.probability_of_precipitation || 0);
                }
            });
        }
    }
} catch (yrError) {
    console.error("Yr-fel:", yrError);
}

const temp =
data.current.temperature_2m;

const wind =
data.current.wind_speed_10m;

const humidity =
data.current.relative_humidity_2m;

const rain =
data.daily.precipitation_probability_max[0];

// ÄNDRING: Kodblocken som uppdaterade de gamla boxarna har flyttats till slutet av funktionen där Copilot-variablerna har skapats.

let copilotTemp =
temp;

if(smhiTemp !== null){

copilotTemp =
(
temp +
smhiTemp
) / 2;

}

let confidence = "Hög";

if(
    smhiTemp !== null &&
    Math.abs(temp - smhiTemp) > 3
){
    confidence = "Medel";
}

let copilotRain = rain;

if(smhiRain !== null){

    copilotRain =
    Math.round(
        (
            rain +
            smhiRain
        ) / 2
    );

}

let copilotThunder =
smhiThunder !== null
? smhiThunder
: 0;

// ÄNDRING: Här skickas Copilot-värdena in i de nya Dagens väder-boxarna högst upp
document.getElementById("copilotTemp").textContent = copilotTemp.toFixed(1) + "°";
document.getElementById("copilotRain").textContent = copilotRain + "%";
document.getElementById("copilotThunder").textContent = copilotThunder + "%";
document.getElementById("copilotConfidence").textContent = confidence;
document.getElementById("copilotSources").textContent = smhiTemp !== null ? "2" : "1";

// ÄNDRING: Bygger 7-dagarslistan med sammanslagen data från Open-Meteo och Yr.no
let forecastHTML = "";

for(let i = 0; i < 7; i++){

const dateStr = data.daily.time[i];
const date = new Date(dateStr);

let omMax = data.daily.temperature_2m_max[i];
let omMin = data.daily.temperature_2m_min[i];
let omRain = data.daily.precipitation_probability_max[i];

let finalMax = omMax;
let finalMin = omMin;
let finalRain = omRain;

if (yrForecastDays[dateStr]) {
    const yrTemps = yrForecastDays[dateStr].temps;
    const yrRains = yrForecastDays[dateStr].rains;
    
    if (yrTemps.length > 0) {
        const yrMax = Math.max(...yrTemps);
        const yrMin = Math.min(...yrTemps);
        finalMax = (omMax + yrMax) / 2;
        finalMin = (omMin + yrMin) / 2;
    }
    if (yrRains.length > 0) {
        const yrRainMax = Math.max(...yrRains);
        finalRain = Math.round((omRain + yrRainMax) / 2);
    }
}

forecastHTML += `
<div class="day">
<strong>
${date.toLocaleDateString(
"sv-SE",
{weekday:"short"}
)}
</strong>
<br><br>
🔺 ${Math.round(finalMax)}°
<br>
🔻 ${Math.round(finalMin)}°
<br><br>
🌧 ${finalRain}%
</div>
`;

}

document.getElementById("forecast").innerHTML =
forecastHTML;

status.textContent =
"Senast uppdaterad: " +
new Date().toLocaleTimeString("sv-SE");

}
catch(error){

status.textContent =
"Fel: " + error.message;

}

}

loadWeather();

setInterval(loadWeather,900000);

</script>

</body>
</html>
