<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Väder Torsby</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#1e293b;
    text-align:center;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1e293b;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.current{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
}

.info{
    flex:1;
    min-width:180px;
    background:#334155;
    border-radius:8px;
    padding:15px;
    text-align:center;
}

.label{
    font-size:14px;
    opacity:.8;
}

.value{
    font-size:32px;
    font-weight:bold;
}

.forecast{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:10px;
}

.day{
    background:#334155;
    padding:12px;
    border-radius:8px;
    text-align:center;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

#status{
    text-align:center;
    margin-top:15px;
}
</style>

</head>
<body>

<header>
<h1>🌤 Väder Torsby</h1>
</header>

<div class="container">

<div class="card">

<div style="text-align:center;">
<button onclick="loadWeather()">
Uppdatera väder
</button>
</div>

<div id="status">
Laddar...
</div>

</div>

<div class="card">

<h2>Dagens väder</h2>

<div class="current">

<div class="info">
<div class="label">Temperatur</div>
<div id="copilotTemp" class="value">-</div>
</div>

<div class="info">
<div class="label">Regnrisk</div>
<div id="copilotRain" class="value">-</div>
</div>

<div class="info">
<div class="label">Åskrisk</div>
<div id="copilotThunder" class="value">-</div>
</div>

<div class="info">
<div class="label">Säkerhet</div>
<div id="copilotConfidence" class="value">-</div>
</div>

<div class="info">
<div class="label">Källor</div>
<div id="copilotSources" class="value">-</div>
</div>

</div>

</div>

<div class="card">

<h2>7-dagars prognos</h2>

<div id="forecast" class="forecast">
</div>

</div>

<div class="card">

<h2>Källor</h2>

<div id="copilot">
Laddar...
</div>

</div>

</div>

<script>

const LAT = 60.1333;
const LON = 13.0;

async function loadWeather(){

const status =
document.getElementById("status");

status.textContent =
"Hämtar väderdata...";

try{
const openMeteoUrl =
`https://open-meteo.com{LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FStockholm`;

const response =
await fetch(openMeteoUrl);

if(!response.ok){
    throw new Error(
        "Open‑Meteo " +
        response.status
    );
}

const data =
await response.json();

let smhiTemp = null;
let smhiWind = null;
let smhiHumidity = null;
let smhiRain = null;
let smhiThunder = null;
let smhiPressure = null;

// Objekt för att strukturera SMHI:s dygnsvärden till 7-dagarslistan
let smhiForecastDays = {};

try{

    const smhiResponse =
    await fetch(
        "https://workers.dev"
    );

    if(smhiResponse.ok){

        const smhiData =
        await smhiResponse.json();

        // ÄNDRING: Läser direkt från ditt nya "data"-objekt i tidsserien
        if(smhiData.timeSeries && smhiData.timeSeries.length > 0){

            // 1. Plocka ut realtidsdata från den allra första timmen i listan
            const current = smhiData.timeSeries[0].data;

            if(current.air_temperature !== undefined) smhiTemp = current.air_temperature;
            if(current.wind_speed !== undefined) smhiWind = current.wind_speed;
            if(current.relative_humidity !== undefined) smhiHumidity = current.relative_humidity;
            if(current.probability_of_precipitation !== undefined) smhiRain = current.probability_of_precipitation; 
            if(current.thunderstorm_probability !== undefined) smhiThunder = current.thunderstorm_probability;
            if(current.air_pressure_at_mean_sea_level !== undefined) smhiPressure = current.air_pressure_at_mean_sea_level;

            // 2. Loopa igenom alla timmar för att samla in värden till 7-dagarsprognosen
            smhiData.timeSeries.forEach(slot => {
                const dateKey = slot.time.split("T")[0]; // Ger "YYYY-MM-DD"
                
                if(!smhiForecastDays[dateKey]){
                    smhiForecastDays[dateKey] = { temps: [], rains: [] };
                }

                const slotData = slot.data;
                if(slotData.air_temperature !== undefined) {
                    smhiForecastDays[dateKey].temps.push(slotData.air_temperature);
                }
                if(slotData.probability_of_precipitation !== undefined) {
                    smhiForecastDays[dateKey].rains.push(slotData.probability_of_precipitation);
                }
            });
        }

    }

}
catch(smhiError){

    console.error(
        "SMHI-fel:",
        smhiError
    );

}

const temp =
data.current.temperature_2m;

const wind =
data.current.wind_speed_10m;

const humidity =
data.current.relative_humidity_2m;

const rain =
data.daily.precipitation_probability_max[0];

let copilotTemp =
temp;

if(smhiTemp !== null){

copilotTemp =
(
temp +
smhiTemp
) / 2;

}

let confidence = "Hög";

if(
    smhiTemp !== null &&
    Math.abs(temp - smhiTemp) > 3
){
    confidence = "Medel";
}

let copilotRain = rain;

if(smhiRain !== null){

    copilotRain =
    Math.round(
        (
            rain +
            smhiRain
        ) / 2
    );

}

let copilotThunder =
smhiThunder !== null
? smhiThunder
: 0;

let text = `

<b>OPEN‑METEO</b>
<br>
Temperatur: ${temp.toFixed(1)}°C
<br>
Vind: ${wind.toFixed(1)} m/s
<br>
Luftfuktighet: ${humidity}%
<br>
Regnrisk: ${rain}%

<br><br>

<b>SMHI</b>
<br>
Temperatur: ${
smhiTemp !== null
? smhiTemp.toFixed(1) + "°C"
: "N/A"
}
<br>
Vind: ${
smhiWind !== null
? smhiWind.toFixed(1) + " m/s"
: "N/A"
}
<br>
Luftfuktighet: ${
smhiHumidity !== null
? smhiHumidity + "%"
: "N/A"
}
<br>
Lufttryck: ${
smhiPressure !== null
? smhiPressure.toFixed(1) + " hPa"
: "N/A"
}
<br>
Regnrisk: ${
smhiRain !== null
? smhiRain + "%"
: "N/A"
}
<br>
Åskrisk: ${
smhiThunder !== null
? smhiThunder + "%"
: "N/A"
}

`;

document.getElementById("copilot").innerHTML =
text;

document.getElementById("copilotTemp").textContent = copilotTemp.toFixed(1) + "°";
document.getElementById("copilotRain").textContent = copilotRain + "%";
document.getElementById("copilotThunder").textContent = copilotThunder + "%";
document.getElementById("copilotConfidence").textContent = confidence;
document.getElementById("copilotSources").textContent = smhiTemp !== null ? "2" : "1";

let forecastHTML = "";

// ÄNDRING: Bygger 7-dagarslistan som ett äkta genomsnitt av både Open-Meteo och din nya SMHI-data
for(let i = 0; i < 7; i++){

const dateStr = data.daily.time[i]; // "YYYY-MM-DD"
const date = new Date(dateStr);

let omMax = data.daily.temperature_2m_max[i];
let omMin = data.daily.temperature_2m_min[i];
let omRain = data.daily.precipitation_probability_max[i];

let finalMax = omMax;
let finalMin = omMin;
let finalRain = omRain;

if (smhiForecastDays[dateStr]) {
    const smhiTemps = smhiForecastDays[dateStr].temps;
    const smhiRains = smhiForecastDays[dateStr].rains;
    
    if (smhiTemps.length > 0) {
        const smhiMax = Math.max(...smhiTemps);
        const smhiMin = Math.min(...smhiTemps);
        finalMax = (omMax + smhiMax) / 2;
        finalMin = (omMin + smhiMin) / 2;
    }
    if (smhiRains.length > 0) {
        const smhiRainMax = Math.max(...smhiRains);
        finalRain = Math.round((omRain + smhiRainMax) / 2);
    }
}

forecastHTML += `
<div class="day">
<strong>
${date.toLocaleDateString(
"sv-SE",
{weekday:"short"}
)}
</strong>
<br><br>
🔺 ${Math.round(finalMax)}°
<br>
🔻 ${Math.round(finalMin)}°
<br><br>
🌧 ${finalRain}%
</div>
`;

}

document.getElementById("forecast").innerHTML =
forecastHTML;

status.textContent =
"Senast uppdaterad: " +
new Date().toLocaleTimeString("sv-SE");

}
catch(error){

status.textContent =
"Fel: " + error.message;

}

}

loadWeather();

setInterval(loadWeather,900000);

</script>

</body>
</html>
