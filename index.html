<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torsby Vädermodeller</title>

<style>
body {
    margin: 0;
    padding: 20px;
    background: #f2f4f8;
    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
    color: #1c3d5a;
    margin-bottom: 20px;
}

.container {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(300px,1fr));
    gap: 15px;
}

.weather-box {
    background: white;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

.weather-box h2 {
    margin-top: 0;
    color: #0066cc;
    border-bottom: 1px solid #ddd;
    padding-bottom: 8px;
}

.loading {
    color: #777;
}

.value {
    font-weight: bold;
}
</style>
</head>
<body>

<h1>Väderprognoser för Torsby</h1>

<div class="container">
    <div class="weather-box" id="box1"><div class="loading">Laddar ECMWF...</div></div>
    <div class="weather-box" id="box2"><div class="loading">Laddar ICON...</div></div>
    <div class="weather-box" id="box3"><div class="loading">Laddar GFS...</div></div>
    <div class="weather-box" id="box4"><div class="loading">Laddar UKMO...</div></div>
    <div class="weather-box" id="box5"><div class="loading">Laddar GEM...</div></div>
    <div class="weather-box" id="box6"><div class="loading">Laddar MeteoFrance...</div></div>
</div>

<script>

const LAT = 60.136;
const LON = 13.006;

const models = [
    {
        id: "box1",
        namn: "ECMWF",
        model: "ecmwf"
    },
    {
        id: "box2",
        namn: "ICON",
        model: "icon_global"
    },
    {
        id: "box3",
        namn: "GFS",
        model: "gfs_global"
    },
    {
        id: "box4",
        namn: "UKMO",
        model: "ukmo_global"
    },
    {
        id: "box5",
        namn: "GEM",
        model: "gem_global"
    },
    {
        id: "box6",
        namn: "MétéoFrance",
        model: "meteofrance_seamless"
    }
];

async function loadWeather(source) {

    try {

        const url =
            `https://api.open-meteo.com/v1/forecast` +
            `?latitude=${LAT}` +
            `&longitude=${LON}` +
            `&models=${source.model}` +
            `&current=` +
            `temperature_2m,` +
            `relative_humidity_2m,` +
            `surface_pressure,` +
            `wind_speed_10m` +
            `&daily=precipitation_probability_max` +
            `&forecast_days=1`;

        const response = await fetch(url);
        const data = await response.json();

        const temp = data.current?.temperature_2m ?? "-";
        const wind = data.current?.wind_speed_10m ?? "-";
        const humidity = data.current?.relative_humidity_2m ?? "-";
        const pressure = data.current?.surface_pressure ?? "-";
        const rainRisk = data.daily?.precipitation_probability_max?.[0] ?? "-";

        let thunderRisk = "-";

        if (rainRisk !== "-") {
            thunderRisk = Math.round(rainRisk * 0.6);
            if (thunderRisk > 100) thunderRisk = 100;
        }

        document.getElementById(source.id).innerHTML = `
            <h2>${source.namn}</h2>

            Temperatur:
            <span class="value">${temp} °C</span>
            <br><br>

            Vind:
            <span class="value">${wind} m/s</span>
            <br><br>

            Luftfuktighet:
            <span class="value">${humidity} %</span>
            <br><br>

            Lufttryck:
            <span class="value">${pressure} hPa</span>
            <br><br>

            Regnrisk:
            <span class="value">${rainRisk} %</span>
            <br><br>

            Åskrisk:
            <span class="value">${thunderRisk} %</span>
        `;

    } catch (error) {

        document.getElementById(source.id).innerHTML = `
            <h2>${source.namn}</h2>
            Fel vid hämtning av data.
        `;

        console.error(error);
    }
}

function updateAllWeather() {
    models.forEach(loadWeather);
}

updateAllWeather();

/* Uppdatera var 10:e minut */
setInterval(updateAllWeather, 600000);

</script>

</body>
</html>
