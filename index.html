<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Väderprognos</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #1e293b;
    color: white;
    margin: 0;
    padding: 20px;
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

#datum {
    font-size: 1.2rem;
    color: #cbd5e1;
}

h1 {
    margin: 10px 0;
}

.container {
    max-width: 800px;
    margin: auto;
}

.card {
    background: #334155;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
}

.value {
    font-size: 2rem;
    font-weight: bold;
    color: #38bdf8;
}

.label {
    color: #cbd5e1;
    margin-top: 5px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
    gap: 20px;
}
</style>
</head>

<body>

<div class="header">
    <div id="datum"></div>
    <h1>Väderprognos</h1>
</div>

<div class="container">

    <div class="grid">

        <div class="card">
            <div class="value" id="temp">--</div>
            <div class="label">Temperatur</div>
        </div>

        <div class="card">
            <div class="value" id="rain">--</div>
            <div class="label">Regnrisk</div>
        </div>

        <div class="card">
            <div class="value" id="thunder">--</div>
            <div class="label">Åskrisk</div>
        </div>

    </div>

</div>

<script>
function uppdateraDatum() {
    const nu = new Date();

    document.getElementById("datum").innerHTML =
        nu.toLocaleDateString("sv-SE", {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric"
        }) +
        " " +
        nu.toLocaleTimeString("sv-SE");
}

setInterval(uppdateraDatum, 1000);
uppdateraDatum();

async function hamtaVader() {

    const lat = 59.76;   // Torsby
    const lon = 12.99;

    const url =
    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&hourly=precipitation_probability`;

    try {

        const response = await fetch(url);
        const data = await response.json();

        document.getElementById("temp").innerText =
            Math.round(data.current.temperature_2m) + "°C";

        const rainRisk =
            data.hourly.precipitation_probability[0];

        document.getElementById("rain").innerText =
            rainRisk + "%";

        let thunderRisk;

        if (rainRisk < 20) {
            thunderRisk = 5;
        } else if (rainRisk < 50) {
            thunderRisk = 20;
        } else if (rainRisk < 70) {
            thunderRisk = 40;
        } else {
            thunderRisk = 70;
        }

        document.getElementById("thunder").innerText =
            thunderRisk + "%";

    } catch(err) {

        document.getElementById("temp").innerText = "Fel";
        document.getElementById("rain").innerText = "Fel";
        document.getElementById("thunder").innerText = "Fel";

        console.error(err);
    }
}

hamtaVader();
setInterval(hamtaVader, 600000);
</script>

</body>
</html>
