<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Väder Torsby</title>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
}

header{
    background:#1e293b;
    padding:20px;
    text-align:center;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1e293b;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.current{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
}

.info{
    flex:1;
    min-width:180px;
    background:#334155;
    border-radius:8px;
    padding:15px;
    text-align:center;
}

.label{
    opacity:.8;
    font-size:14px;
}

.value{
    font-size:32px;
    font-weight:bold;
}

.forecast{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:10px;
}

.day{
    background:#334155;
    padding:12px;
    border-radius:8px;
    text-align:center;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    padding:12px 20px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}
</style>
</head>
<body>

<header>
<h1>🌤 Väder Torsby</h1>
</header>

<div class="container">

<div class="card">
<button onclick="loadWeather()">
Uppdatera väder
</button>
<div id="status">Laddar...</div>
</div>

<div class="card">
<h2>Dagens väder</h2>

<div class="current">

<div class="info">
<div class="label">Temperatur</div>
<div id="temp" class="value">-</div>
</div>

<div class="info">
<div class="label">Regnrisk</div>
<div id="rain" class="value">-</div>
</div>

<div class="info">
<div class="label">Åskrisk</div>
<div id="thunder" class="value">-</div>
</div>

<div class="info">
<div class="label">Säkerhet</div>
<div id="confidence" class="value">-</div>
</div>

<div class="info">
<div class="label">Källor</div>
<div class="value">2</div>
</div>

</div>
</div>

<div class="card">
<h2>🤖 AI‑bedömning</h2>
<div id="ai">
Laddar...
</div>
</div>

<div class="card">
<h2>7‑dagars prognos</h2>
<div id="forecast" class="forecast"></div>
</div>

<div class="card">
<h2>Källor</h2>
<div id="sources"></div>
</div>

</div>

<script>

const LAT = 60.1333;
const LON = 13.0;

async function loadWeather(){

const status =
document.getElementById("status");

status.textContent =
"Hämtar väderdata...";

try{

const openMeteo =
await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FStockholm`
);

const meteoData =
await openMeteo.json();

const smhi =
await fetch(
"https://smhi-proxy.mr-magoo21.workers.dev/"
);

const smhiData =
await smhi.json();

const idag =
new Date()
.toISOString()
.split("T")[0];

const dagensSMHI =
smhiData.timeSeries.filter(item =>
item.time.startsWith(idag)
);

const temps = [];
const rains = [];
const thunders = [];

dagensSMHI.forEach(item=>{

temps.push(
item.data.air_temperature
);

rains.push(
item.data.probability_of_precipitation
);

thunders.push(
item.data.thunderstorm_probability
);

});

const smhiTemp =
temps.reduce((a,b)=>a+b,0) /
temps.length;

const smhiRain =
Math.max(...rains);

const smhiThunder =
Math.max(...thunders);

const meteoTemp =
(
meteoData.daily.temperature_2m_max[0] +
meteoData.daily.temperature_2m_min[0]
) / 2;

const meteoRain =
meteoData.daily.precipitation_probability_max[0];

const temp =
(
meteoTemp +
smhiTemp
) / 2;

const rain =
Math.max(
meteoRain,
smhiRain
);

const thunder =
smhiThunder;

let confidence = "Hög";

if(
Math.abs(
meteoTemp -
smhiTemp
) > 4
){
confidence = "Medel";
}

document.getElementById("temp").textContent =
temp.toFixed(1) + "°";

document.getElementById("rain").textContent =
rain + "%";

document.getElementById("thunder").textContent =
thunder + "%";

document.getElementById("confidence").textContent =
confidence;

let aiText = "";

if(rain < 20){

aiText =
"🟢 Mestadels uppehåll och stabilt väder väntas.";

}
else if(rain < 50){

aiText =
"🟡 Viss risk för regn under dagen.";

}
else{

aiText =
"🔴 Förhöjd risk för regn idag.";

}

if(thunder >= 20){

aiText +=
"<br><br>⛈ Risk för åska förekommer.";

}

aiText +=
`<br><br>🌡 Sammanvägd temperatur: ${temp.toFixed(1)}°C`;

aiText +=
`<br>🌧 Regnrisk: ${rain}%`;

document.getElementById("ai").innerHTML =
aiText;

document.getElementById("sources").innerHTML =
`
<b>Open‑Meteo</b><br>
Temperatur: ${meteoTemp.toFixed(1)}°C<br>
Regnrisk: ${meteoRain}%<br><br>

<b>SMHI</b><br>
Temperatur: ${smhiTemp.toFixed(1)}°C<br>
Regnrisk: ${smhiRain}%<br>
Åskrisk: ${smhiThunder}%
`;

let forecastHTML = "";

for(let i=0;i<7;i++){

const date =
new Date(
meteoData.daily.time[i]
);

forecastHTML += `
<div class="day">
<strong>
${date.toLocaleDateString(
"sv-SE",
{weekday:"short"}
)}
</strong>
<br><br>
🔺 ${Math.round(meteoData.daily.temperature_2m_max[i])}°
<br>
🔻 ${Math.round(meteoData.daily.temperature_2m_min[i])}°
<br><br>
🌧 ${meteoData.daily.precipitation_probability_max[i]}%
</div>
`;

}

document.getElementById("forecast").innerHTML =
forecastHTML;

status.textContent =
"Senast uppdaterad: " +
new Date().toLocaleTimeString("sv-SE");

}
catch(error){

status.textContent =
"Fel: " + error.message;

}

}

loadWeather();

setInterval(
loadWeather,
900000
);

</script>

</body>
</html>
