<!DOCTYPE html>
<html lang="sv">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Copilot Weather Torsby</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0f172a;
    color:white;
}

header{
    text-align:center;
    padding:20px;
    background:#1e293b;
}

h1{
    margin:0;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1e293b;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.current{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
}

.current div{
    flex:1;
    min-width:180px;
    background:#334155;
    padding:15px;
    border-radius:8px;
    text-align:center;
}

.forecast{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:12px;
}

.day{
    background:#334155;
    padding:12px;
    border-radius:8px;
    text-align:center;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

.small{
    opacity:0.8;
    font-size:14px;
}

.temp{
    font-size:30px;
    font-weight:bold;
}

.status{
    text-align:center;
    margin-top:15px;
}

</style>
</head>

<body>

<header>
    <h1>🌤 Copilot Weather Torsby</h1>
</header>

<div class="container">

<div class="card">
    <center>
        <button onclick="loadWeather()">Uppdatera väder</button>
    </center>

    <div class="status" id="status">
        Laddar...
    </div>
</div>

<div class="card">

    <h2>Just nu</h2>

    <div class="current">

        <div>
            <div class="small">Temperatur</div>
            <div id="temp" class="temp">-</div>
        </div>

        <div>
            <div class="small">Vind</div>
            <div id="wind" class="temp">-</div>
        </div>

        <div>
            <div class="small">Luftfuktighet</div>
            <div id="humidity" class="temp">-</div>
        </div>

    </div>

</div>

<div class="card">

    <h2>Copilot-bedömning</h2>

    <div id="copilot">

    </div>

</div>

<div class="card">

    <h2>7-dagars prognos</h2>

    <div id="forecast" class="forecast">

    </div>

</div>

</div>

<script>

const LAT = 60.1333;
const LON = 13.0000;

async function loadWeather(){

    document.getElementById("status").textContent =
    "Hämtar väderdata...";

    try{

        const url =
        `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe/Stockholm`;

        const response = await fetch(url);

        const data = await response.json();

        document.getElementById("temp").innerHTML =
        data.current.temperature_2m + "°";

        document.getElementById("wind").innerHTML =
        data.current.wind_speed_10m + " m/s";

        document.getElementById("humidity").innerHTML =
        data.current.relative_humidity_2m + "%";

        buildForecast(data);
        buildCopilot(data);

        document.getElementById("status").textContent =
        "Senast uppdaterad: " +
        new Date().toLocaleTimeString("sv-SE");

    }
    catch(error){

        document.getElementById("status").textContent =
        "Fel: " + error.message;

    }

}

function buildForecast(data){

    const container =
    document.getElementById("forecast");

    container.innerHTML = "";

    for(let i=0;i<7;i++){

        const day =
        document.createElement("div");

        day.className = "day";

        const date =
        new Date(data.daily.time[i]);

        day.innerHTML = `
            <strong>
            ${date.toLocaleDateString("sv-SE",
            {weekday:"short"})}
            </strong>

            <br><br>

            🔺 ${Math.round(data.daily.temperature_2m_max[i])}°

            <br>

            🔻 ${Math.round(data.daily.temperature_2m_min[i])}°

            <br><br>

            🌧 ${data.daily.precipitation_probability_max[i]}%
        `;

        container.appendChild(day);
    }
}

function buildCopilot(data){

    const maxToday =
    data.daily.temperature_2m_max[0];

    const rain =
    data.daily.precipitation_probability_max[0];

    let text = "";

    if(rain < 20){

        text =
        "☀️ Hög sannolikhet för torrt och stabilt väder idag.";

    }
    else if(rain < 50){

        text =
        "🌤 Risk för enstaka skurar men övervägande uppehåll.";

    }
    else{

        text =
        "🌧 Förhöjd risk för regn idag.";

    }

    text += "<br><br>";

    text +=
    "Prognostiserad maxtemperatur: " +
    maxToday + "°C";

    text += "<br><br>";

    text +=
    "Copilot säkerhetsbedömning: Hög";

    document.getElementById("copilot").innerHTML =
    text;
}

loadWeather();

setInterval(loadWeather,900000);

</script>

</body>
</html>
