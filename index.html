<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copilot Weather Torsby</title>

<style>
body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#1e293b;
    text-align:center;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

.box{
    background:#334155;
    padding:15px;
    border-radius:8px;
    text-align:center;
}

.value{
    font-size:30px;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #475569;
    padding:10px;
    text-align:center;
}

th{
    background:#2563eb;
}

.forecast{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:10px;
}

.day{
    background:#334155;
    padding:10px;
    border-radius:8px;
    text-align:center;
}
</style>
</head>

<body>

<header>
<h1>🌤 Copilot Weather Torsby</h1>
</header>

<div class="container">

<div class="card">
<button onclick="loadWeather()">Uppdatera väder</button>
<p id="status">Redo</p>
</div>

<div class="card">
<h2>Just nu</h2>

<div class="grid">

<div class="box">
<div>Temperatur</div>
<div class="value" id="temp">-</div>
</div>

<div class="box">
<div>Vind</div>
<div class="value" id="wind">-</div>
</div>

<div class="box">
<div>Luftfuktighet</div>
<div class="value" id="humidity">-</div>
</div>

<div class="box">
<div>Regnrisk</div>
<div class="value" id="rain">-</div>
</div>

<div class="box">
<div>Åskrisk</div>
<div class="value" id="thunder">-</div>
</div>

</div>
</div>

<div class="card">

<h2>Copilot-bedömning</h2>

<div id="copilot">
Laddar...
</div>

</div>

<div class="card">

<h2>Källor</h2>

<table>
<thead>
<tr>
<th>Källa</th>
<th>Temperatur</th>
<th>Regnrisk</th>
</tr>
</thead>
<tbody id="sources">
</tbody>
</table>

</div>

<div class="card">

<h2>7-dagars prognos</h2>

<div id="forecast" class="forecast"></div>

</div>

</div>

<script>

const LAT = 60.1333;
const LON = 13.0;

async function loadWeather(){

    document.getElementById("status").textContent =
    "Hämtar data...";

    try{

        const response = await fetch(
            "https://api.open-meteo.com/v1/forecast?latitude=60.1333&longitude=13.0&current=temperature_2m,relative_humidity_2m,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FStockholm"
        );

        const data = await response.json();
        // Hämta SMHI

let smhiTemp = null;

try {

    const smhiResponse = await fetch(
        "https://opendata-download-metfcst.smhi.se/api/category/pmp3g/version/2/geotype/point/lon/13.0/lat/60.13/data.json"
    );

    const smhiData = await smhiResponse.json();

    const parameter =
        smhiData.timeSeries[0].parameters.find(
            p => p.name === "t"
        );

    if(parameter){
        smhiTemp = parameter.values[0];
    }

}
catch(err){

    console.log("SMHI fel:", err);

}

        const temp =
            data.current.temperature_2m;

        const humidity =
            data.current.relative_humidity_2m;

        const wind =
            data.current.wind_speed_10m;

        const rain =
            data.daily.precipitation_probability_max[0];

        let thunder = 0;

        if(rain > 80){
            thunder = 40;
        }else if(rain > 60){
            thunder = 25;
        }else if(rain > 40){
            thunder = 10;
        }

        document.getElementById("temp").textContent =
            temp + "°";

        document.getElementById("humidity").textContent =
            humidity + "%";

        document.getElementById("wind").textContent =
            wind + " m/s";

        document.getElementById("rain").textContent =
            rain + "%";

        document.getElementById("thunder").textContent =
            thunder + "%";

        document.getElementById("sources").innerHTML = `
        <tr>
            <td>Open-Meteo</td>
            <td>${temp} °C</td>
            <td>${rain}%</td>
        </tr>
        `;

        document.getElementById("copilot").innerHTML = `
        <b>Temperatur:</b> ${temp.toFixed(1)}°C<br><br>
        <b>Regnrisk:</b> ${rain}%<br><br>
        <b>Åskrisk:</b> ${thunder}%<br><br>
        <b>Säkerhet:</b> 90%<br><br>
        <b>Källor:</b> 1
        `;

        let forecastHTML = "";

        for(let i=0;i<7;i++){

            const date =
            new Date(data.daily.time[i]);

            forecastHTML += `
            <div class="day">
            <b>${date.toLocaleDateString('sv-SE',{weekday:'short'})}</b>
            <br><br>
            🔺 ${Math.round(data.daily.temperature_2m_max[i])}°
            <br>
            🔻 ${Math.round(data.daily.temperature_2m_min[i])}°
            <br><br>
            🌧 ${data.daily.precipitation_probability_max[i]}%
            </div>
            `;
        }

        document.getElementById("forecast").innerHTML =
        forecastHTML;

        document.getElementById("status").textContent =
        "Uppdaterad " +
        new Date().toLocaleTimeString("sv-SE");

    }
    catch(err){

        document.getElementById("status").textContent =
        "Fel: " + err.message;

    }

}

loadWeather();

</script>

</body>
</html>
