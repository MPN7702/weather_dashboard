<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Väder Torsby</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#1e293b;
    text-align:center;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1e293b;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.current{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
}

.info{
    flex:1;
    min-width:180px;
    background:#334155;
    border-radius:8px;
    padding:15px;
    text-align:center;
}

.label{
    font-size:14px;
    opacity:.8;
}

.value{
    font-size:26px;
    font-weight:bold;
}

.forecast{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:10px;
}

.day{
    background:#334155;
    padding:12px;
    border-radius:8px;
    text-align:center;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

#status{
    text-align:center;
    margin-top:15px;
}
</style>

</head>
<body>

<header>
<h1>🌤 Väder Torsby</h1>
</header>

<div class="container">

<div class="card">

<div style="text-align:center;">
<button onclick="loadWeather()">
Uppdatera väder
</button>
</div>

<div id="status">
Laddar...
</div>

</div>

<div class="card">

<!-- ÄNDRING: Rubrik ändrad till Dagens väder -->
<h2>Dagens väder</h2>

<div class="current">

<!-- ÄNDRING: Etiketter och ID:n ändrade för att visa Copilot-datan istället -->
<div class="info">
<div class="label">Temperatur</div>
<div id="copilotTemp" class="value">-</div>
</div>

<div class="info">
<div class="label">Regnrisk</div>
<div id="copilotRain" class="value">-</div>
</div>

<!-- TILLÄGG ENBART HÄR: Ny informationsbox för dygnsmedelvinden -->
<div class="info">
<div class="label">Vind</div>
<div id="copilotWind" class="value">-</div>
</div>

<div class="info">
<div class="label">Åskrisk</div>
<div id="copilotThunder" class="value">-</div>
</div>

<div class="info">
<div class="label">Säkerhet</div>
<div id="copilotConfidence" class="value">-</div>
</div>

<div class="info">
<div class="label">Källor</div>
<div id="copilotSources" class="value">-</div>
</div>

</div>

</div>

<!-- ÄNDRING: Detta block (7-dagars prognos) har flyttats upp och ligger nu direkt under Dagens väder -->
<div class="card">

<h2>7-dagars prognos</h2>

<div id="forecast" class="forecast">
</div>

</div>

<!-- ÄNDRING: Detta block (Copilot-bedömning) ligger nu under 7-dagars prognos -->
<div class="card">

<h2>Källor</h2>

<div id="copilot">
Laddar...
</div>

</div>

</div>

<script>

const LAT = 60.1333;
const LON = 13.0;

async function loadWeather(){

const status =
document.getElementById("status");

status.textContent =
"Hämtar väderdata...";

try{
const openMeteoUrl =
`https://open-meteo.com{LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FStockholm`;

const response =
await fetch(openMeteoUrl);

if(!response.ok){
    throw new Error(
        "Open‑Meteo " +
        response.status
    );
}

const data =
await response.json();

let smhiTemp = null;
let smhiWind = null;
let smhiHumidity = null;
let smhiRain = null;
let smhiThunder = null;
let smhiPressure = null;

// TILLÄGG ENBART HÄR: Objekt för att sortera och lagra SMHI:s dygnsvärden till veckoprognosen
let smhiForecastDays = {};

try{

    const smhiResponse =
    await fetch(
        "https://workers.dev"
    );

    if(smhiResponse.ok){

        const smhiData =
        await smhiResponse.json();

        if(smhiData.timeSeries && smhiData.timeSeries.length > 0){

            // KORRIGERING: Hämta realtidsdata säkert från första mätpunkten om data-objektet existerar
            if(smhiData.timeSeries[0].data) {
                const current = smhiData.timeSeries[0].data;
                smhiTemp = current.air_temperature;
                smhiWind = current.wind_speed;
                smhiHumidity = current.relative_humidity;
                smhiRain = current.probability_of_precipitation;
                smhiThunder = current.thunderstorm_probability;
                smhiPressure = current.air_pressure_at_mean_sea_level;
            }

            // KORRIGERING: Flyttad utanför index-villkoret så loopen kan läsa hela tidsserien från din nya Worker
            smhiData.timeSeries.forEach(slot => {
                if (slot.time && slot.data) {
                    const dateKey = slot.time.split("T")[0]; // Ger formatet "YYYY-MM-DD"
                    if (!smhiForecastDays[dateKey]) {
                        smhiForecastDays[dateKey] = { temps: [], rains: [], winds: [] };
                    }
                    if (slot.data.air_temperature !== undefined) {
                        smhiForecastDays[dateKey].temps.push(slot.data.air_temperature);
                    }
                    if (slot.data.probability_of_precipitation !== undefined) {
                        smhiForecastDays[dateKey].rains.push(slot.data.probability_of_precipitation);
                    }
                    if (slot.data.wind_speed !== undefined) {
                        smhiForecastDays[dateKey].winds.push(slot.data.wind_speed);
                    }
                }
            });

        }

    }

}
catch(smhiError){

    console.error(
        "SMHI-fel:",
        smhiError
    );

}

const temp =
data.current.temperature_2m;

const wind =
data.current.wind_speed_10m;

const humidity =
data.current.relative_humidity_2m;

// KORRIGERING: Lagt till index [0] för att hämta dagens specifika datumnyckel från arrayen
const todayKey = data.daily.time[0];

// KORRIGERING: Lagt till index [0] för att hämta Open-Meteos specifika dygnsvärden för IDAG
let omTodayMax = data.daily.temperature_2m_max[0];
let omTodayMin = data.daily.temperature_2m_min[0];
let omTodayRain = data.daily.precipitation_probability_max[0];

// Sätt grundvärden baserat på Open-Meteos dygnsvärden
let finalTodayMax = omTodayMax;
let finalTodayTodayMin = omTodayMin;
let finalTodayRain = omTodayRain;
let finalTodayWind = wind;

// Om SMHI har dygnsprognos för idag, väg ihop värdena till en äkta dygnsbedömning
if (smhiForecastDays[todayKey]) {
    const sTemps = smhiForecastDays[todayKey].temps;
    const sRains = smhiForecastDays[todayKey].rains;
    const sWinds = smhiForecastDays[todayKey].winds;
    if (sTemps.length > 0) {
        finalTodayMax = (omTodayMax + Math.max(...sTemps)) / 2;
        finalTodayTodayMin = (omTodayMin + Math.min(...sTemps)) / 2;
    }
    if (sRains.length > 0) {
        finalTodayRain = Math.round((omTodayRain + Math.max(...sRains)) / 2);
    }
    if (sWinds.length > 0) {
        // Räkna ut genomsnittlig vind baserat på SMHI:s timvärden för dygnet
        const sWindAvg = sWinds.reduce((a, b) => a + b, 0) / sWinds.length;
        finalTodayWind = (wind + sWindAvg) / 2;
    }
}

let confidence = "Hög";
if(smhiTemp !== null && Math.abs(temp - smhiTemp) > 3){
    confidence = "Medel";
}

let copilotThunder = smhiThunder !== null ? smhiThunder : 0;

// ÄNDRING: COPILOT-textblocket och avdelaren har raderats härifrån
let text = `

<b>OPEN‑METEO</b>
<br>
Temperatur: ${temp.toFixed(1)}°C
<br>
Vind: ${wind.toFixed(1)} m/s
<br>
Luftfuktighet: ${humidity}%
<br>
Regnrisk: ${omTodayRain}%

<br><br>

<b>SMHI</b>
<br>
Temperatur: ${
smhiTemp !== null
? smhiTemp.toFixed(1) + "°C"
: "N/A"
}
<br>
Vind: ${
smhiWind !== null
? smhiWind.toFixed(1) + " m/s"
: "N/A"
}
<br>
Luftfuktighet: ${
smhiHumidity !== null
? smhiHumidity + "%"
: "N/A"
}
<br>
Lufttryck: ${
smhiPressure !== null
? smhiPressure + " hPa"
: "N/A"
}
<br>
Regnrisk: ${
smhiRain !== null
? smhiRain + "%"
: "N/A"
}
<br>
Åskrisk: ${
smhiThunder !== null
? smhiThunder + "%"
: "N/A"
}

`;

document.getElementById("copilot").innerHTML =
text;

// ÄNDRING: Uppdaterar "Dagens väder"-boxarna med de sammanslagna dygnsberäkningarna
document.getElementById("copilotTemp").textContent = Math.round(finalTodayTodayMin) + "° / " + Math.round(finalTodayMax) + "°";
document.getElementById("copilotRain").textContent = finalTodayRain + "%";
document.getElementById("copilotWind").textContent = finalTodayWind.toFixed(1) + " m/s"; // Skriver ut den sammanslagna dygnsvinden
document.getElementById("copilotThunder").textContent = copilotThunder + "%";
document.getElementById("copilotConfidence").textContent = confidence;
document.getElementById("copilotSources").textContent = smhiTemp !== null ? "2" : "1";

let forecastHTML = "";

for(let i = 0; i < 7; i++){

const dateStr = data.daily.time[i]; // Hämtar aktuellt datumsträng "YYYY-MM-DD"
const date = new Date(dateStr);

let omMax = data.daily.temperature_2m_max[i];
let omMin = data.daily.temperature_2m_min[i];
let omRain = data.daily.precipitation_probability_max[i];

let finalMax = omMax;
let finalMin = omMin;
let finalRain = omRain;

// KORRIGERING: Återställd och stängd loop för att binda ihop källornas 7-dagarsprognoser
if (smhiForecastDays[dateStr]) {
    const smhiTemps = smhiForecastDays[dateStr].temps;
    const smhiRains = smhiForecastDays[dateStr].rains;
    if (smhiTemps.length > 0) {
        finalMax = (omMax + Math.max(...smhiTemps)) / 2;
        finalMin = (omMin + Math.min(...smhiTemps)) / 2;
    }
    if (smhiRains.length > 0) {
        finalRain = Math.round((omRain + Math.max(...smhiRains)) / 2);
    }
}

forecastHTML += `
<div class="day">
<strong>
${date.toLocaleDateString(
"sv-SE",
{weekday:"short"}
)}
</strong>
<br><br>
🔺 ${Math.round(finalMax)}°
<br>
🔻 ${Math.round(finalMin)}°
<br><br>
🌧 ${finalRain}%
</div>
`;

}

document.getElementById("forecast").innerHTML =
