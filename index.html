<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Väder Torsby</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#1e293b;
    text-align:center;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1e293b;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.flex-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
}

.col {
    flex: 1;
    min-width: 300px;
}

.current{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
}

.info{
    flex:1;
    min-width:180px;
    background:#334155;
    border-radius:8px;
    padding:15px;
    text-align:center;
}

.label{
    font-size:14px;
    opacity:.8;
    margin-bottom: 5px;
}

.value{
    font-size:24px;
    font-weight:bold;
}

.small-label {
    font-size: 11px;
    opacity: 0.6;
    display: block;
    margin-top: 4px;
}

.forecast{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:10px;
}

.day{
    background:#334155;
    padding:12px;
    border-radius:8px;
    text-align:center;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

#status{
    text-align:center;
    margin-top:15px;
}
</style>

</head>
<body>

<header>
<h1>🌤 Väder Torsby</h1>
</header>

<div class="container">

<div class="card">
<div style="text-align:center;">
<button onclick="loadWeather()">
Uppdatera väder
</button>
</div>
<div id="status">
Laddar...
</div>
</div>

<div class="card">
<h2>Just nu (Jämförelse)</h2>
<div class="current">

<div class="info">
<div class="label">Temperatur</div>
<div class="value">
<span id="temp">-</span> / <span id="smhiTemp">-</span>
</div>
<span class="small-label">Meteo / SMHI</span>
</div>

<div class="info">
<div class="label">Vind</div>
<div class="value">
<span id="wind">-</span> / <span id="smhiWindVal">-</span>
</div>
<span class="small-label">Meteo / SMHI</span>
</div>

<div class="info">
<div class="label">Luftfuktighet</div>
<div class="value">
<span id="humidity">-</span> / <span id="smhiHumVal">-</span>
</div>
<span class="small-label">Meteo / SMHI</span>
</div>

<div class="info">
<div class="label">Regnrisk</div>
<div class="value">
<span id="rain">-</span> / <span id="smhiRainVal">-</span>
</div>
<span class="small-label">Meteo / SMHI</span>
</div>

</div>
</div>

<div class="flex-grid">
    <div class="card col">
        <h2>📊 Open-Meteo</h2>
        <div id="meteo-details">Laddar...</div>
    </div>
    
    <div class="card col">
        <h2>📊 SMHI</h2>
        <div id="smhi-details">Laddar...</div>
    </div>
</div>

<div class="card">
<h2>Copilot-bedömning</h2>
<div id="copilot">
Laddar...
</div>
</div>

<div class="card">
<h2>7-dagars prognos</h2>
<div id="forecast" class="forecast">
</div>
</div>

</div>

<script>

async function loadWeather(){

const status = document.getElementById("status");
status.textContent = "Hämtar väderdata...";

try{
    // 1. Hämta Open-Meteo data
    const openMeteoUrl = "https://open-meteo.com";
    const response = await fetch(openMeteoUrl);

    if(!response.ok){
        throw new Error("Open‑Meteo " + response.status);
    }
    const data = await response.json();

    let smhiTemp = null;
    let smhiWind = null;
    let smhiHumidity = null;
    let smhiRain = null;
    let smhiThunder = null;
    let smhiPressure = null;

    // 2. Hämta SMHI data (Genom CORS-proxy och med det nya SNOW1g-API:et)
    try{
        const targetSmhiUrl = "https://smhi.se";
        const smhiResponse = await fetch("https://corsproxy.io?" + encodeURIComponent(targetSmhiUrl));

        if(smhiResponse.ok){
            const smhiData = await smhiResponse.json();

            if(smhiData.timeSeries && smhiData.timeSeries.length > 0){
                // Ta parametrarna för den första tillgängliga tidspunkten (aktuell timme)
                const currentParams = smhiData.timeSeries[0].parameters;

                const tParam = currentParams.find(p => p.name === "t");
                const wsParam = currentParams.find(p => p.name === "ws");
                const rParam = currentParams.find(p => p.name === "r");
                const mslParam = currentParams.find(p => p.name === "msl");
                const pcatParam = currentParams.find(p => p.name === "pcat");

                if(tParam) smhiTemp = tParam.values[0];
                if(wsParam) smhiWind = wsParam.values[0];
                if(rParam) smhiHumidity = rParam.values[0];
                if(mslParam) smhiPressure = mslParam.values[0];
                if(pcatParam) smhiRain = pcatParam.values[0] > 0 ? "Ja" : "Nej";
                
                smhiThunder = 0; // Det nya API:et levererar inte åska direkt i denna nod
            }
        }
    }
    catch(smhiError){
        console.error("SMHI-fel:", smhiError);
    }

    // Variabler från Open-Meteo
    const temp = data.current.temperature_2m;
    const wind = data.current.wind_speed_10m;
    const humidity = data.current.relative_humidity_2m;
    const pressure = data.current.surface_pressure;
    const rain = data.daily.precipitation_probability_max[0];

    let openMeteoThunder = 0;
    if (rain > 30 && temp > 15 && humidity > 60) {
        openMeteoThunder = Math.min(Math.round((humidity - 50) * (temp / 10) * (rain / 100)), 100);
    } else if (rain > 10) {
        openMeteoThunder = Math.round(rain * 0.05);
    }

    // Uppdatera jämförelserutorna
    document.getElementById("temp").textContent = temp + "°";
    document.getElementById("wind").textContent = wind + " m/s";
    document.getElementById("humidity").textContent = humidity + "%";
    document.getElementById("rain").textContent = rain + "%";

    document.getElementById("smhiTemp").textContent = smhiTemp !== null ? smhiTemp + "°" : "N/A";
    document.getElementById("smhiWindVal").textContent = smhiWind !== null ? smhiWind + " m/s" : "N/A";
    document.getElementById("smhiHumVal").textContent = smhiHumidity !== null ? smhiHumidity + "%" : "N/A";
    document.getElementById("smhiRainVal").textContent = smhiRain !== null ? smhiRain : "N/A";

    // Text för Open-Meteo-kortet
    let meteoHTML = "";
    meteoHTML += "<b>Temperatur:</b> " + temp.toFixed(1) + "°C<br>";
    meteoHTML += "<b>Vindhastighet:</b> " + wind + " m/s<br>";
    meteoHTML += "<b>Luftfuktighet:</b> " + humidity + "%<br>";
    meteoHTML += "<b>Regnrisk:</b> " + rain + "%<br>";
    meteoHTML += "<b>Beräknad åskrisk:</b> " + openMeteoThunder + "%<br>";
    meteoHTML += "<b>Lufttryck:</b> " + pressure + " hPa";
    document.getElementById("meteo-details").innerHTML = meteoHTML;

    // Text för SMHI-kortet
    let smhiHTML = "";
    if(smhiTemp !== null){
        smhiHTML += "<b>Temperatur:</b> " + Number(smhiTemp).toFixed(1) + "°C<br>";
        smhiHTML += "<b>Vindhastighet:</b> " + smhiWind + " m/s<br>";
        smhiHTML += "<b>Luftfuktighet:</b> " + smhiHumidity + "%<br>";
        smhiHTML += "<b>Aktivt regn just nu:</b> " + smhiRain + "<br>";
        smhiHTML += "<b>Lufttryck (Havsnivå):</b> " + smhiPressure + " hPa";
    } else {
        smhiHTML = "<span style='color:#ef4444;'>Kunde inte hämta data från SMHI (CORS/API-fel).</span>";
    }
    document.getElementById("smhi-details").innerHTML = smhiHTML;

    // Copilot-bedömning (medeltemperatur)
    let copilotTemp = temp;
    if(smhiTemp !== null){
        copilotTemp = (temp + Number(smhiTemp)) / 2;
    }

    let text = "";
    if(rain < 20){
        text = "☀️ Hög sannolikhet för torrt och stabilt väder idag.";
    } else if(rain < 50){
        text = "🌤 Risk för enstaka skurar men mest uppehåll.";
    } else {
        text = "🌧 Förhöjd risk för regn idag.";
    }

    text += "<br><br><b>Beräknad medeltemperatur:</b> " + copilotTemp.toFixed(1) + "°C";
    text += "<br><b>Aktiva väderkällor:</b> " + (smhiTemp !== null ? "Open‑Meteo + SMHI" : "Endast Open‑Meteo");
    document.getElementById("copilot").innerHTML = text;

    // 7-dagars prognosbygge
    let forecastHTML = "";
    for(let i = 0; i < 7; i++){
        const date = new Date(data.daily.time[i]);
        forecastHTML += `
        <div class="day">
        <strong>${date.toLocaleDateString("sv-SE", {weekday:"short"})}</strong>
        <br><br>
        🔺 ${Math.round(data.daily.temperature_2m_max[i])}°
        <br>
        🔻 ${Math.round(data.daily.temperature_2m_min[i])}°
        <br><br>
        🌧 ${data.daily.precipitation_probability_max[i]}%
        </div>
        `;
    }
    document.getElementById("forecast").innerHTML = forecastHTML;

    status.textContent = "Senast uppdaterad: " + new Date().toLocaleTimeString("sv-SE");

}
catch(error){
    status.textContent = "Fel: " + error.message;
}

}

loadWeather();
setInterval(loadWeather,900000);

</script>

</body>
</html>
