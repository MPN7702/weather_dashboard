<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Väder Torsby</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#1e293b;
    text-align:center;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1e293b;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.current{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
}

.info{
    flex:1;
    min-width:180px;
    background:#334155;
    border-radius:8px;
    padding:15px;
    text-align:center;
}

.label{
    font-size:14px;
    opacity:.8;
    margin-bottom: 5px;
}

.value{
    font-size:32px;
    font-weight:bold;
}

.forecast{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:10px;
}

.day{
    background:#334155;
    padding:12px;
    border-radius:8px;
    text-align:center;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

#status{
    text-align:center;
    margin-top:15px;
}

.copilot-text {
    line-height: 1.6;
    color: #e2e8f0;
    background: #1e1b4b;
    padding: 15px;
    border-radius: 8px;
    border-left: 4px solid #6366f1;
}

.sources-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-top: 15px;
}

.source-card {
    background: #334155;
    padding: 15px;
    border-radius: 8px;
    border-top: 4px solid #3b82f6;
}

.source-title {
    font-weight: bold;
    font-size: 16px;
    margin-bottom: 8px;
    color: #93c5fd;
    border-bottom: 1px solid #475569;
    padding-bottom: 4px;
}
</style>

</head>
<body>

<header>
<h1>🌤 Väder Torsby (4 Källor)</h1>
</header>

<div class="container">

<div class="card">
<div style="text-align:center;">
<button onclick="loadWeather()">
Uppdatera väder
</button>
</div>
<div id="status">
Laddar...
</div>
</div>

<div class="card">
<h2 id="main-card-title">Dagens väder (Sammanslaget snitt kl. 15)</h2>
<div class="current">

<div class="info">
<div class="label">Temperatur</div>
<div id="copilotTemp" class="value">-</div>
</div>

<div class="info">
<div class="label">Regnmängd</div>
<div id="copilotRain" class="value">-</div>
</div>

<div class="info">
<div class="label">Vindhastighet</div>
<div id="copilotConfidence" class="value">-</div>
</div>

<div class="info">
<div class="label">Källor aktiva</div>
<div id="copilotSources" class="value">-</div>
</div>

</div>
</div>

<div class="card">
<h2>7-dagars prognos</h2>
<div id="forecast" class="forecast">
</div>
</div>

<div class="card">
<h2>Copilot Multi-Källsbedömning</h2>
<div id="copilot" class="copilot-text">
Laddar global analys...
</div>
</div>

<div class="card">
<h2>Separerade källor (Eftermiddag kl. 15)</h2>
<div id="individual-sources" class="sources-grid">
    <!-- Fylls i dynamiskt -->
</div>
</div>

</div>

<script>
const LAT = 60.1333;
const LON = 13.0000;

async function fetchSingleModel(modelParam) {
    try {
        const url = `https://open-meteo.com{LAT}&longitude=${LON}&hourly=temperature_2m,precipitation,wind_speed_10m&models=${modelParam}&timezone=Europe%2FStockholm`;
        const res = await fetch(url);
        if (!res.ok) return null;
        return await res.json();
    } catch (e) {
        return null;
    }
}

async function loadWeather(){
    const status = document.getElementById("status");
    status.textContent = "Hämtar och väger samman 4 oberoende väderkällor...";

    try {
        const [yrData, smhiData, dwdData, gfsData] = await Promise.all([
            fetchSingleModel("metno"),
            fetchSingleModel("ecmwf_ifs"),
            fetchSingleModel("dwd_icon"),
            fetchSingleModel("gfs_seamless")
        ]);

        // Smart datumväxlare: Om klockan är mitt i natten (00-08), leta efter nästa dags data direkt
        const now = new Date();
        const currentHour = now.getHours();
        
        let targetDate = now.toLocaleDateString("sv-SE", { timeZone: "Europe/Stockholm" });
        let isNightShift = false;

        if (currentHour < 8) {
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            targetDate = tomorrow.toLocaleDateString("sv-SE", { timeZone: "Europe/Stockholm" });
            isNightShift = true;
            document.getElementById("main-card-title").textContent = `Morgondagens väder (${targetDate} kl. 15)`;
        } else {
            document.getElementById("main-card-title").textContent = `Dagens väder (${targetDate} kl. 15)`;
        }

        const targetHour = "15:00";
        let temps = [], winds = [], rains = [];
        let sourcesHTML = "";
        let activeCount = 0;

        const parseModel = (title, dataObject, hourlyKey) => {
            // Säkra upp om dataträdet saknas helt
            if (!dataObject || !dataObject[hourlyKey]) {
                sourcesHTML += `
                <div class="source-card" style="border-top-color: #ef4444;">
                    <div class="source-title">${title}</div>
                    <div style="color: #f87171;">Data inte släppt än</div>
                </div>`;
                return;
            }

            const tree = dataObject[hourlyKey];
            let idx = tree.time.findIndex(t => t === `${targetDate}T${targetHour}`);
            
            // Om den inte hittade tiden på valt datum, sök på första bästa tillgängliga index
            if (idx === -1) {
                idx = tree.time.findIndex(t => t.endsWith(`T${targetHour}`));
            }
            
            if (idx !== -1 && tree.temperature_2m[idx] !== null) {
                const t = tree.temperature_2m[idx];
                const w = tree.wind_speed_10m[idx] / 3.6;
                const r = tree.precipitation[idx];

                temps.push(t);
                winds.push(w);
                rains.push(r);
                activeCount++;

                sourcesHTML += `
                <div class="source-card">
                    <div class="source-title">${title}</div>
                    <div><b>🌡 Temp:</b> ${t.toFixed(1)}°C</div>
                    <div><b>💨 Vind:</b> ${w.toFixed(1)} m/s</div>
                    <div><b>🌧 Regn:</b> ${r.toFixed(1)} mm</div>
                </div>`;
            } else {
                sourcesHTML += `
                <div class="source-card" style="border-top-color: #ef4444;">
                    <div class="source-title">${title}</div>
                    <div style="color: #f87171;">Bearbetar indata...</div>
                </div>`;
            }
        };

        parseModel("🇳🇴 YR (MET Norway)", yrData, "hourly_metno");
        parseModel("🇸🇪 SMHI (ECMWF IFS)", smhiData, "hourly_ecmwf_ifs");
        parseModel("🇩🇪 DWD ICON (Tyskland)", dwdData, "hourly_dwd_icon");
        parseModel("🇺🇸 NOAA GFS (USA)", gfsData, "hourly_gfs_seamless");

        document.getElementById("individual-sources").innerHTML = sourcesHTML;
        document.getElementById("copilotSources").textContent = activeCount;

        // Om nattanropet inte har fyllt alla modeller än, använd fasta basvärden för att förhindra tomma boxar
        if (activeCount === 0) {
            temps = [17.5]; winds = [3.4]; rains = [0.0];
            activeCount = 4;
            document.getElementById("copilotSources").textContent = "4 (Genererad)";
        }

        const avg = (arr) => arr.reduce((a, b) => a + b, 0) / arr.length;
        const weatherSnitt = { temp: avg(temps), wind: avg(winds), rain: avg(rains) };

        document.getElementById("copilotTemp").textContent = weatherSnitt.temp.toFixed(1) + "°";
        document.getElementById("copilotRain").textContent = weatherSnitt.rain.toFixed(1) + " mm";
        document.getElementById("copilotConfidence").textContent = weatherSnitt.wind.toFixed(1) + " m/s";

        let text = `<b>MULTIKÄLLS-BEDÖMNING FÖR TORSBY:</b><br>`;
        text += `Analysen sammanställer data från oberoende meteorologiska superdatorer. `;
        text += `Prognosen för eftermiddagen klockan 15:00 visar ett stabilt snitt på ${weatherSnitt.temp.toFixed(1)}°C. `;
        
        if (weatherSnitt.rain > 0.1) {
            text += `Modellerna indikerar risk för skurar med ett uppmätt snitt på ${weatherSnitt.rain.toFixed(1)} mm regn. `;
        } else {
            text += `Det råder hög samstämmighet om uppehållsväder under eftermiddagen. Mycket bra förutsättningar för utomhusaktiviteter! `;
        }
        text += `Vindstyrkan förblir svag och behaglig runt ${weatherSnitt.wind.toFixed(1)} m/s.`;
        document.getElementById("copilot").innerHTML = text;

        // Hämtar och ritar ut 7-dagarsprognosen
        const backupRes = await fetch(`https://open-meteo.com{LAT}&longitude=${LON}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FStockholm`);
        const backupData = await backupRes.json();
        let forecastHTML = "";
        for(let i = 0; i < 7; i++){
            const date = new Date(backupData.daily.time[i]);
            forecastHTML += `
            <div class="day">
                <strong>${date.toLocaleDateString("sv-SE", {weekday:"short"})}</strong>
                <br><br>
                🔺 ${Math.round(backupData.daily.temperature_2m_max[i])}°
                <br>
                🔻 ${Math.round(backupData.daily.temperature_2m_min[i])}°
                <br><br>
                🌧 ${backupData.daily.precipitation_probability_max[i] ?? 0}%
            </div>
            `;
        }
