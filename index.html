<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Väder Torsby</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#1e293b;
    text-align:center;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1e293b;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.current{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
}

.info{
    flex:1;
    min-width:180px;
    background:#334155;
    border-radius:8px;
    padding:15px;
    text-align:center;
}

.label{
    font-size:14px;
    opacity:.8;
}

.value{
    font-size:26px;
    font-weight:bold;
}

.forecast{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:10px;
}

.day{
    background:#334155;
    padding:12px;
    border-radius:8px;
    text-align:center;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

#status{
    text-align:center;
    margin-top:15px;
}
</style>

</head>
<body>

<header>
<h1>🌤 Väder Torsby</h1>
</header>

<div class="container">

<div class="card">

<div style="text-align:center;">
<button onclick="loadWeather()">
Uppdatera väder
</button>
</div>

<div id="status">
Laddar...
</div>

</div>

<div class="card">

<h2>Dagens väder</h2>

<div class="current">

<div class="info">
<div class="label">Temperatur</div>
<div id="copilotTemp" class="value">-</div>
</div>

<div class="info">
<div class="label">Regnrisk</div>
<div id="copilotRain" class="value">-</div>
</div>

<div class="info">
<div class="label">Åskrisk</div>
<div id="copilotThunder" class="value">-</div>
</div>

<div class="info">
<div class="label">Säkerhet</div>
<div id="copilotConfidence" class="value">-</div>
</div>

<div class="info">
<div class="label">Källor</div>
<div id="copilotSources" class="value">-</div>
</div>

</div>

</div>

<div class="card">

<h2>7-dagars prognos</h2>

<div id="forecast" class="forecast">
</div>

</div>

<div class="card">

<h2>Källor</h2>

<div id="copilot">
Laddar...
</div>

</div>

</div>

<script>

const LAT = 60.1333;
const LON = 13.0;

async function loadWeather(){

const status =
document.getElementById("status");

status.textContent =
"Hämtar väderdata...";

try{
// Felsäker URL till Open-Meteo med Torsbys fasta koordinater
const openMeteoUrl =
"https://open-meteo.com";

const response =
await fetch(openMeteoUrl);

if(!response.ok){
    throw new Error(
        "Open‑Meteo " +
        response.status
    );
}

const data =
await response.json();

let smhiTemp = null;
let smhiWind = null;
let smhiHumidity = null;
let smhiRain = null;
let smhiThunder = null;
let smhiPressure = null;

let smhiTodayTemps = [];
let smhiTodayRains = [];

try{
    // LÖSNING: Vi går runt din blockerade Cloudflare-worker helt och hämtar SMHI:s officiella data säkert via AllOrigins-proxy
    const smhiTargetUrl = "https://smhi.se";
    const proxyUrl = `https://allorigins.win{encodeURIComponent(smhiTargetUrl)}`;

    const smhiResponse = await fetch(proxyUrl);

    if(smhiResponse.ok){

        const proxyData = await smhiResponse.json();
        const smhiData = JSON.parse(proxyData.contents);

        if(
            smhiData &&
            smhiData.timeSeries &&
            smhiData.timeSeries.length > 0
        ){
            // Hämtar ut realtidsvärden från den första timmen i tidsserien
            const firstSlot = smhiData.timeSeries[0];
            if(firstSlot && firstSlot.parameters) {
                const tParam = firstSlot.parameters.find(p => p.name === "t");
                const wsParam = firstSlot.parameters.find(p => p.name === "ws");
                const rParam = firstSlot.parameters.find(p => p.name === "r");
                const pmeanParam = firstSlot.parameters.find(p => p.name === "pmean");
                const tstmParam = firstSlot.parameters.find(p => p.name === "tstm");
                const mslParam = firstSlot.parameters.find(p => p.name === "msl");

                if(tParam) smhiTemp = tParam.values[0];
                if(wsParam) smhiWind = wsParam.values[0];
                if(rParam) smhiHumidity = rParam.values[0];
                if(pmeanParam) smhiRain = pmeanParam.values[0] > 0 ? 100 : 0;
                if(tstmParam) smhiThunder = tstmParam.values[0];
                if(mslParam) smhiPressure = mslParam.values[0];
            }

            // Samlar in alla timprognoser för det aktuella dygnet
            const todayStr = data.daily.time[0]; // "YYYY-MM-DD"
            smhiData.timeSeries.forEach(slot => {
                if(slot.validTime && slot.validTime.startsWith(todayStr) && slot.parameters) {
                    const t = slot.parameters.find(p => p.name === "t");
                    const pmean = slot.parameters.find(p => p.name === "pmean");
                    if(t && t.values) smhiTodayTemps.push(t.values[0]);
                    if(pmean && pmean.values) smhiTodayRains.push(pmean.values[0] > 0 ? 100 : 0);
                }
            });
        }

    }

}
catch(smhiError){
    console.error("SMHI-fel via proxy:", smhiError);
}

const temp =
data.current.temperature_2m;

const wind =
data.current.wind_speed_10m;

const humidity =
data.current.relative_humidity_2m;

const rain =
data.daily.precipitation_probability_max[0];

// Beräknar en kombinerad dygnsbedömning för hela dagen (max/min & dygnsregnrisk)
let finalTodayMin = data.daily.temperature_2m_min[0];
let finalTodayMax = data.daily.temperature_2m_max[0];
let copilotRain = rain;

if(smhiTodayTemps.length > 0) {
    const smhiMin = Math.min(...smhiTodayTemps);
    const smhiMax = Math.max(...smhiTodayTemps);
    finalTodayMin = (finalTodayMin + smhiMin) / 2;
    finalTodayMax = (finalTodayMax + smhiMax) / 2;
}

if(smhiTodayRains.length > 0) {
    const smhiMaxRain = Math.max(...smhiTodayRains);
    copilotRain = Math.round((rain + smhiMaxRain) / 2);
}

let confidence = "Hög";

if(
    smhiTemp !== null &&
    Math.abs(temp - smhiTemp) > 3
){
    confidence = "Medel";
}

let copilotThunder =
smhiThunder !== null
? smhiThunder
: 0;

let text = `
<b>OPEN‑METEO</b>
<br>
Temperatur: ${temp.toFixed(1)}°C
<br>
Vind: ${wind.toFixed(1)} m/s
<br>
Luftfuktighet: ${humidity}%
<br>
Regnrisk: ${rain}%

<br><br>

<b>SMHI</b>
<br>
Temperatur: ${
smhiTemp !== null
? smhiTemp.toFixed(1) + "°C"
: "N/A"
}
<br>
Vind: ${
smhiWind !== null
? smhiWind.toFixed(1) + " m/s"
: "N/A"
}
<br>
Luftfuktighet: ${
smhiHumidity !== null
? smhiHumidity + "%"
: "N/A"
}
<br>
Lufttryck: ${
smhiPressure !== null
? smhiPressure + " hPa"
: "N/A"
}
<br>
Regnrisk: ${
smhiRain !== null
? smhiRain + "%"
: "N/A"
}
<br>
Åskrisk: ${
smhiThunder !== null
? smhiThunder + "%"
: "N/A"
}
`;

document.getElementById("copilot").innerHTML =
text;

document.getElementById("copilotTemp").textContent = Math.round(finalTodayMin) + "° / " + Math.round(finalTodayMax) + "°";
document.getElementById("copilotRain").textContent = copilotRain + "%";
document.getElementById("copilotThunder").textContent = copilotThunder + "%";
document.getElementById("copilotConfidence").textContent = confidence;
document.getElementById("copilotSources").textContent = smhiTemp !== null ? "2" : "1";

let forecastHTML = "";

for(let i = 0; i < 7; i++){
const date =
new Date(data.daily.time[i]);

forecastHTML += `
<div class="day">
<strong>
${date.toLocaleDateString(
"sv-SE",
{weekday:"short"}
)}
</strong>
<br><br>
🔺 ${Math.round(data.daily.temperature_2m_max[i])}°
<br>
🔻 ${Math.round(data.daily.temperature_2m_min[i])}°
<br><br>
🌧 ${data.daily.precipitation_probability_max[i]}%
</div>
`;
}

document.getElementById("forecast").innerHTML =
forecastHTML;

status.textContent =
"Senast uppdaterad: " +
new Date().toLocaleTimeString("sv-SE");

}
catch(error){
    status.textContent = "Fel: " + error.message;
}

}

loadWeather();
setInterval(loadWeather,900000);
</script>

</body>
</html>
