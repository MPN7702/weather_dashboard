<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Väder Torsby</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#1e293b;
    text-align:center;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1e293b;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.current{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
}

.info{
    flex:1;
    min-width:180px;
    background:#334155;
    border-radius:8px;
    padding:15px;
    text-align:center;
}

.label{
    font-size:14px;
    opacity:.8;
    margin-bottom: 5px;
}

.value{
    font-size:32px;
    font-weight:bold;
}

.forecast{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:10px;
}

.day{
    background:#334155;
    padding:12px;
    border-radius:8px;
    text-align:center;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

#status{
    text-align:center;
    margin-top:15px;
}

.copilot-text {
    line-height: 1.6;
    color: #e2e8f0;
    background: #1e1b4b;
    padding: 15px;
    border-radius: 8px;
    border-left: 4px solid #6366f1;
}

/* Stil för de separerade källorna */
.sources-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-top: 15px;
}

.source-card {
    background: #334155;
    padding: 15px;
    border-radius: 8px;
    border-top: 4px solid #3b82f6;
}

.source-title {
    font-weight: bold;
    font-size: 16px;
    margin-bottom: 8px;
    color: #93c5fd;
    border-b: 1px solid #475569;
    padding-bottom: 4px;
}
</style>

</head>
<body>

<header>
<h1>🌤 Väder Torsby (4 Källor)</h1>
</header>

<div class="container">

<div class="card">
<div style="text-align:center;">
<button onclick="loadWeather()">
Uppdatera väder
</button>
</div>
<div id="status">
Laddar...
</div>
</div>

<div class="card">
<h2>Dagens väder (Sammanslaget snitt kl. 15)</h2>
<div class="current">

<div class="info">
<div class="label">Temperatur</div>
<div id="copilotTemp" class="value">-</div>
</div>

<div class="info">
<div class="label">Regnmängd</div>
<div id="copilotRain" class="value">-</div>
</div>

<div class="info">
<div class="label">Vindhastighet</div>
<div id="copilotConfidence" class="value">-</div>
</div>

<div class="info">
<div class="label">Källor aktiva</div>
<div id="copilotSources" class="value">4</div>
</div>

</div>
</div>

<div class="card">
<h2>7-dagars prognos</h2>
<div id="forecast" class="forecast">
</div>
</div>

<div class="card">
<h2>Copilot Multi-Källsbedömning</h2>
<div id="copilot" class="copilot-text">
Laddar global analys...
</div>
</div>

<!-- NYTT BLOCK: Separerade källor visas här oberoende av varandra -->
<div class="card">
<h2>Individuella källor (Eftermiddag kl. 15)</h2>
<div id="individual-sources" class="sources-grid">
    <!-- Fylls i dynamiskt av JavaScript -->
</div>
</div>

</div>

<script>
async function loadWeather(){
    const status = document.getElementById("status");
    status.textContent = "Hämtar och väger samman 4 globala källor...";

    try {
        // Rent, skottsäkert API-anrop utan thunderstorm_probability för att förhindra alla typer av 400 JSON-fel [2026-08-28]
        const openMeteoUrl = "https://open-meteo.com";
        
        const response = await fetch(openMeteoUrl);
        if(!response.ok) throw new Error("Kunde inte hämta data från API-servern.");
        const data = await response.json();

        const todayStr = new Date().toLocaleDateString("sv-SE", { timeZone: "Europe/Stockholm" });
        const targetHour = "15:00";

        // Objekten där vi sparar källorna var för sig
        let sourcesData = {
            "Yr (Norge)": { temp: 0, wind: 0, rain: 0 },
            "ECMWF (Europa)": { temp: 0, wind: 0, rain: 0 },
            "ICON (Tyskland)": { temp: 0, wind: 0, rain: 0 },
            "GFS (USA)": { temp: 0, wind: 0, rain: 0 }
        };

        let periods = { temps: [], winds: [], rains: [] };

        // Hjälpfunktion för att plocka ut exakt data per källa för kl 15:00 idag
        const parseSource = (sourceName, hourlyTree) => {
            if (!hourlyTree || !hourlyTree.time) return;
            const idx = hourlyTree.time.findIndex(t => t === `${todayStr}T${targetHour}`);
            if (idx !== -1) {
                const t = hourlyTree.temperature_2m[idx];
                const w = hourlyTree.wind_speed_10m[idx] / 3.6; // km/h till m/s
                const r = hourlyTree.precipitation[idx];

                sourcesData[sourceName] = { temp: t, wind: w, rain: r };

                periods.temps.push(t);
                periods.winds.push(w);
                periods.rains.push(r);
            }
        };

        // Kör parsen för de fyra unika träden i API-svaret [2026-08-28]
        parseSource("Yr (Norge)", data.hourly_metno || data.hourly);
        parseSource("ECMWF (Europa)", data.hourly_ecmwf_ifs);
        parseSource("ICON (Tyskland)", data.hourly_dwd_icon);
        parseSource("GFS (USA)", data.hourly_gfs_seamless);

        // Räkna ut det sammanslagna medelvärdet
        const avg = (arr) => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;

        const weatherSnitt = {
            temp: avg(periods.temps),
            wind: avg(periods.winds),
            rain: avg(periods.rains)
        };

        // Montera värdena i huvudboxarna
        document.getElementById("copilotTemp").textContent = weatherSnitt.temp.toFixed(1) + "°";
        document.getElementById("copilotRain").textContent = weatherSnitt.rain.toFixed(1) + " mm";
        document.getElementById("copilotConfidence").textContent = weatherSnitt.wind.toFixed(1) + " m/s";

        // Skapa textbedömningen
        let text = `<b>MULTIKÄLLS-BEDÖMNING FÖR TORBY IDAG:</b><br>`;
        text += `Genom att sammanfoga data från 4 oberoende meteorologiska superdatorer kan vi presentera en stabil analys för eftermiddagen. `;
        text += `Temperatursnittet för Torsby landar runt ${weatherSnitt.temp.toFixed(1)}°C. `;
        
        if (weatherSnitt.rain > 0.2) {
            text += `Majoriteten av modellerna indikerar lätta skurar i området med ett beräknat snitt på ${weatherSnitt.rain.toFixed(1)} mm regn. `;
        } else {
            text += `Samtliga 4 källor uppvisar en hög samstämmighet om en torr och stabil eftermiddag utan nederbörd. `;
        }
        text += `Vindarna förblir trygga och ligger i snitt på ${weatherSnitt.wind.toFixed(1)} m/s.`;
        document.getElementById("copilot").innerHTML = text;

        // Skapa de separerade källkorten längst ner
        let sourcesHTML = "";
        for (const [key, value] of Object.entries(sourcesData)) {
            sourcesHTML += `
            <div class="source-card">
                <div class="source-title">${key}</div>
                <div>🌡 <b>Temp:</b> ${value.temp.toFixed(1)}°C</div>
                <div>💨 <b>Vind:</b> ${value.wind.toFixed(1)} m/s</div>
                <div>🌧 <b>Regn:</b> ${value.rain.toFixed(1)} mm</div>
            </div>
            `;
        }
        document.getElementById("individual-sources").innerHTML = sourcesHTML;

        // Montera 7-dagarsprognosen
        let forecastHTML = "";
        for(let i = 0; i < 7; i++){
            const date = new Date(data.daily.time[i]);
            forecastHTML += `
            <div class="day">
                <strong>${date.toLocaleDateString("sv-SE", {weekday:"short"})}</strong>
                <br><br>
                🔺 ${Math.round(data.daily.temperature_2m_max[i])}°
                <br>
                🔻 ${Math.round(data.daily.temperature_2m_min[i])}°
                <br><br>
                🌧 ${data.daily.precipitation_probability_max[i]}%
            </div>
            `;
        }
        document.getElementById("forecast").innerHTML = forecastHTML;

        status.textContent = "Senast uppdaterad: " + new Date().toLocaleTimeString("sv-SE") + " (4 källor separerade)";

      } catch(error) {
        status.textContent = "Fel vid sammanvägning: " + error.message;
        document.getElementById("copilot").innerHTML = "Kunde inte slå samman de 4 källorna.";
    }
}

// Kör direkt
loadWeather();
setInterval(loadWeather, 900000);
</script>

</body>
</html>
