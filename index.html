<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torsby Väder</title>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    margin:0;
    padding:20px;
}

.card{
    background:#1e293b;
    max-width:600px;
    margin:auto;
    padding:20px;
    border-radius:10px;
}

.value{
    font-size:32px;
    font-weight:bold;
    margin:10px 0;
}

button{
    padding:10px 20px;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="card">
    <h1>🌤 Copilot Weather Torsby</h1>

    <button onclick="loadWeather()">
        Uppdatera
    </button>

    <h2>Temperatur</h2>
    <div id="temp" class="value">-</div>

    <h2>Vind</h2>
    <div id="wind" class="value">-</div>

    <h2>Status</h2>
    <div id="status">Redo</div>
</div>

<script>

async function loadWeather() {

    document.getElementById("status").textContent =
    "Hämtar data...";

    try {

        const response = await fetch(
            "https://api.open-meteo.com/v1/forecast?latitude=60.1333&longitude=13.0&current=temperature_2m,wind_speed_10m"
        );

        const data = await response.json();

        document.getElementById("temp").textContent =
            data.current.temperature_2m + " °C";

        document.getElementById("wind").textContent =
            data.current.wind_speed_10m + " m/s";

        document.getElementById("status").textContent =
            "Uppdaterad";

    }
    catch(err){

        document.getElementById("status").textContent =
            "Fel: " + err.message;

    }
}

loadWeather();

</script>

</body>
</html>
