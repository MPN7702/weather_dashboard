<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Väder Torsby</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#1e293b;
    text-align:center;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1e293b;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.current{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
}

.info{
    flex:1;
    min-width:180px;
    background:#334155;
    border-radius:8px;
    padding:15px;
    text-align:center;
}

.label{
    font-size:14px;
    opacity:.8;
}

.value{
    font-size:32px;
    font-weight:bold;
}

.forecast{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:10px;
}

.day{
    background:#334155;
    padding:12px;
    border-radius:8px;
    text-align:center;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

#status{
    text-align:center;
    margin-top:15px;
}
</style>

</head>
<body>

<header>
<h1>🌤 Väder Torsby</h1>
</header>

<div class="container">

<div class="card">

<div style="text-align:center;">
<button onclick="loadWeather()">
Uppdatera väder
</button>
</div>

<div id="status">
Laddar...
</div>

</div>

<div class="card">

<h2>Just nu</h2>

<div class="current">

<div class="info">
<div class="label">Open‑Meteo Temp</div>
<div id="temp" class="value">-</div>
</div>

<div class="info">
<div class="label">SMHI Temp</div>
<div id="smhiTemp" class="value">-</div>
</div>

<div class="info">
<div class="label">Vind (Open-Meteo)</div>
<div id="wind" class="value">-</div>
</div>

<div class="info">
<div class="label">Luftfuktighet (Open-Meteo)</div>
<div id="humidity" class="value">-</div>
</div>

<div class="info">
<div class="label">Regnrisk idag</div>
<div id="rain" class="value">-</div>
</div>

</div>

</div>

<div class="card">

<h2>Copilot-bedömning</h2>

<div id="copilot">
Laddar...
</div>

</div>

<div class="card">

<h2>7-dagars prognos</h2>

<div id="forecast" class="forecast">
</div>

</div>

</div>

<script>

const LAT = 60.1333;
const LON = 13.0;

async function loadWeather(){

const status =
document.getElementById("status");

status.textContent =
"Hämtar väderdata...";

try{
// KORRIGERAD LÄNK: Hela sökvägen till api.open-meteo.com är återställd
const openMeteoUrl = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON + "&current=temperature_2m,relative_humidity_2m,wind_speed_10m,surface_pressure&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FStockholm";

const response =
await fetch(openMeteoUrl);

if(!response.ok){
    throw new Error(
        "Open‑Meteo " +
        response.status
    );
}

const data =
await response.json();

let smhiTemp = null;
let smhiWind = null;
let smhiHumidity = null;
let smhiRain = null;
let smhiThunder = null;
let smhiPressure = null;

try{

    const smhiResponse =
    await fetch(
        "https://workers.dev"
    );

    if(smhiResponse.ok){

        const smhiData =
        await smhiResponse.json();

        if(
            smhiData.timeSeries &&
            smhiData.timeSeries.length > 0 &&
            smhiData.timeSeries.data
        ){

            const current =
            smhiData.timeSeries.data;

            smhiTemp =
            current.air_temperature !== undefined ? current.air_temperature : null;

            smhiWind =
            current.wind_speed !== undefined ? current.wind_speed : null;

            smhiHumidity =
            current.relative_humidity !== undefined ? current.relative_humidity : null;

            smhiRain =
            current.probability_of_precipitation !== undefined ? current.probability_of_precipitation : null;

            smhiThunder =
            current.thunderstorm_probability !== undefined ? current.thunderstorm_probability : null;

            smhiPressure =
            current.air_pressure_at_mean_sea_level !== undefined ? current.air_pressure_at_mean_sea_level : null;

        }

    }

}
catch(smhiError){

    console.error(
        "SMHI-fel:",
        smhiError
    );

}

const temp =
data.current.temperature_2m;

const wind =
data.current.wind_speed_10m;

const humidity =
data.current.relative_humidity_2m;

const pressure =
data.current.surface_pressure;

const rain =
data.daily.precipitation_probability_max[0];

let openMeteoThunder = 0;
if (rain > 30 && temp > 15 && humidity > 60) {
    openMeteoThunder = Math.min(Math.round((humidity - 50) * (temp / 10) * (rain / 100)), 100);
} else if (rain > 10) {
    openMeteoThunder = Math.round(rain * 0.05);
}

document.getElementById("temp").textContent =
temp + "°";

document.getElementById("wind").textContent =
wind + " m/s";

document.getElementById("humidity").textContent =
humidity + "%";

document.getElementById("rain").textContent =
rain + "%";

document.getElementById("smhiTemp").textContent =
smhiTemp !== null
? smhiTemp + "°"
: "N/A";

let copilotTemp =
temp;

if(smhiTemp !== null){

copilotTemp =
(
temp +
smhiTemp
) / 2;

}

let text = "";

if(rain < 20){

text =
"☀️ Hög sannolikhet för torrt och stabilt väder idag.";

}
else if(rain < 50){

text =
"🌤 Risk för enstaka skurar men mest uppehåll.";

}
else{

text =
"🌧 Förhöjd risk för regn idag.";

}

text +=
"<br><br><b>Open‑Meteo:</b> " +
temp.toFixed(1) +
"°C";

text +=
"<br><b>Open-Meteo Vind:</b> " +
wind +
" m/s";

text +=
"<br><b>Open-Meteo Luftfuktighet:</b> " +
humidity +
"%";

text +=
"<br><b>Open-Meteo Regnrisk:</b> " +
rain +
"%";

text +=
"<br><b>Open-Meteo Åskrisk:</b> " +
openMeteoThunder +
"%";

text +=
"<br><b>Open-Meteo Lufttryck:</b> " +
pressure +
" hPa";

if(smhiTemp !== null){

text +=
"<br><br><b>SMHI:</b> " +
Number(smhiTemp).toFixed(1) +
"°C";

text +=
"<br><b>SMHI Vind:</b> " +
(smhiWind !== null ? smhiWind + " m/s" : "N/A");

text +=
"<br><b>SMHI Luftfuktighet:</b> " +
(smhiHumidity !== null ? smhiHumidity + "%" : "N/A");

text +=
"<br><b>SMHI Regnrisk:</b> " +
(smhiRain !== null ? smhiRain + "%" : "N/A");

text +=
"<br><b>SMHI Åskrisk:</b> " +
(smhiThunder !== null ? smhiThunder + "%" : "N/A");

text +=
"<br><b>SMHI Lufttryck:</b> " +
(smhiPressure !== null ? smhiPressure + " hPa" : "N/A");

}

text +=
"<br><br><b>Copilot Genomsnittstemp:</b> " +
copilotTemp.toFixed(1) +
"°C";

text +=
"<br><br><b>Källor:</b> " +
(smhiTemp !== null
? "Open‑Meteo + SMHI"
: "Open‑Meteo");

document.getElementById("copilot").innerHTML =
text;

let forecastHTML = "";

for(let i = 0; i < 7; i++){

const date =
new Date(data.daily.time[i]);

forecastHTML += `
<div class="day">
<strong>
${date.toLocaleDateString(
"sv-SE",
{weekday:"short"}
)}
</strong>
<br><br>
🔺 ${Math.round(data.daily.temperature_2m_max[i])}°
<br>
🔻 ${Math.round(data.daily.temperature_2m_min[i])}°
<br><br>
🌧 ${data.daily.precipitation_probability_max[i]}%
</div>
`;

}

document.getElementById("forecast").innerHTML =
forecastHTML;

status.textContent =
"Senast uppdaterad: " +
new Date().toLocaleTimeString("sv-SE");

}
catch(error){

status.textContent =
"Fel: " + error.message;

}

}

loadWeather();

setInterval(loadWeather,900000);

</script>

</body>
</html>
