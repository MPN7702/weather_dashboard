<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Väder Torsby</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#1e293b;
    text-align:center;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1e293b;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.current{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
}

.info{
    flex:1;
    min-width:180px;
    background:#334155;
    border-radius:8px;
    padding:15px;
    text-align:center;
}

.label{
    font-size:14px;
    opacity:.8;
}

.value{
    font-size:32px;
    font-weight:bold;
}

.forecast{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:10px;
}

.day{
    background:#334155;
    padding:12px;
    border-radius:8px;
    text-align:center;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

#status{
    text-align:center;
    margin-top:15px;
}

.source-clean-box {
    line-height: 1.8;
    font-size: 16px;
    color: #f1f5f9;
    padding: 10px 5px;
}
.source-clean-box b {
    color: #38bdf8;
    text-transform: uppercase;
}
</style>

</head>
<body>

<header>
<h1>🌤 Väder Torsby</h1>
</header>

<div class="container">

<div class="card">
<div style="text-align:center;">
<button onclick="loadWeather()">
Uppdatera väder
</button>
</div>
<div id="status">
Laddar...
</div>
</div>

<div class="card">
<h2>Dagens väder</h2>
<div class="current">
<div class="info"><div class="label">Temperatur</div><div id="copilotTemp" class="value">-</div></div>
<div class="info"><div class="label">Regnrisk</div><div id="copilotRain" class="value">-</div></div>
<div class="info"><div class="label">Åskrisk</div><div id="copilotThunder" class="value">-</div></div>
<div class="info"><div class="label">Säkerhet</div><div id="copilotConfidence" class="value">-</div></div>
<div class="info"><div class="label">Källor</div><div id="copilotSources" class="value">-</div></div>
</div>
</div>

<div class="card">
<h2>7-dagars prognos</h2>
<div id="forecast" class="forecast"></div>
</div>

<div class="card">
<h2>Källor</h2>
<div id="copilot">
Laddar källredovisning...
</div>
</div>

</div>

<script>
const LAT = 60.1333;
const LON = 13.0;

async function loadWeather(){
    const status = document.getElementById("status");
    status.textContent = "Hämtar data via CORS-proxy...";

    try{
        // Vi skickar anropet genom en öppen CORS-proxy som lägger till de tillåtande säkerhetsnycklarna som webbläsaren kräver på GitHub Pages [2026-08-28]
        const openMeteoUrl = `https://open-meteo.com{LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FStockholm`;
        const proxyUrl = `https://allorigins.win{encodeURIComponent(openMeteoUrl)}`;
        
        const response = await fetch(proxyUrl);
        if(!response.ok) throw new Error("Proxyserver fel: " + response.status);
        const proxyData = await response.json();
        
        // AllOrigins lägger det riktiga API-svaret som en textsträng inuti fältet .contents [2026-08-28]
        const data = JSON.parse(proxyData.contents);

        // Extrahera realtidsmätningen
        const temp = data.current.temperature_2m;
        const wind = data.current.wind_speed_10m;
        const humidity = data.current.relative_humidity_2m;
        const rain = data.daily.precipitation_probability_max[0] ?? 0;

        // Fasta värden baserade på din SMHI-specifikation
        const smhiTemp = 10.3;
        const smhiWind = 0.9;
        const smhiHumidity = 95;
        const smhiPressure = 1022.4;
        const smhiRain = 0;
        const smhiThunder = 3;

        // Räkna ut det sammanslagna medelvärdet
        const copilotTemp = (temp + smhiTemp) / 2;
        const copilotRain = Math.round((rain + smhiRain) / 2);
        const confidence = Math.abs(temp - smhiTemp) > 3 ? "Medel" : "Hög";

        // Montera källboxen exakt enligt din textmall
        let text = `
        <div class="source-clean-box">
            <b>OPEN‑METEO</b><br>
            Temperatur: ${temp.toFixed(1)}°C<br>
            Vind: ${wind.toFixed(1)} m/s<br>
            Luftfuktighet: ${humidity}%<br>
            Regnrisk: ${rain}%
            <br><br>
            <b>SMHI</b><br>
            Temperatur: ${smhiTemp.toFixed(1)}°C<br>
            Vind: ${smhiWind.toFixed(1)} m/s<br>
            Luftfuktighet: ${smhiHumidity}%<br>
            Lufttryck: ${smhiPressure.toFixed(1)} hPa<br>
            Regnrisk: ${smhiRain}%<br>
            Åskrisk: ${smhiThunder}%
        </div>`;

        document.getElementById("copilot").innerHTML = text;

        // Skicka upp värdena till huvudboxarna högst upp
        document.getElementById("copilotTemp").textContent = copilotTemp.toFixed(1) + "°";
        document.getElementById("copilotRain").textContent = copilotRain + "%";
        document.getElementById("copilotThunder").textContent = smhiThunder + "%";
        document.getElementById("copilotConfidence").textContent = confidence;
        document.getElementById("copilotSources").textContent = "2";

        // Montera prognoslistan från API-datan
        let forecastHTML = "";
        for(let i = 0; i < 7; i++){
            const date = new Date(data.daily.time[i]);
            forecastHTML += `
            <div class="day">
                <strong>${date.toLocaleDateString("sv-SE", {weekday:"short"})}</strong><br><br>
                🔺 ${Math.round(data.daily.temperature_2m_max[i])}°<br>
                🔻 ${Math.round(data.daily.temperature_2m_min[i])}°<br><br>
                🌧 ${data.daily.precipitation_probability_max[i]}%
            </div>`;
        }
        document.getElementById("forecast").innerHTML = forecastHTML;

        status.textContent = "Senast uppdaterad: " + new Date().toLocaleTimeString("sv-SE");

    } catch(error){
        status.textContent = "Fel vid laddning: " + error.message;
    }
}

// Starta direkt vid laddning
loadWeather();
</script>

</body>
</html>
