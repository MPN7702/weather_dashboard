<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Torsby Väder Dashboard</title>
    
<style>
#weeklyForecast {
    margin-top: 20px;
    padding: 20px;
    font-size: 16px;
    line-height: 1.6;
}

#weeklyForecast h2 {
    margin-bottom: 15px;
}

.forecast-day {
    padding: 10px;
    margin-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.15);
}
    
body{
    margin:0;
    padding:20px;
    background:#f2f4f8;
    font-family:Arial,sans-serif;
}

h1{
    text-align:center;
    color:#0056b3;
    margin-bottom:10px;
}
    
#currentDate{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    color:#0056b3;
    margin-bottom:10px;
}
#currentHour{
    text-align:center;
    font-size:38px;
    font-weight:bold;
    color:#0056b3;
}

#countdown{
    text-align:center;
    font-size:26px;
    margin-bottom:25px;
    color:#333;
}

.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:15px;
}

.weather-box{
    background:white;
    padding:15px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
    transition:all .3s;
}

.weather-box h2{
    margin-top:0;
    color:#0056b3;
    border-bottom:1px solid #ddd;
    padding-bottom:8px;
}

.hot{
    border:4px solid #00c853;
}

.cold{
    border:4px solid #ff3d00;
}

.temp-hot{
    color:#d50000;
}

.temp-mid{
    color:#ff9800;
}

.temp-cold{
    color:#1565c0;
}

.rain-low{
    color:#00c853;
}

.rain-mid{
    color:#ff9800;
}

.rain-high{
    color:#d50000;
}

.value{
    font-weight:bold;
}

</style>

</head>
<body>

<h1>Torsby Väderdashboard</h1>

<div id="currentDate"></div>

<div id="currentHour">
Timme: 00:00
</div>

<div id="countdown">
Nästa timme om 5 sek
</div>

<div class="container">

    <div class="weather-box" id="box1">Laddar...</div>
    <div class="weather-box" id="box2">Laddar...</div>
    <div class="weather-box" id="box3">Laddar...</div>
    <div class="weather-box" id="box4">Laddar...</div>
    <div class="weather-box" id="box5">Laddar...</div>
    <div class="weather-box" id="box6">Laddar...</div>

</div>

<div class="card" id="weeklyForecast">
    <h2>📅 7-dygnsprognos</h2>
    <div id="forecastContent">
        Hämtar prognos...
    </div>
</div>

<script>
async function updateWeeklyForecast() {

    const lat = 59.76;
    const lon = 12.99;

    const url =
        `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto`;

    try {

        const response = await fetch(url);
        const data = await response.json();

        let html = "";

        for (let i = 0; i < 7; i++) {

            const date =
                new Date(data.daily.time[i]);

            const weekday =
                date.toLocaleDateString("sv-SE", {
                    weekday: "long"
                });

            const maxTemp =
                data.daily.temperature_2m_max[i];

            const minTemp =
                data.daily.temperature_2m_min[i];

            const rainRisk =
                data.daily.precipitation_probability_max[i];

            let assessment = "";

            if (rainRisk >= 80) {
                assessment =
                    "Mycket hög risk för regn. Planera för blöt väderlek.";
            } else if (rainRisk >= 60) {
                assessment =
                    "Förhållandevis ostadigt med flera möjligheter till regn.";
            } else if (rainRisk >= 40) {
                assessment =
                    "Viss risk för skurar under dagen.";
            } else {
                assessment =
                    "Relativt stabilt väder med liten nederbördsrisk.";
            }

            if (maxTemp >= 25) {
                assessment +=
                    " Temperaturen väntas bli somrig och varm.";
            }

            html += `
                <div class="forecast-day">
                    <strong>${weekday}</strong><br>
                    🌡️ ${minTemp}°C till ${maxTemp}°C<br>
                    🌧️ Regnrisk: ${rainRisk}%<br>
                    📋 Bedömning: ${assessment}
                </div>
            `;
        }

        document.getElementById("forecastContent").innerHTML =
            html;

    } catch (error) {

        document.getElementById("forecastContent").innerHTML =
            "Kunde inte hämta prognosen.";

        console.error(error);
    }
}

const LAT = 60.136;
const LON = 13.006;

const models = [

{
    id:"box1",
    namn:"ICON Global",
    model:"icon_global",
    data:null
},
{
    id:"box2",
    namn:"GFS",
    model:"gfs_global",
    data:null
},
{
    id:"box3",
    namn:"GEM",
    model:"gem_global",
    data:null
},
{
    id:"box4",
    namn:"ICON Europe",
    model:"icon_eu",
    data:null
},
{
    id:"box5",
    namn:"DMI",
    model:"dmi_seamless",
    data:null
},
{
    id:"box6",
    namn:"Best Match",
    model:"best_match",
    data:null
}

];

let currentHour = new Date().getHours();
let countdown = 5;

async function loadWeather(source){

try{

const url =
`https://api.open-meteo.com/v1/forecast` +
`?latitude=${LAT}` +
`&longitude=${LON}` +
`&models=${source.model}` +
`&hourly=` +
`temperature_2m,` +
`relative_humidity_2m,` +
`surface_pressure,` +
`wind_speed_10m,` +
`wind_direction_10m,` +
`precipitation_probability` +
`&forecast_days=1`;

const response = await fetch(url);
const data = await response.json();

source.data = data;

}
catch(error){

console.error(error);

document.getElementById(source.id).innerHTML =
`<h2>${source.namn}</h2>
Fel vid hämtning av data`;

}
}
function getWindDirection(degrees) {

    const directions = [
        "N",
        "NO",
        "O",
        "SO",
        "S",
        "SV",
        "V",
        "NV"
    ];

    return directions[
        Math.round(degrees / 45) % 8
    ];
}
function getWindArrow(degrees) {

    const arrows = [
        "⬆️", // N
        "↗️", // NO
        "➡️", // O
        "↘️", // SO
        "⬇️", // S
        "↙️", // SV
        "⬅️", // V
        "↖️"  // NV
    ];

    return arrows[
        Math.round(degrees / 45) % 8
    ];
}
    
function showHour(hour){

document.getElementById("currentHour").innerHTML =
`Timme: ${String(hour).padStart(2,"0")}:00`;

let temperatures = [];

models.forEach(model=>{

if(!model.data) return;

temperatures.push(
model.data.hourly.temperature_2m[hour]
);

});

const highestTemp = Math.max(...temperatures);
const lowestTemp = Math.min(...temperatures);

models.forEach(model=>{

if(!model.data) return;

const h = model.data.hourly;

const temperature =
h.temperature_2m?.[hour] ?? "-";

const nextTemperature =
h.temperature_2m?.[hour + 1] ?? temperature;

const wind =
h.wind_speed_10m?.[hour] ?? "-";
const windDirection =
h.wind_direction_10m?.[hour] ?? 0;

const pressure =
h.surface_pressure?.[hour] ?? "-";

const rainRisk =
h.precipitation_probability?.[hour] ?? "-";

const thunderRisk =
Math.min(Math.round(rainRisk * 0.6),100);

let trend = "➡";

if(nextTemperature > temperature)
trend = "⬆";

if(nextTemperature < temperature)
trend = "⬇";

let tempClass = "temp-mid";

if(temperature <= 5)
tempClass = "temp-cold";

if(temperature >= 20)
tempClass = "temp-hot";

let rainClass = "rain-low";

if(rainRisk >= 30)
rainClass = "rain-mid";

if(rainRisk >= 70)
rainClass = "rain-high";

const box =
document.getElementById(model.id);

box.classList.remove("hot");
box.classList.remove("cold");

if(temperature === highestTemp)
box.classList.add("hot");

if(temperature === lowestTemp)
box.classList.add("cold");

box.innerHTML = `

<h2>${model.namn}</h2>

Temperatur:
<span class="${tempClass}">
<b>${temperature} °C ${trend}</b>
</span>

<br><br>

Vind:
<b>${wind} m/s ${getWindDirection(windDirection)}</b>

<br><br>

Lufttryck:
<b>${pressure} hPa</b>

<br><br>

Regnrisk:
<span class="${rainClass}">
<b>${rainRisk} %</b>
</span>

<br><br>

Åskrisk:
<b>${thunderRisk} %</b>

`;

});

}
updateWeeklyForecast();
async function loadAllData(){

await Promise.all(
models.map(loadWeather)
);

showHour(currentHour);

}

async function startDashboard(){

    updateDate();

    await loadAllData();

setInterval(async()=>{

currentHour++;

if(currentHour > 23){

currentHour = 0;

await loadAllData();

}

showHour(currentHour);

countdown = 5;

},5000);

setInterval(()=>{

countdown--;

if (countdown < 0)
    countdown = 5;

document.getElementById("countdown").innerHTML =
    `Nästa timme om ${countdown} sek`;

}, 1000);

}

function updateDate() {

    const now = new Date();

    const options = {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
    };

    const dateText =
        now.toLocaleDateString("sv-SE", options);

    document.getElementById("currentDate").innerHTML =
        dateText.charAt(0).toUpperCase() +
        dateText.slice(1);

}

startDashboard();

</script>

</body>
</html>
