function getWindDirection(degrees) {

    const directions = [
        "N",
        "NO",
        "O",
        "SO",
        "S",
        "SV",
        "V",
        "NV"
    ];

    return directions[
        Math.round(degrees / 45) % 8
    ];
}
function getWindArrow(degrees) {

    if (degrees === undefined || degrees === null)
        return "";

    const arrows = [
    "⬆️", // N
    "↗️", // NO
    "➡️", // O
    "↘️", // SO
    "⬇️", // S
    "↙️", // SV
    "⬅️", // V
    "↖️"  // NV
];

    return arrows[
        Math.round(degrees / 45) % 8
    ];
}

    color:#93c5fd;
    font-size:18px;
    font-weight:bold;
">

${capitalizedDate}

<br><br>

Klockan: ${displayTime} (24-timmarsprognos)

<br>

<span id="box7-timer">
    Nästa timme om ${countdown} sek
</span>


</div>

<hr style="
    border:none;
    border-top:1px solid #334155;
    margin:15px 0;
">

Temperatur:
<span class="${avgTempClass}">
<b>${avgTemp} °C</b>
</span>

<br><br>

Vind:
<span class="${avgWindClass}">
<b>${avgWind} m/s ${getWindArrow(avgWindDirection)} ${getWindDirection(avgWindDirection)}</b>
</span>

<br><br>

Lufttryck:
<b>${avgPressure} hPa</b>

<br><br>

Regnrisk:
<span class="${avgRainClass}">
<b>${avgRainRisk} %</b>
</span>

<br><br>

Regnmängd:
<span class="${avgRainAmountClass}">
<b>${avgRainAmount} mm</b>
</span>

<br><br>

Åskrisk:
<span class="${avgThunderClass}">
<b>${avgThunderRisk} %</b>
</span>

`;
}
async function loadAllData(){

await Promise.all(
models.map(loadWeather)
);

showHour(forecastIndex);

await updateWeeklyForecast();

}

async function startDashboard(){

    await loadAllData();


setInterval(async()=>{

    forecastIndex++;

if (forecastIndex >= startIndex + 24)
forecastIndex = startIndex;

showHour(forecastIndex);

countdown = 5;

},5000);

setInterval(()=>{

countdown--;

if (countdown < 0)
    countdown = 5;

const timerText =
    document.getElementById("box7-timer");

if(timerText){
    timerText.textContent =
        `Nästa timme om ${countdown} sek`;
}

/* extra uppdatering när ny prognostimme visas */

if(countdown === 5){
    updateAIBox(forecastIndex);
}

}, 1000);

}

    const toggleButton =
    document.getElementById("toggleModels");

const modelsContainer =
    document.getElementById("modelsContainer");

toggleButton.addEventListener("click", () => {

    if (modelsContainer.style.display === "none") {

        modelsContainer.style.display = "grid";

        toggleButton.textContent =
            "Dölj prognosmodeller";

    } else {

        modelsContainer.style.display = "none";

        toggleButton.textContent =
            "Visa prognosmodeller";

    }

});
startDashboard();

</script>

</body>
</html>
