<script>
async function updateWeeklyForecast() {

    try {

let cache;

if(window.cachedWeather){

    cache = window.cachedWeather;

}else{

    const response =
        await fetch("weather.json");

    cache =
        await response.json();

    window.cachedWeather = cache;
}

const data =
    cache[currentLocation].weekly;
        const daily = data.daily;

if (!data || !data.daily)
    return;

        let html = "";

        for (let i = 0; i < 7; i++) {

const date =
    new Date(
        data.daily.time[i]
    );
const dayDate =
    date.toLocaleDateString("sv-SE", {
        day: "numeric",
        month: "short"
    });
            const weekday =
                date.toLocaleDateString("sv-SE", {
                    weekday: "long"
                });
const maxTemp =
    data.daily.temperature_2m_max[i].toFixed(1);

const minTemp =
    Number(
        daily.temperature_2m_min[i]
    ).toFixed(1);

const rainRisk =
    Math.round(
        daily.precipitation_probability_max[i]
    );
const rainAmount =
    (daily?.precipitation_sum?.[i] ?? 0)
    .toFixed(1);
let rainHours = [];

const currentDay =
    data.daily.time[i];

if (!models[0]?.data?.hourly)
    continue;

const hourlyTimes =
    models[0].data.hourly.time;

for (let h = 0; h < hourlyTimes.length; h++) {

    const hourlyTime =
        hourlyTimes[h];

    let supportWeight = 0;

    models.forEach(model => {

        const rain =
            model.data?.hourly?.precipitation?.[h] ?? 0;

if (rain >= 0.5)
    supportWeight += weights[model.model] ?? 0;

    });

    if (
        hourlyTime.startsWith(currentDay) &&
        supportWeight >= 0.50
    ) {

        rainHours.push(
            hourlyTime.substring(11,16)
        );

    }
}

let rainPeriods = [];
            let rainTimes = "Inget regn";

if (rainHours.length > 0) {

    let start = rainHours[0];
    let previous = rainHours[0];

    for (let r = 1; r < rainHours.length; r++) {

        const current =
            rainHours[r];

        const previousHour =
            Number(previous.substring(0,2));

        const currentHour =
            Number(current.substring(0,2));

        if (currentHour === previousHour + 1) {

            previous = current;

        } else {

if(start === previous){

    rainPeriods.push(start);

}else{

    rainPeriods.push(
        `${start}-${previous}`
    );
}

            start = current;
            previous = current;
        }
    }

if(start === previous){

    rainPeriods.push(start);

}else{

    rainPeriods.push(
        `${start}-${previous}`
    );
}

rainTimes =
    rainPeriods.length
        ? rainPeriods.join(", ")
        : "Inget regn";
}
const windSpeed =
    (
        daily.wind_speed_10m_mean[i]
        * WIND_FACTOR
    ).toFixed(1);

const windGust =
    (
        daily.wind_gusts_10m_mean[i]
        * WIND_FACTOR
    ).toFixed(1);

const pressure =
    daily.surface_pressure_mean[i]
    .toFixed(1);
let thunderRisk =
    Math.min(
        Math.round(
            daily.precipitation_probability_max[i] * 0.6
        ),
        100
    );

if (daily.precipitation_sum[i] >= 10)
    thunderRisk += 15;

if (daily.precipitation_sum[i] >= 20)
    thunderRisk += 15;

thunderRisk =
    Math.min(thunderRisk, 100);

            html += `
                <div class="forecast-day">
<strong style="color:#60a5fa;font-size:18px;">
${weekday} ${dayDate}
</strong><br>
🌡️ ${minTemp}°C till ${maxTemp}°C<br>
🌬️ Medelvind:
<strong>${windSpeed} m/s</strong>

💨 Kastvind:
<strong>${windGust} m/s</strong><br>
📈 Lufttryck:
<strong>${pressure} hPa</strong><br>
🌧️ Regnrisk:
<strong>${rainRisk}%</strong><br>

💧 Regnmängd:
<strong>${rainAmount} mm</strong><br>

🌧️ Regntider:
<strong>${rainTimes}</strong><br>

⚡ Åskrisk:
<strong>${thunderRisk}%</strong><br>

                </div>
            `;
        }

        document.getElementById("forecastContent").innerHTML =
            html;

    } catch (error) {

        document.getElementById("forecastContent").innerHTML =
            "Kunde inte hämta prognosen.";

        console.error(error);
    }
}

let LAT = 60.136;
let LON = 13.006;
    let currentLocation = "Torsby";
document.getElementById("locationSelect")
.addEventListener("change", async function() {

const ortnamn =
    this.options[this.selectedIndex].text;

currentLocation = ortnamn;


forecastIndex = startIndex;

    await loadAllData();
    await updateWeeklyForecast();
    updateDate();

});
const weights = {

    icon_eu: 0.30,
    dmi_seamless: 0.25,
    icon_global: 0.20,
    best_match: 0.15,
    gfs_global: 0.07,
    gem_global: 0.03

};
    const WIND_FACTOR = 0.5;

const models = [

{
    id:"box1",
    namn:"Prognos 1",
    model:"icon_global",
    data:null
},
{
    id:"box2",
    namn:"Prognos 2",

},
{

},
{

},
{

    model:"dmi_seamless",
    data:null
},
{
    id:"box6",
    namn:"Prognos 6",
    model:"best_match",
    data:null
}

];

const startIndex = new Date().getHours();
let forecastIndex = startIndex;

let countdown = 5;
async function loadWeather(source){

    try{

        if(!window.cachedWeather){

            const response =
                await fetch("./weather.json");

            window.cachedWeather =
                await response.json();

        }

source.data =
    window.cachedWeather?.[currentLocation]?.[source.model];


    }
    catch(error){

        console.error(error);

        document.getElementById(source.id).innerHTML =
        `<h2>${source.namn}</h2>
        Fel vid hämtning av data`;

    }

}
function getWindDirection(degrees) {

    const directions = [
        "N",
        "NO",
        "O",
        "SO",
        "S",
        "SV",
        "V",
        "NV"
    ];

    return directions[
        Math.round(degrees / 45) % 8
    ];
}
function getWindArrow(degrees) {

    if (degrees === undefined || degrees === null)
        return "";

    const arrows = [
    "⬆️", // N
    "↗️", // NO
    "➡️", // O
    "↘️", // SO
    "⬇️", // S
    "↙️", // SV
    "⬅️", // V
    "↖️"  // NV
];

    return arrows[
        Math.round(degrees / 45) % 8
    ];
}

function showHour(hour){

    if(!models[0]?.data?.hourly)
        return;

    const forecastTime =
        models[0]?.data?.hourly?.time?.[hour];

const displayTime =
    new Date(forecastTime)
        .toLocaleString("sv-SE", {
            hour: "2-digit",
            minute: "2-digit"
        });

document.getElementById("currentHour").innerHTML =
`Klockan: ${displayTime} (24-timmarsprognos)`;

let temperatures = [];

models.forEach(model=>{

if(!model.data) return;
temperatures.push(
model.data.hourly.temperature_2m[hour]
);

})

models.forEach(model=>{

if(!model.data) return;

const h = model.data.hourly;


const temperature =
h.temperature_2m?.[hour] ?? "-";


const wind =
((h.wind_speed_10m?.[hour] ?? 0) * WIND_FACTOR).toFixed(1);
const windDirection =
h.wind_direction_10m?.[hour] ?? 0;

const pressure =
h.surface_pressure?.[hour] ?? "-";

const rainRisk =
h.precipitation_probability?.[hour] ?? "-";

const rainAmount =
    h.precipitation?.[hour] ?? 0;

const thunderRisk =
Math.min(Math.round(rainRisk * 0.6),100);

let rainAmountClass = "rain-low";

if (rainAmount >= 2)
    rainAmountClass = "rain-mid";

if (rainAmount >= 5)
    rainAmountClass = "rain-high";

let tempClass = "temp-mid";

if(temperature <= 5)
tempClass = "temp-cold";

if(temperature >= 20)
tempClass = "temp-hot";

let rainClass = "rain-low";

if(rainRisk >= 30)
rainClass = "rain-mid";

if(rainRisk >= 70)
rainClass = "rain-high";

const box =
document.getElementById(model.id);

box.innerHTML = `

<h2>${model.namn}</h2>

Temperatur:
<span class="${tempClass}">
<b>${temperature} °C</b>
</span>

<br><br>

Vind:
<b>${wind} m/s ${getWindArrow(windDirection)} ${getWindDirection(windDirection)}</b>

<br><br>

Lufttryck:
<b>${pressure} hPa</b>

<br><br>

Regnrisk:
<span class="${rainClass}">
<b>${rainRisk} %</b>
</span>

<br><br>

Regnmängd:
<span class="${rainAmountClass}">
<b>${rainAmount} mm</b>
</span>

<br><br>

Åskrisk:
<b>${thunderRisk} %</b>

`;

});
 
updateAIBox(hour);

}

 

function updateAIBox(hour){

    if(!models[0]?.data?.hourly)
        return;

    const forecastTime =
        models[0]?.data?.hourly?.time?.[hour];

const displayTime =
    new Date(forecastTime)
        .toLocaleString("sv-SE", {
            hour: "2-digit",
            minute: "2-digit"
        });

let tempSum = 0;
let windSum = 0;
let windDirectionSum = 0;
let pressureSum = 0;
let rainRiskSum = 0;
let rainAmountSum = 0;

let weightSum = 0;
    models.forEach(model => {

        if(!model.data) return;

        const h = model.data.hourly;

const weight =
    weights[model.model] ?? 0;

tempSum +=
    (h.temperature_2m?.[hour] ?? 0) * weight;

windSum +=
    ((h.wind_speed_10m?.[hour] ?? 0) * WIND_FACTOR) * weight;

windDirectionSum +=
    (h.wind_direction_10m?.[hour] ?? 0) * weight;

pressureSum +=
    (h.surface_pressure?.[hour] ?? 0) * weight;

rainRiskSum +=
    (h.precipitation_probability?.[hour] ?? 0) * weight;

rainAmountSum +=
    (h.precipitation?.[hour] ?? 0) * weight;

weightSum += weight;

    });

if(weightSum === 0) return;

const avgTemp =
    (tempSum / weightSum).toFixed(1);

    let avgTempClass = "temp-mid";

if (avgTemp <= 5)
    avgTempClass = "temp-cold";

if (avgTemp >= 20)
    avgTempClass = "temp-hot";
const avgWind =
    (windSum / weightSum).toFixed(1);


const avgWindDirection =
    windDirectionSum / weightSum;

if (isNaN(avgWindDirection))
    return;

const avgPressure =
    (pressureSum / weightSum).toFixed(1);
const avgRainRisk =
    Math.round(rainRiskSum / weightSum);
    let avgRainClass = "rain-low";

if (avgRainRisk >= 30)
    avgRainClass = "rain-mid";

if (avgRainRisk >= 70)
    avgRainClass = "rain-high";
const avgRainAmount =
    (rainAmountSum / weightSum).toFixed(1);
    let avgRainAmountClass = "rain-low";

if (avgRainAmount >= 2)
    avgRainAmountClass = "rain-mid";

if (avgRainAmount >= 5)
    avgRainAmountClass = "rain-high";
    const avgThunderRisk = Math.min(
        Math.round(avgRainRisk * 0.6),
        100
    );
    let avgThunderClass = "rain-low";

if (avgThunderRisk >= 30)
    avgThunderClass = "rain-mid";

if (avgThunderRisk >= 70)
    avgThunderClass = "rain-high";
    let analysis = "";

if (avgTemp >= 25)
    analysis += "☀️ Mycket varmt sommarväder väntas. ";

else if (avgTemp >= 20)
    analysis += "🌤️ Varmt och behagligt väder väntas. ";

else if (avgTemp <= 0)
    analysis += "🥶 Minusgrader väntas. ";

else if (avgTemp <= 5)
    analysis += "❄️ Kyligt väder väntas. ";

else
    analysis += "🌤️ Temperaturen väntas vara normal för årstiden. ";


if (avgRainRisk >= 80)
    analysis += "🌧️ Mycket stor risk för regn. ";

else if (avgRainRisk >= 60)
    analysis += "🌦️ Förhöjd risk för regn under perioden. ";

else if (avgRainRisk >= 40)
    analysis += "🌦️ Viss risk för skurar. ";

else
    analysis += "🌤️ Liten risk för nederbörd. ";


if (avgRainAmount >= 10)
    analysis += "💧 Större regnmängder kan förekomma. ";

else if (avgRainAmount >= 5)
    analysis += "💧 Märkbar nederbörd väntas. ";


if (avgWind >= 15)
    analysis += "🌪️ Kraftiga vindar väntas. ";

else if (avgWind >= 10)
    analysis += "💨 Det blir blåsigt. ";

else if (avgWind <= 2)
    analysis += "🍃 Svaga vindar dominerar. ";


if (avgThunderRisk >= 70)
    analysis += "⛈️ Hög risk för åska. ";

else if (avgThunderRisk >= 50)
    analysis += "⚡ Förhöjd risk för åska. ";


if (avgPressure >= 1020)
    analysis += "📈 Högtryck dominerar väderbilden. ";

else if (avgPressure <= 1000)
    analysis += "📉 Lågtryck påverkar området. ";
document.getElementById("box7").innerHTML = `

        <h2>Samlad väderbild (prognos 1-6)</h2>

        <div style="
            margin-bottom:15px;
            color:#93c5fd;
            font-size:18px;
            font-weight:bold;
        ">
            Klockan: ${displayTime} (24-timmarsprognos)
        </div>


Temperatur:
<span class="${avgTempClass}">
<b>${avgTemp} °C</b>
</span>

        <br><br>

Vind:
<b>${avgWind} m/s ${getWindArrow(avgWindDirection)} ${getWindDirection(avgWindDirection)}</b>

        <br><br>

        Lufttryck:
        <b>${avgPressure} hPa</b>

        <br><br>

Regnrisk:
<span class="${avgRainClass}">
<b>${avgRainRisk} %</b>
</span>

        <br><br>

Regnmängd:
<span class="${avgRainAmountClass}">
<b>${avgRainAmount} mm</b>
</span>

        <br><br>

Åskrisk:
<span class="${avgThunderClass}">
<b>${avgThunderRisk} %</b>
</span>

    `;

}
async function loadAllData(){

await Promise.all(
models.map(loadWeather)
);

showHour(forecastIndex);

await updateWeeklyForecast();

}

async function startDashboard(){

    await loadAllData();

    updateDate();

setInterval(async()=>{

    forecastIndex++;

if (forecastIndex >= startIndex + 24)
forecastIndex = startIndex;

showHour(forecastIndex);

updateDate();

countdown = 5;

},5000);

setInterval(()=>{

countdown--;

if (countdown < 0)
    countdown = 5;

document.getElementById("countdown").innerHTML =
    `Nästa timme om ${countdown} sek`;

}, 1000);

}

function updateDate() {

    const forecastTime =
        models[0]?.data?.hourly?.time?.[forecastIndex];

    if (!forecastTime) return;

    const date = new Date(forecastTime);

    const options = {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
    };

    const dateText =
        date.toLocaleDateString("sv-SE", options);

    document.getElementById("currentDate").innerHTML =
        dateText.charAt(0).toUpperCase() +
        dateText.slice(1);

}

startDashboard();

</script>
