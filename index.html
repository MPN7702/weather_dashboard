<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta="viewport" content="width=device-width,initial-scale=1">
<title>Copilot Weather Torsby</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#1e293b;
    color:white;
    text-align:center;
    padding:20px;
}

button{
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
}

#out{
    margin-top:20px;
    background:#334155;
    padding:15px;
    border-radius:8px;
    white-space:pre-wrap;
}
</style>

</head>
<body>

<h1>🌤 Copilot Weather Torsby</h1>

<button onclick="updateWeather()">
Uppdatera väder
</button>

<div id="out">
Redo...
</div>

<script>

async function updateWeather(){

    const out = document.getElementById("out");

    out.textContent = "Hämtar data...";

    try {

        const response = await fetch(
            "https://api.open-meteo.com/v1/forecast?latitude=60.1333&longitude=13.0&current=temperature_2m"
        );

        const data = await response.json();

        out.textContent =
            "Temperatur i Torsby: " +
            data.current.temperature_2m +
            " °C";

    }
    catch(error){

        out.textContent =
            "Fel: " + error.message;

    }

}

updateWeather();

</script>

</body>
</html>
