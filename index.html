<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Väder Torsby</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
background:#0f172a;
color:white;
font-family:Arial,sans-serif;
}

header{
background:#1e293b;
padding:20px;
text-align:center;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

.current{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:12px;
}

.info{
background:#334155;
border-radius:8px;
padding:15px;
text-align:center;
}

.label{
font-size:14px;
opacity:.8;
}

.value{
font-size:28px;
font-weight:bold;
margin-top:6px;
}

.forecast{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
gap:10px;
}

.day{
background:#334155;
padding:12px;
border-radius:8px;
text-align:center;
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.green{
color:#22c55e;
}

.yellow{
color:#facc15;
}

.red{
color:#ef4444;
}
</style>
</head>

<body>

<header>
<h1>🌤 Väder Torsby</h1>
</header>

<div class="container">

<div class="card">

<div style="text-align:center">
<button onclick="loadWeather()">
Uppdatera väder
</button>
</div>

<div id="status" style="text-align:center;margin-top:15px">
Laddar...
</div>

</div>

<div class="card">

<h2>Dagens väder</h2>

<div class="current">

<div class="info">
<div class="label">Temperatur</div>
<div id="temp" class="value">-</div>
</div>

<div class="info">
<div class="label">Max</div>
<div id="maxTemp" class="value">-</div>
</div>

<div class="info">
<div class="label">Min</div>
<div id="minTemp" class="value">-</div>
</div>

<div class="info">
<div class="label">Vind</div>
<div id="wind" class="value">-</div>
</div>

<div class="info">
<div class="label">Regnrisk</div>
<div id="rain" class="value">-</div>
</div>

<div class="info">
<div class="label">Åskrisk</div>
<div id="thunder" class="value">-</div>
</div>

<div class="info">
<div class="label">Säkerhet</div>
<div id="confidence" class="value">-</div>
</div>

<div class="info">
<div class="label">Källor</div>
<div id="sources" class="value">3</div>
</div>

</div>

</div>

<div class="card">

<h2>Copilot-bedömning</h2>

<div id="summary">
Laddar...
</div>

</div>

<div class="card">

<h2>7-dagars prognos</h2>

<div id="forecast" class="forecast"></div>

</div>

</div>

<script>

const LAT = 60.1333;
const LON = 13.0;

const SMHI_URL =
"https://DIN-SMHI-WORKER.workers.dev/";

const YR_URL =
"https://DIN-YR-WORKER.workers.dev/";

async function loadWeather(){

const status =
document.getElementById("status");

try{

status.textContent =
"Hämtar väderdata...";

const openMeteoUrl =
`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FStockholm`;

const [
openResponse,
smhiResponse,
yrResponse
] = await Promise.all([

fetch(openMeteoUrl),
fetch(SMHI_URL),
fetch(YR_URL)

]);

const openData =
await openResponse.json();

const smhiData =
await smhiResponse.json();

const yrData =
await yrResponse.json();

const openTemp =
(
openData.daily.temperature_2m_max[0]
+
openData.daily.temperature_2m_min[0]
) / 2;

const openRain =
openData.daily.precipitation_probability_max[0];

const openWind =
openData.current.wind_speed_10m;

const maxTemp =
openData.daily.temperature_2m_max[0];

const minTemp =
openData.daily.temperature_2m_min[0];

const idag =
new Date()
.toISOString()
.split("T")[0];

const dagensSMHI =
smhiData.timeSeries.filter(item =>
item.time.startsWith(idag)
);

const temps = [];
const rains = [];
const thunders = [];

dagensSMHI.forEach(item=>{

if(item.data.air_temperature !== undefined)
temps.push(
item.data.air_temperature
);

if(item.data.probability_of_precipitation !== undefined)
rains.push(
item.data.probability_of_precipitation
);

if(item.data.thunderstorm_probability !== undefined)
thunders.push(
item.data.thunderstorm_probability
);

});

const smhiTemp =
temps.length
?
temps.reduce((a,b)=>a+b,0)
/ temps.length
:
openTemp;

const smhiRain =
rains.length
?
Math.max(...rains)
:
openRain;

const smhiThunder =
thunders.length
?
Math.max(...thunders)
:
0;

const yrTemp =
yrData.temperature;

const yrRain =
yrData.rain;

const yrWind =
yrData.wind;

const copilotTemp =
(
openTemp +
smhiTemp +
yrTemp
) / 3;

const copilotRain =
Math.max(
openRain,
smhiRain,
yrRain
);

const copilotWind =
(
openWind +
yrWind
) / 2;

const copilotThunder =
smhiThunder;

const spread =
Math.max(
openTemp,
smhiTemp,
yrTemp
)
-
Math.min(
openTemp,
smhiTemp,
yrTemp
);

let confidence =
"Hög";

if(spread > 3)
confidence = "Medel";

if(spread > 6)
confidence = "Låg";

let summary = "";

if(copilotRain >= 70){

summary =
"Stor sannolikhet för regn idag.";

}
else if(copilotRain >= 40){

summary =
"Risk för regnskurar idag.";

}
else{

summary =
"Övervägande torrt väder.";

}

if(copilotThunder >= 30){

summary +=
" Risk för åska.";

}

document.getElementById("temp")
.textContent =
copilotTemp.toFixed(1) + "°";

document.getElementById("maxTemp")
.textContent =
Math.round(maxTemp) + "°";

document.getElementById("minTemp")
.textContent =
Math.round(minTemp) + "°";

document.getElementById("wind")
.textContent =
copilotWind.toFixed(1);

document.getElementById("rain")
.textContent =
copilotRain + "%";

document.getElementById("thunder")
.textContent =
copilotThunder + "%";

document.getElementById("confidence")
.textContent =
confidence;

document.getElementById("summary")
.innerHTML =
`
<b>Copilot:</b><br><br>
${summary}
<br><br>
Temperatur:
${copilotTemp.toFixed(1)}°C
<br>
Regnrisk:
${copilotRain}%
<br>
Åskrisk:
${copilotThunder}%
`;

let html = "";

for(let i=0;i<7;i++){

const date =
new Date(
openData.daily.time[i]
);

html += `
<div class="day">
<strong>
${date.toLocaleDateString("sv-SE",{weekday:"short"})}
</strong>
<br><br>
🔺 ${Math.round(openData.daily.temperature_2m_max[i])}°
<br>
🔻 ${Math.round(openData.daily.temperature_2m_min[i])}°
<br><br>
🌧 ${openData.daily.precipitation_probability_max[i]}%
</div>
`;

}

document.getElementById("forecast")
.innerHTML =
html;

status.textContent =
"Senast uppdaterad: "
+
new Date()
.toLocaleTimeString("sv-SE");

}
catch(error){

status.textContent =
"Fel: "
+
error.message;

}

}

loadWeather();

setInterval(
loadWeather,
900000
);

</script>

</body>
</html>
