<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torsby Vädermodeller</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial, sans-serif;
    background:#f2f4f8;
}

h1{
    text-align:center;
    color:#0056b3;
}

#currentHour{
    text-align:center;
    font-size:36px;
    font-weight:bold;
    color:#0056b3;
    margin:25px 0;
}

.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:15px;
}

.weather-box{
    background:white;
    border-radius:12px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
}

.weather-box h2{
    margin-top:0;
    color:#0056b3;
    border-bottom:1px solid #ddd;
    padding-bottom:8px;
}

.value{
    font-weight:bold;
}

.error{
    color:red;
}

</style>
</head>
<body>

<h1>Torsby väderprognoser</h1>

<div id="currentHour">
    Timme: 00:00
</div>

<div class="container">

    <div class="weather-box" id="box1">Laddar...</div>
    <div class="weather-box" id="box2">Laddar...</div>
    <div class="weather-box" id="box3">Laddar...</div>
    <div class="weather-box" id="box4">Laddar...</div>
    <div class="weather-box" id="box5">Laddar...</div>
    <div class="weather-box" id="box6">Laddar...</div>

</div>

<script>

const LAT = 60.136;
const LON = 13.006;

const models = [

    {
        id:"box1",
        namn:"ICON Global",
        model:"icon_global",
        data:null
    },

    {
        id:"box2",
        namn:"GFS",
        model:"gfs_global",
        data:null
    },

    {
        id:"box3",
        namn:"GEM",
        model:"gem_global",
        data:null
    },

    {
        id:"box4",
        namn:"JMA",
        model:"jma_seamless",
        data:null
    },

    {
        id:"box5",
        namn:"MétéoFrance",
        model:"meteofrance_seamless",
        data:null
    },

    {
        id:"box6",
        namn:"Best Match",
        model:"best_match",
        data:null
    }

];

let currentHour = 0;

async function loadWeather(source){

    try{

        const url =
        `https://api.open-meteo.com/v1/forecast` +
        `?latitude=${LAT}` +
        `&longitude=${LON}` +
        `&models=${source.model}` +
        `&hourly=` +
        `temperature_2m,` +
        `relative_humidity_2m,` +
        `surface_pressure,` +
        `wind_speed_10m,` +
        `precipitation_probability` +
        `&forecast_days=1`;

        const response = await fetch(url);
        const data = await response.json();

        source.data = data;

    }
    catch(error){

        console.error(error);

        document.getElementById(source.id).innerHTML =
        `<h2>${source.namn}</h2>
         <div class="error">Kunde inte hämta data</div>`;
    }
}

function showHour(hour){

    document.getElementById("currentHour").innerHTML =
        `Timme: ${String(hour).padStart(2,"0")}:00`;

    models.forEach(source=>{

        if(!source.data){
            return;
        }

        const h = source.data.hourly;

        const temp = h.temperature_2m?.[hour] ?? "-";
        const wind = h.wind_speed_10m?.[hour] ?? "-";
        const humidity = h.relative_humidity_2m?.[hour] ?? "-";
        const pressure = h.surface_pressure?.[hour] ?? "-";
        const rainRisk = h.precipitation_probability?.[hour] ?? "-";

        let thunderRisk = "-";

        if(typeof rainRisk === "number"){
            thunderRisk = Math.min(
                Math.round(rainRisk * 0.6),
                100
            );
        }

        document.getElementById(source.id).innerHTML = `

            <h2>${source.namn}</h2>

            Temperatur:
            <span class="value">${temp} °C</span>

            <br><br>

            Vind:
            <span class="value">${wind} m/s</span>

            <br><br>

            Luftfuktighet:
            <span class="value">${humidity} %</span>

            <br><br>

            Lufttryck:
            <span class="value">${pressure} hPa</span>

            <br><br>

            Regnrisk:
            <span class="value">${rainRisk} %</span>

            <br><br>

            Åskrisk:
            <span class="value">${thunderRisk} %</span>

        `;

    });
}

async function loadAllData(){

    await Promise.all(
        models.map(model => loadWeather(model))
    );

    showHour(currentHour);
}

async function startDashboard(){

    await loadAllData();

    setInterval(async ()=>{

        currentHour++;

        if(currentHour > 23){

            currentHour = 0;

            await loadAllData();
        }

        showHour(currentHour);

    },5000);

}

startDashboard();

</script>

</body>
</html>
