<div style="text-align:center;
            margin-top:20px;

<script>
async function updateWeeklyForecast() {

const lat = LAT;
const lon = LON;

   const url =
`https://api.open-meteo.com/v1/forecast?latitude=${lat}` +
`&longitude=${lon}` +
`&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_mean,wind_gusts_10m_mean,surface_pressure_mean` +
`&hourly=precipitation` +
`&timezone=auto`;
    try {

        const response = await fetch(url);
        const data = await response.json();

        let html = "";

        for (let i = 0; i < 7; i++) {

            const date =
                new Date(data.daily.time[i]);
const dayDate =
    date.toLocaleDateString("sv-SE", {
        day: "numeric",
        month: "short"
    });
            const weekday =
                date.toLocaleDateString("sv-SE", {
                    weekday: "long"
                });

            const maxTemp =
                data.daily.temperature_2m_max[i];

            const minTemp =
                data.daily.temperature_2m_min[i];

            const rainRisk =
                data.daily.precipitation_probability_max[i];
const rainAmount =
    data.daily.precipitation_sum[i];
            let rainHours = [];
const windSpeed =
    (data.daily.wind_speed_10m_mean[i] * WIND_FACTOR)
    .toFixed(1);

const windGust =
    (data.daily.wind_gusts_10m_mean[i] * WIND_FACTOR)
    .toFixed(1);
            const pressure =
    data.daily.surface_pressure_mean[i];
            let thunderRisk =
    Math.min(Math.round(rainRisk * 0.6), 100);

if (rainAmount >= 10)
    thunderRisk += 15;

if (rainAmount >= 20)
    thunderRisk += 15;

thunderRisk = Math.min(thunderRisk, 100);

for(let h = 0; h < 24; h++){

    const hourlyIndex = i * 24 + h;

    const rain =
        data.hourly?.precipitation?.[hourlyIndex] ?? 0;

    if(rain > 0.2){

        rainHours.push(
            h.toString().padStart(2,"0") + ":00"
        );
    }
}
            let assessment = "";
            assessment = "Normala väderförhållanden väntas.";
if (rainRisk >= 80) {
    assessment +=
        " Mycket hög risk för regn. Planera för blöt väderlek.";
} else if (rainRisk >= 60) {
    assessment +=
        " Förhållandevis ostadigt med flera möjligheter till regn.";
} else if (rainRisk >= 40) {
    assessment +=
        " Viss risk för skurar under dagen.";
} else {
    assessment +=
        " Relativt stabilt väder med liten nederbördsrisk.";
}

if (thunderRisk >= 60) {
    assessment +=
        " Förhöjd risk för åska.";
}
else if (thunderRisk >= 30) {
    assessment +=
        " Mindre risk för åska.";
}

            if (maxTemp >= 25) {
                assessment +=
                    " Temperaturen väntas bli somrig och varm.";
            }

            html += `
                <div class="forecast-day">
<strong style="color:#60a5fa;font-size:18px;">
${weekday} ${dayDate}
</strong><br>
🌡️ ${minTemp}°C till ${maxTemp}°C<br>
🌬️ Medelvind:
<strong>${windSpeed} m/s</strong>

💨 Kastvind:
<strong>${windGust} m/s</strong><br>
📈 Lufttryck:
<strong>${pressure} hPa</strong><br>
🌧️ Regnrisk:
<strong>${rainRisk}%</strong><br>

💧 Regnmängd:
<strong>${rainAmount} mm</strong><br>

🌧️ Regntider:
<strong>${compressHours(rainHours)}</strong><br>

⚡ Åskrisk:
<strong>${thunderRisk}%</strong><br>
<br>
📋 <strong>Bedömning:</strong><br>
${assessment}
                </div>
            `;
        }

        document.getElementById("forecastContent").innerHTML =
            html;

    } catch (error) {

        document.getElementById("forecastContent").innerHTML =
            "Kunde inte hämta prognosen.";

        console.error(error);
    }
}

let LAT = 60.136;
let LON = 13.006;
document.getElementById("locationSelect")
.addEventListener("change", async function() {

    const [lat, lon] =
        this.value.split(",");

    LAT = parseFloat(lat);
    LON = parseFloat(lon);

    forecastIndex = startIndex;

    await loadAllData();
    await updateWeeklyForecast();
    updateDate();

});
const weights = {

    icon_eu: 0.30,
    dmi_seamless: 0.25,
    icon_global: 0.20,
    best_match: 0.15,
    gfs_global: 0.07,
    gem_global: 0.03

};
    const WIND_FACTOR = 0.5;

const models = [

{
    id:"box1",
    namn:"Vädertjänst Tyskland",
    model:"icon_global",
    data:null
},
{
    id:"box2",
    namn:"Vädertjänst USA",
    model:"gfs_global",
    data:null
},
{
    id:"box3",
    namn:"Vädertjänst Kanada",
    model:"gem_global",
    data:null
},
{
    id:"box4",
    namn:"Vädertjänst Europa",
    model:"icon_eu",
    data:null
},
{
    id:"box5",
    namn:"Vädertjänst Danmark",
    model:"dmi_seamless",
    data:null
},
{
    id:"box6",
    namn:"Mixad vädertjänst",
    model:"best_match",
    data:null
}

];

const startIndex = new Date().getHours();
let forecastIndex = startIndex;

let countdown = 5;
async function loadWeather(source){

try{

const url =
`https://api.open-meteo.com/v1/forecast?latitude=${LAT}` +
`&longitude=${LON}` +
`&models=${source.model}` +
`&hourly=temperature_2m,surface_pressure,wind_speed_10m,wind_direction_10m,precipitation_probability,precipitation` +
`&forecast_days=2`;

const response = await fetch(url);
const data = await response.json();

source.data = data;



}
catch(error){

console.error(error);

document.getElementById(source.id).innerHTML =
`<h2>${source.namn}</h2>
Fel vid hämtning av data`;

}
}
function getWindDirection(degrees) {

    const directions = [
        "N",
        "NO",
        "O",
        "SO",
        "S",
        "SV",
        "V",
        "NV"
    ];

    return directions[
        Math.round(degrees / 45) % 8
    ];
}
function getWindArrow(degrees) {

    if (degrees === undefined || degrees === null)
        return "";

    const arrows = [
    "⬆️", // N
    "↗️", // NO
    "➡️", // O
    "↘️", // SO
    "⬇️", // S
    "↙️", // SV
    "⬅️", // V
    "↖️"  // NV
];

    return arrows[
        Math.round(degrees / 45) % 8
    ];
}
  function compressHours(hours) {

    if (hours.length === 0)
        return "Inget regn väntas";

    const result = [];

    let start = hours[0];
    let previous = hours[0];

    for (let i = 1; i < hours.length; i++) {

        const currentHour =
            parseInt(hours[i].split(":")[0]);

        const previousHour =
            parseInt(previous.split(":")[0]);

        if (currentHour === previousHour + 1) {

            previous = hours[i];

        } else {

            result.push(
                start === previous
                    ? start
                    : `${start}-${previous}`
            );

            start = hours[i];
            previous = hours[i];
        }
    }

    result.push(
        start === previous
            ? start
            : `${start}-${previous}`
    );

    return result.join(", ");
}  
function showHour(hour){

const forecastTime =
    models[0]?.data?.hourly?.time?.[hour];

const displayTime =
    new Date(forecastTime)
        .toLocaleString("sv-SE", {
            hour: "2-digit",
            minute: "2-digit"
        });

document.getElementById("currentHour").innerHTML =
`Klockan: ${displayTime} (24-timmarsprognos)`;

let temperatures = [];

models.forEach(model=>{

if(!model.data) return;
temperatures.push(
model.data.hourly.temperature_2m[hour]
);

})

models.forEach(model=>{

if(!model.data) return;

const h = model.data.hourly;


const temperature =
h.temperature_2m?.[hour] ?? "-";

const nextTemperature =
h.temperature_2m?.[hour + 1] ?? temperature;

const wind =
((h.wind_speed_10m?.[hour] ?? 0) * WIND_FACTOR).toFixed(1);
const windDirection =
h.wind_direction_10m?.[hour] ?? 0;

const pressure =
h.surface_pressure?.[hour] ?? "-";

const rainRisk =
h.precipitation_probability?.[hour] ?? "-";

const rainAmount =
h.precipitation?.[hour] ?? 0;

const thunderRisk =
Math.min(Math.round(rainRisk * 0.6),100);

let rainAmountClass = "rain-low";

if (rainAmount >= 2)
    rainAmountClass = "rain-mid";

if (rainAmount >= 5)
    rainAmountClass = "rain-high";

let trend = "➡";

if(nextTemperature > temperature)
trend = "⬆";

if(nextTemperature < temperature)
trend = "⬇";

let tempClass = "temp-mid";

if(temperature <= 5)
tempClass = "temp-cold";

if(temperature >= 20)
tempClass = "temp-hot";

let rainClass = "rain-low";

if(rainRisk >= 30)
rainClass = "rain-mid";

if(rainRisk >= 70)
rainClass = "rain-high";

const box =
document.getElementById(model.id);

box.innerHTML = `

<h2>${model.namn}</h2>

Temperatur:
<span class="${tempClass}">
<b>${temperature} °C ${trend}</b>
</span>

<br><br>

Vind:
<b>${wind} m/s ${getWindArrow(windDirection)} ${getWindDirection(windDirection)}</b>

<br><br>

Lufttryck:
<b>${pressure} hPa</b>

<br><br>

Regnrisk:
<span class="${rainClass}">
<b>${rainRisk} %</b>
</span>

<br><br>

Regnmängd:
<span class="${rainAmountClass}">
<b>${rainAmount} mm</b>
</span>

<br><br>

Åskrisk:
<b>${thunderRisk} %</b>

`;

});

 

updateAIBox(hour);

}

 

function updateAIBox(hour){

const forecastTime =
    models[0]?.data?.hourly?.time?.[hour];

const displayTime =
    new Date(forecastTime)
        .toLocaleString("sv-SE", {
            hour: "2-digit",
            minute: "2-digit"
        });

let tempSum = 0;
let windSum = 0;
let windDirectionSum = 0;
let pressureSum = 0;
let rainRiskSum = 0;
let rainAmountSum = 0;

let weightSum = 0;
    models.forEach(model => {

        if(!model.data) return;

        const h = model.data.hourly;

const weight =
    weights[model.model] ?? 0;

tempSum +=
    (h.temperature_2m?.[hour] ?? 0) * weight;

windSum +=
    ((h.wind_speed_10m?.[hour] ?? 0) * WIND_FACTOR) * weight;

windDirectionSum +=
    (h.wind_direction_10m?.[hour] ?? 0) * weight;

pressureSum +=
    (h.surface_pressure?.[hour] ?? 0) * weight;

rainRiskSum +=
    (h.precipitation_probability?.[hour] ?? 0) * weight;

rainAmountSum +=
    (h.precipitation?.[hour] ?? 0) * weight;

weightSum += weight;

    });

if(weightSum === 0) return;

const avgTemp =
    (tempSum / weightSum).toFixed(1);

    let avgTempClass = "temp-mid";

if (avgTemp <= 5)
    avgTempClass = "temp-cold";

if (avgTemp >= 20)
    avgTempClass = "temp-hot";
const avgWind =
    (windSum / weightSum).toFixed(1);


const avgWindDirection =
    windDirectionSum / weightSum;

if (isNaN(avgWindDirection))
    return;

const avgPressure =
    (pressureSum / weightSum).toFixed(1);
const avgRainRisk =
    Math.round(rainRiskSum / weightSum);
    let avgRainClass = "rain-low";

if (avgRainRisk >= 30)
    avgRainClass = "rain-mid";

if (avgRainRisk >= 70)
    avgRainClass = "rain-high";
const avgRainAmount =
    (rainAmountSum / weightSum).toFixed(1);
    let avgRainAmountClass = "rain-low";

if (avgRainAmount >= 2)
    avgRainAmountClass = "rain-mid";

if (avgRainAmount >= 5)
    avgRainAmountClass = "rain-high";
    const avgThunderRisk = Math.min(
        Math.round(avgRainRisk * 0.6),
        100
    );
    let avgThunderClass = "rain-low";

if (avgThunderRisk >= 30)
    avgThunderClass = "rain-mid";

if (avgThunderRisk >= 70)
    avgThunderClass = "rain-high";
    let analysis = "";

if (avgTemp >= 25)
    analysis += "☀️ Mycket varmt sommarväder väntas. ";

else if (avgTemp >= 20)
    analysis += "🌤️ Varmt och behagligt väder väntas. ";

else if (avgTemp <= 0)
    analysis += "🥶 Minusgrader väntas. ";

else if (avgTemp <= 5)
    analysis += "❄️ Kyligt väder väntas. ";

else
    analysis += "🌤️ Temperaturen väntas vara normal för årstiden. ";


if (avgRainRisk >= 80)
    analysis += "🌧️ Mycket stor risk för regn. ";

else if (avgRainRisk >= 60)
    analysis += "🌦️ Förhöjd risk för regn under perioden. ";

else if (avgRainRisk >= 40)
    analysis += "🌦️ Viss risk för skurar. ";

else
    analysis += "🌤️ Liten risk för nederbörd. ";


if (avgRainAmount >= 10)
    analysis += "💧 Större regnmängder kan förekomma. ";

else if (avgRainAmount >= 5)
    analysis += "💧 Märkbar nederbörd väntas. ";


if (avgWind >= 15)
    analysis += "🌪️ Kraftiga vindar väntas. ";

else if (avgWind >= 10)
    analysis += "💨 Det blir blåsigt. ";

else if (avgWind <= 2)
    analysis += "🍃 Svaga vindar dominerar. ";


if (avgThunderRisk >= 70)
    analysis += "⛈️ Hög risk för åska. ";

else if (avgThunderRisk >= 50)
    analysis += "⚡ Förhöjd risk för åska. ";


if (avgPressure >= 1020)
    analysis += "📈 Högtryck dominerar väderbilden. ";

else if (avgPressure <= 1000)
    analysis += "📉 Lågtryck påverkar området. ";
document.getElementById("box7").innerHTML = `

        <h2>🧠 Samlad väderbild och AI-bedömning</h2>

        <div style="
            margin-bottom:15px;
            color:#93c5fd;
            font-size:18px;
            font-weight:bold;
        ">
            Klockan: ${displayTime} (24-timmarsprognos)
        </div>


Temperatur:
<span class="${avgTempClass}">
<b>${avgTemp} °C</b>
</span>

        <br><br>

Vind:
<b>${avgWind} m/s ${getWindArrow(avgWindDirection)} ${getWindDirection(avgWindDirection)}</b>

        <br><br>

        Lufttryck:
        <b>${avgPressure} hPa</b>

        <br><br>

Regnrisk:
<span class="${avgRainClass}">
<b>${avgRainRisk} %</b>
</span>

        <br><br>

Regnmängd:
<span class="${avgRainAmountClass}">
<b>${avgRainAmount} mm</b>
</span>

        <br><br>

Åskrisk:
<span class="${avgThunderClass}">
<b>${avgThunderRisk} %</b>
</span>


<br><br>

<b>AI-bedömning:</b><br>
${analysis}

    `;

}
updateWeeklyForecast();
async function loadAllData(){

await Promise.all(
models.map(loadWeather)
);

showHour(forecastIndex);

}

async function startDashboard(){

    await loadAllData();

    updateDate();

setInterval(async()=>{

    forecastIndex++;

if (forecastIndex >= startIndex + 24)
forecastIndex = startIndex;

showHour(forecastIndex);

updateDate();

countdown = 5;

},5000);

setInterval(()=>{

countdown--;

if (countdown < 0)
    countdown = 5;

document.getElementById("countdown").innerHTML =
    `Nästa timme om ${countdown} sek`;

}, 1000);

}

function updateDate() {

    const forecastTime =
        models[0]?.data?.hourly?.time?.[forecastIndex];

    if (!forecastTime) return;

    const date = new Date(forecastTime);

    const options = {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
    };

    const dateText =
        date.toLocaleDateString("sv-SE", options);

    document.getElementById("currentDate").innerHTML =
        dateText.charAt(0).toUpperCase() +
        dateText.slice(1);

}

startDashboard();

</script>
