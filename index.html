<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Copilot Vädercentral Torsby</title>

<style>
body{
    font-family:Segoe UI,Arial,sans-serif;
    background:#eef2f7;
    margin:0;
    padding:20px;
}

.container{
    max-width:1400px;
    margin:auto;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
}

h1{
    color:#0078d4;
}

button{
    background:#0078d4;
    color:white;
    border:none;
    border-radius:10px;
    padding:12px 20px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#005ea6;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#0078d4;
    color:white;
}

.value{
    font-size:28px;
    font-weight:bold;
}

.small{
    color:#666;
}
</style>

</head>
<body>

<div class="container">

<h1>🌦️ Copilot Vädercentral - Torsby</h1>

<div class="card">

<button onclick="updateWeather()">
🔄 Uppdatera
</button>

<p id="status">Redo</p>

</div>

<div class="card">

<h2>Datakällor</h2>

<table>

<thead>
<tr>
<th>Källa</th>
<th>Temperatur</th>
<th>Regnrisk</th>
</tr>
</thead>

<tbody id="tableBody">
</tbody>

</table>

</div>

<div class="card">

<h2>Copilot-Prognos</h2>

<div id="copilot">

Väntar på uppdatering...

</div>

</div>

<div class="card">

<h2>Riskcentral</h2>

<div id="riskPanel">

Ingen data ännu.

</div>

</div>

</div>

<script>

const LAT = 60.1333;
const LON = 13.0000;

async function updateWeather(){

const status =
document.getElementById("status");

status.innerText =
"Hämtar data...";

try{

let sources = [];


// OPEN-METEO

const openMeteoResponse =
await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m&hourly=precipitation_probability`
);

const openMeteo =
await openMeteoResponse.json();

const omTemp =
openMeteo.current.temperature_2m;

const omRain =
Math.max(
...openMeteo.hourly.precipitation_probability.slice(0,24)
);

sources.push({
name:"Open-Meteo",
temp:omTemp,
rain:omRain
});


// SMHI

const smhiResponse =
await fetch(
"https://opendata-download-metfcst.smhi.se/api/category/pmp3g/version/2/geotype/point/lon/13.0/lat/60.13/data.json"
);

const smhi =
await smhiResponse.json();

let smhiTemp = null;

for(const p of smhi.timeSeries[0].parameters){

if(p.name === "t"){

smhiTemp = p.values[0];

}

}

sources.push({
name:"SMHI",
temp:smhiTemp,
rain:"-"
});



// Fyll tabell

let html = "";

sources.forEach(source=>{

html += `
<tr>
<td>${source.name}</td>
<td>${source.temp} °C</td>
<td>${source.rain}%</td>
</tr>
`;

});

document.getElementById("tableBody").innerHTML =
html;



// Beräkna medel

const temps =
sources
.map(s=>Number(s.temp))
.filter(v=>!isNaN(v));

const rains =
sources
.map(s=>Number(s.rain))
.filter(v=>!isNaN(v));

const avgTemp =
(
temps.reduce((a,b)=>a+b,0)
/
temps.length
)
.toFixed(1);

let avgRain = 0;

if(rains.length>0){

avgRain =
(
rains.reduce((a,b)=>a+b,0)
/
rains.length
)
.toFixed(0);

}



// Prognossäkerhet

const spread =
Math.max(...temps)
-
Math.min(...temps);

let confidence =
100 - (spread * 10);

if(confidence < 0){

confidence = 0;

}

confidence =
confidence.toFixed(0);



// Enkel åskrisk

let thunderRisk = 5;

if(avgRain >= 80){

thunderRisk = 60;

}
else if(avgRain >= 60){

thunderRisk = 40;

}
else if(avgRain >= 40){

thunderRisk = 20;

}



// Copilot prognos

document.getElementById("copilot").innerHTML = `

<div class="value">
🌡️ ${avgTemp} °C
</div>

<p>
☔ Regnrisk: <b>${avgRain}%</b>
</p>

<p>
⛈️ Åskrisk: <b>${thunderRisk}%</b>
</p>

<p>
📊 Prognossäkerhet: <b>${confidence}%</b>
</p>

<p class="small">
Bygger på ${sources.length} datakällor
</p>

`;


// Riskpanel

let color = "#28a745";
let level = "Låg";

if(avgRain > 70){

color = "#dc3545";
level = "Hög";

}
else if(avgRain > 40){

color = "#ffc107";
level = "Mellan";

}

document.getElementById("riskPanel").innerHTML = `

<div style="
background:${color};
color:white;
padding:20px;
border-radius:12px;
font-size:22px;
font-weight:bold;
">

☔ Regnrisk: ${avgRain}%<br><br>

⛈️ Åskrisk: ${thunderRisk}%<br><br>

📊 Säkerhet: ${confidence}%<br><br>

⚠️ Risknivå: ${level}

</div>
`;

status.innerText =
"Senast uppdaterad: " +
new Date().toLocaleString("sv-SE");

}
catch(error){

status.innerText =
"Fel: " + error.message;

}

}

updateWeather();

</script>

</body>
</html>
