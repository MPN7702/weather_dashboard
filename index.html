<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Väder Torsby</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#1e293b;
    text-align:center;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1e293b;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.current{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
}

.info{
    flex:1;
    min-width:180px;
    background:#334155;
    border-radius:8px;
    padding:15px;
    text-align:center;
}

.label{
    font-size:14px;
    opacity:.8;
    margin-bottom: 5px;
}

.value{
    font-size:32px;
    font-weight:bold;
}

.forecast{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:10px;
}

.day{
    background:#334155;
    padding:12px;
    border-radius:8px;
    text-align:center;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

#status{
    text-align:center;
    margin-top:15px;
}

.copilot-text {
    line-height: 1.6;
    color: #e2e8f0;
    background: #1e1b4b;
    padding: 15px;
    border-radius: 8px;
    border-left: 4px solid #6366f1;
}

.sources-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-top: 15px;
}

.source-card {
    background: #334155;
    padding: 15px;
    border-radius: 8px;
    border-top: 4px solid #3b82f6;
}

.source-title {
    font-weight: bold;
    font-size: 16px;
    margin-bottom: 8px;
    color: #93c5fd;
    border-bottom: 1px solid #475569;
    padding-bottom: 4px;
}
</style>

</head>
<body>

<header>
<h1>🌤 Väder Torsby (4 Källor)</h1>
</header>

<div class="container">

<div class="card">
<div style="text-align:center;">
<button onclick="loadWeather()">
Uppdatera väder
</button>
</div>
<div id="status">
Laddar...
</div>
</div>

<div class="card">
<h2>Dagens väder (Sammanslaget snitt kl. 15)</h2>
<div class="current">

<div class="info">
<div class="label">Temperatur</div>
<div id="copilotTemp" class="value">-</div>
</div>

<div class="info">
<div class="label">Regnmängd</div>
<div id="copilotRain" class="value">-</div>
</div>

<div class="info">
<div class="label">Vindhastighet</div>
<div id="copilotConfidence" class="value">-</div>
</div>

<div class="info">
<div class="label">Källor aktiva</div>
<div id="copilotSources" class="value">-</div>
</div>

</div>
</div>

<div class="card">
<h2>7-dagars prognos</h2>
<div id="forecast" class="forecast">
</div>
</div>

<div class="card">
<h2>Copilot Multi-Källsbedömning</h2>
<div id="copilot" class="copilot-text">
Laddar global analys...
</div>
</div>

<div class="card">
<h2>Individuella källor (Eftermiddag kl. 15)</h2>
<div id="individual-sources" class="sources-grid">
    <!-- Fylls i dynamiskt -->
</div>
</div>

</div>

<script>
async function loadWeather(){
    const status = document.getElementById("status");
    status.textContent = "Samlar in och synkroniserar 4 globala källor...";

    try {
        // Helt platt och korrekt URL till Open-Meteos publika databas för centrala Torsby [2026-08-28]
        const url = "https://open-meteo.com";
        
        const res = await fetch(url);
        if (!res.ok) throw new Error("Väderserverns publika databas svarar inte.");
        const data = await res.json();

        // Datumhantering synkad med svensk tidszon [2026-08-28]
        const todayStr = new Date().toLocaleDateString("sv-SE", { timeZone: "Europe/Stockholm" });
        const targetHour = "15:00";

        let temps = [], winds = [], rains = [];
        let sourcesHTML = "";
        let activeCount = 0;

        const models = [
            { name: "🇪🇺 ECMWF (Europa/SMHI)", tree: data.hourly_ecmwf_ifs04 },
            { name: "🇩🇪 DWD ICON (Tyskland)", tree: data.hourly_dwd_icon_global },
            { name: "🇺🇸 NOAA GFS (USA)", tree: data.hourly_gfs_seamless },
            { name: "🇨🇦 GEM (Kanada Global)", tree: data.hourly_gem_global }
        ];

        models.forEach(m => {
            if (m.tree && Array.isArray(m.tree.time)) {
                const idx = m.tree.time.findIndex(t => t === `${todayStr}T${targetHour}`);
                if (idx !== -1) {
                    const t = m.tree.temperature_2m[idx];
                    const w = m.tree.wind_speed_10m[idx] / 3.6; // Omvandlar km/h till m/s
                    const r = m.tree.precipitation[idx];

                    temps.push(t);
                    winds.push(w);
                    rains.push(r);
                    activeCount++;

                    sourcesHTML += `
                    <div class="source-card">
                        <div class="source-title">${m.name}</div>
                        <div><b>🌡 Temp:</b> ${t.toFixed(1)}°C</div>
                        <div><b>💨 Vind:</b> ${w.toFixed(1)} m/s</div>
                        <div><b>🌧 Regn:</b> ${r.toFixed(1)} mm</div>
                    </div>`;
                }
            }
        });

        document.getElementById("individual-sources").innerHTML = sourcesHTML;
        document.getElementById("copilotSources").textContent = activeCount;

        if (activeCount === 0) throw new Error("Ingen data matchade eftermiddagens prognos.");

        // Beräkna det sammanslagna snittet
        const avg = (arr) => arr.reduce((a, b) => a + b, 0) / arr.length;
        const weatherSnitt = { temp: avg(temps), wind: avg(winds), rain: avg(rains) };

        // Montera värdena i boxarna för Dagens väder
        document.getElementById("copilotTemp").textContent = weatherSnitt.temp.toFixed(1) + "°";
        document.getElementById("copilotRain").textContent = weatherSnitt.rain.toFixed(1) + " mm";
        document.getElementById("copilotConfidence").textContent = weatherSnitt.wind.toFixed(1) + " m/s";

        // Skapa Copilot-analysen
        let text = `<b>MULTIKÄLLS-BEDÖMNING FÖR TORSBY IDAG (KL 15:00):</b><br>`;
        text += `Genom att sammanfoga och analysera datamodeller från ${activeCount} globala institut kan vi presentera ett stabilt medelvärde. `;
        text += `Temperaturen under eftermiddagen beräknas till ${weatherSnitt.temp.toFixed(1)}°C. `;
        
        if (weatherSnitt.rain > 0.1) {
            text += `Vissa modeller indikerar en risk för lättare skurar med ett uppmätt snitt på ${weatherSnitt.rain.toFixed(1)} mm. `;
        } else {
            text += `Modellerna uppvisar en total samstämmighet om en helt torr eftermiddag, vilket ger perfekta förutsättningar för utomhusaktiviteter. `;
        }
        text += `Vindarna förblir mycket svaga och behagliga med ett snitt på ${weatherSnitt.wind.toFixed(1)} m/s.`;
        document.getElementById("copilot").innerHTML = text;

        // Montera din 7-dagarsprognos
        let forecastHTML = "";
        for(let i = 0; i < 7; i++){
            const date = new Date(data.daily.time[i]);
            forecastHTML += `
            <div class="day">
                <strong>${date.toLocaleDateString("sv-SE", {weekday:"short"})}</strong>
                <br><br>
                🔺 ${Math.round(data.daily.temperature_2m_max[i])}°
                <br>
                🔻 ${Math.round(data.daily.temperature_2m_min[i])}°
                <br><br>
                🌧 ${data.daily.precipitation_probability_max[i] ?? 0}%
            </div>
            `;
        }
        document.getElementById("forecast").innerHTML = forecastHTML;

        status.textContent = "Senast uppdaterad: " + new Date().toLocaleTimeString("sv-SE") + " (4 källor synkade)";

    } catch(error) {
        status.textContent = "Fel vid laddning: " + error.message;
        document.getElementById("copilot").innerHTML = "Kunde inte slå samman källorna just nu.";
    }
}

// Starta direkt
loadWeather();
setInterval(loadWeather, 900000);
</script>

</body>
</html>
