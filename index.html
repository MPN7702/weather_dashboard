<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Väder Torsby</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#1e293b;
    text-align:center;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1e293b;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.current{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
}

.info{
    flex:1;
    min-width:180px;
    background:#334155;
    border-radius:8px;
    padding:15px;
    text-align:center;
}

.label{
    font-size:14px;
    opacity:.8;
}

.value{
    font-size:32px;
    font-weight:bold;
}

.forecast{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:10px;
}

.day{
    background:#334155;
    padding:12px;
    border-radius:8px;
    text-align:center;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

#status{
    text-align:center;
    margin-top:15px;
}

.source-clean-box {
    line-height: 1.8;
    font-size: 16px;
    color: #f1f5f9;
    padding: 10px 5px;
}
.source-clean-box b {
    color: #38bdf8;
    text-transform: uppercase;
}
</style>

</head>
<body>

<header>
<h1>🌤 Väder Torsby</h1>
</header>

<div class="container">

<div class="card">
<div style="text-align:center;">
<button onclick="loadWeather()">
Återställ / Synka om
</button>
</div>
<div id="status">
Laddar...
</div>
</div>

<div class="card">
<h2 id="current-title">Dagens väder</h2>
<div class="current">
<div class="info"><div class="label">Temperatur</div><div id="copilotTemp" class="value">-</div></div>
<div class="info"><div class="label">Regnrisk</div><div id="copilotRain" class="value">-</div></div>
<div class="info"><div class="label">Åskrisk</div><div id="copilotThunder" class="value">-</div></div>
<div class="info"><div class="label">Säkerhet</div><div id="copilotConfidence" class="value">-</div></div>
<div class="info"><div class="label">Källor</div><div id="copilotSources" class="value">-</div></div>
</div>
</div>

<div class="card">
<h2>7-dagars prognos</h2>
<div id="forecast" class="forecast"></div>
</div>

<div class="card">
<h2>Källor</h2>
<div id="copilot">
    <div class="source-clean-box">Väntar på data-synk...</div>
</div>
</div>

</div>

<script>
// Globala variabler för loopen
let simulationInterval = null;
let currentHourIndex = 0;
let hourlyDataGlobal = null;
let dailyDataGlobal = null;

async function loadWeather(){
    const status = document.getElementById("status");
    status.textContent = "Hämtar 24-timmars väderström...";
    
    if(simulationInterval) clearInterval(simulationInterval);

    try{
        // Garanterat platt URL utan strängvariabler eller klamrar [2026-08-28]
        const openMeteoUrl = "https://open-meteo.com";
        
        const response = await fetch(openMeteoUrl);
        if(!response.ok) throw new Error("Open‑Meteo " + response.status);
        const data = await response.json();

        hourlyDataGlobal = data.hourly;
        dailyDataGlobal = data.daily;
        currentHourIndex = 0;

        // Rendera 7-dagarsprognosen direkt
        let forecastHTML = "";
        for(let i = 0; i < 7; i++){
            const date = new Date(data.daily.time[i]);
            forecastHTML += `
            <div class="day">
                <strong>${date.toLocaleDateString("sv-SE", {weekday:"short"})}</strong><br><br>
                🔺 ${Math.round(data.daily.temperature_2m_max[i])}°<br>
                🔻 ${Math.round(data.daily.temperature_2m_min[i])}°<br><br>
                🌧 ${data.daily.precipitation_probability_max[i]}%
            </div>`;
        }
        document.getElementById("forecast").innerHTML = forecastHTML;

        // Starta cykeln på 5 sekunder
        updateSimulationFrame();
        simulationInterval = setInterval(updateSimulationFrame, 5000);

    } catch(error){
        status.textContent = "Fel: " + error.message;
    }
}

function updateSimulationFrame() {
    if (!hourlyDataGlobal) return;

    const status = document.getElementById("status");
    if (currentHourIndex >= 24) currentHourIndex = 0;

    const timeStr = hourlyDataGlobal.time[currentHourIndex];
    const timeClock = timeStr.split("T")[1].substring(0, 5); // Plockar ut HH:MM säkert

    document.getElementById("current-title").textContent = `Dagens väder (Simulerad tid: ${timeClock})`;

    const temp1 = hourlyDataGlobal.temperature_2m[currentHourIndex];
    const wind1 = hourlyDataGlobal.wind_speed_10m[currentHourIndex];
    const hum1 = hourlyDataGlobal.relative_humidity_2m[currentHourIndex];
    const rain1 = hourlyDataGlobal.precipitation_probability[currentHourIndex];

    // Beräkningar för SMHI-fält utifrån din specifikation
    const temp2 = temp1 - 0.6;
    const wind2 = Math.max(0, wind1 - 2.0);
    const hum2 = Math.min(100, hum1 + 2);
    const rain2 = Math.max(0, rain1 - 48);
    const thunder2 = rain2 > 40 ? 12 : 3;
    const pressure2 = 1022.4 - (currentHourIndex * 0.1);

    const copilotTemp = (temp1 + temp2) / 2;
    const copilotRain = Math.round((rain1 + rain2) / 2);
    const confidence = Math.abs(temp1 - temp2) > 3 ? "Medel" : "Hög";

    // Textblock formaterat exakt enligt önskemål
    let text = `
    <div class="source-clean-box">
        <b>OPEN‑METEO</b><br>
        Temperatur: ${temp1.toFixed(1)}°C<br>
        Vind: ${wind1.toFixed(1)} m/s<br>
        Luftfuktighet: ${hum1}%<br>
        Regnrisk: ${rain1}%
        <br><br>
        <b>SMHI</b><br>
        Temperatur: ${temp2.toFixed(1)}°C<br>
        Vind: ${wind2.toFixed(1)} m/s<br>
        Luftfuktighet: ${hum2}%<br>
        Lufttryck: ${pressure2.toFixed(1)} hPa<br>
        Regnrisk: ${rain2}%<br>
        Åskrisk: ${thunder2}%
    </div>`;

    document.getElementById("copilot").innerHTML = text;

    document.getElementById("copilotTemp").textContent = copilotTemp.toFixed(1) + "°";
    document.getElementById("copilotRain").textContent = copilotRain + "%";
    document.getElementById("copilotThunder").textContent = thunder2 + "%";
    document.getElementById("copilotConfidence").textContent = confidence;
    document.getElementById("copilotSources").textContent = "2";

    status.textContent = `Simulator igång. Visar timme ${currentHourIndex + 1} av 24.`;
    currentHourIndex++;
}

loadWeather();
</script>

</body>
</html>
