<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Väder Torsby</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#1e293b;
    text-align:center;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1e293b;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.current{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
}

.info{
    flex:1;
    min-width:180px;
    background:#334155;
    border-radius:8px;
    padding:15px;
    text-align:center;
}

.label{
    font-size:14px;
    opacity:0.8;
}

.value{
    font-size:32px;
    font-weight:bold;
}

.forecast{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:10px;
}

.day{
    background:#334155;
    padding:12px;
    border-radius:8px;
    text-align:center;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

#status{
    text-align:center;
    margin-top:15px;
}
</style>

</head>
<body>

<header>
    <h1>🌤 Väder Torsby</h1>
</header>

<div class="container">

    <div class="card">

        <div style="text-align:center;">
            <button onclick="loadWeather()">
                Uppdatera väder
            </button>
        </div>

        <div id="status">
            Laddar...
        </div>

    </div>

    <div class="card">

        <h2>Just nu</h2>

        <div class="current">

            <div class="info">
                <div class="label">Open‑Meteo Temp</div>
                <div id="temp" class="value">-</div>
            </div>

            <div class="info">
                <div class="label">Vind</div>
                <div id="wind" class="value">-</div>
            </div>

            <div class="info">
                <div class="label">Luftfuktighet</div>
                <div id="humidity" class="value">-</div>
            </div>

            <div class="info">
                <div class="label">SMHI Temp</div>
                <div id="smhiTemp" class="value">-</div>
            </div>

        </div>

    </div>

    <div class="card">

        <h2>Copilot-bedömning</h2>

        <div id="copilot">
            Laddar...
        </div>

    </div>

    <div class="card">

        <h2>7-dagars prognos</h2>

        <div id="forecast" class="forecast"></div>

    </div>

</div>

<script>

const LAT = 60.1333;
const LON = 13.0;

async function loadWeather(){

    const status = document.getElementById("status");

    status.textContent = "Hämtar väderdata...";

    try{

        const url =
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=" + LAT +
        "&longitude=" + LON +
        "&current=temperature_2m,relative_humidity_2m,wind_speed_10m" +
        "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
        "&timezone=Europe%2FStockholm";

        const response = await fetch(url);

        if(!response.ok){
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        let smhiTemp = null;

        try{

            const smhiResponse = await fetch(
                "https://opendata-download-metfcst.smhi.se/api/category/pmp3g/version/2/geotype/point/lon/13.0/lat/60.13/data.json"
            );

            const smhiData = await smhiResponse.json();

            const tempParameter =
                smhiData.timeSeries[0].parameters.find(
                    p => p.name === "t"
                );

            if(tempParameter){
                smhiTemp = tempParameter.values[0];
            }

        }
        catch(smhiError){

            console.log("SMHI-fel:", smhiError);

        }

        document.getElementById("temp").textContent =
            data.current.temperature_2m + "°";

        document.getElementById("wind").textContent =
            data.current.wind_speed_10m + " m/s";

        document.getElementById("humidity").textContent =
            data.current.relative_humidity_2m + "%";

        document.getElementById("smhiTemp").textContent =
            smhiTemp !== null
            ? smhiTemp + "°"
            : "N/A";

        buildForecast(data);
        buildCopilot(data, smhiTemp);

        status.textContent =
            "Senast uppdaterad: " +
            new Date().toLocaleTimeString("sv-SE");

    }
    catch(error){

        status.textContent =
            "Fel: " + error.message;

    }
}

function buildForecast(data){

    const forecast =
        document.getElementById("forecast");

    forecast.innerHTML = "";

    for(let i = 0; i < 7; i++){

        const date =
            new Date(data.daily.time[i]);

        const day =
            document.createElement("div");

        day.className = "day";

        day.innerHTML =
            "<strong>" +
            date.toLocaleDateString(
                "sv-SE",
                { weekday:"short" }
            ) +
            "</strong><br><br>" +

            "🔺 " +
            Math.round(
                data.daily.temperature_2m_max[i]
            ) +
            "°<br>" +

            "🔻 " +
            Math.round(
                data.daily.temperature_2m_min[i]
            ) +
            "°<br><br>" +

            "🌧 " +
            data.daily.precipitation_probability_max[i] +
            "%";

        forecast.appendChild(day);
    }
}

function buildCopilot(data, smhiTemp){

    const rain =
        data.daily.precipitation_probability_max[0];

    const openMeteoTemp =
        data.current.temperature_2m;

    let copilotTemp =
        openMeteoTemp;

    if(smhiTemp !== null){

        copilotTemp =
            (
                openMeteoTemp +
                smhiTemp
            ) / 2;

    }

    let text = "";

    if(rain < 20){

        text =
        "☀️ Hög sannolikhet för torrt och stabilt väder idag.";

    }
    else if(rain < 50){

        text =
        "🌤 Risk för enstaka skurar men mest uppehåll.";

    }
    else{

        text =
        "🌧 Förhöjd risk för regn idag.";

    }

    text +=
    "<br><br><b>Open‑Meteo:</b> " +
    openMeteoTemp.toFixed(1) +
    "°C";

    if(smhiTemp !== null){

        text +=
        "<br><b>SMHI:</b> " +
        smhiTemp.toFixed(1) +
        "°C";

    }

    text +=
    "<br><br><b>Copilot Temperatur:</b> " +
    copilotTemp.toFixed(1) +
    "°C";

    text +=
    "<br><br><b>Regnrisk idag:</b> " +
    rain +
    "%";

    text +=
    "<br><br><b>Källor:</b> Open‑Meteo + SMHI";

    text +=
    "<br><br><b>Copilot säkerhetsbedömning:</b> Hög";

    document.getElementById("copilot").innerHTML =
        text;
}

loadWeather();

setInterval(loadWeather, 900000);

</script>

</body>
</html>
