<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Torsbyvädret</title>
    
<style>
#weeklyForecast{
    margin-top:20px;
    padding:20px;
    font-size:16px;
    line-height:1.6;

    background:#1e293b;
    color:#e2e8f0;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.4);
}

#weeklyForecast h2 {
    margin-bottom: 15px;
}

.forecast-day {
    padding: 10px;
    margin-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.15);
}
    
body{
    margin:0;
    padding:20px;
    background:#0f172a;
    color:#e2e8f0;
    font-family:Arial,sans-serif;
}

h1{
    text-align:center;
    color:#60a5fa;
    margin-bottom:10px;
}

#currentDate{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    color:#93c5fd;
    margin-bottom:10px;
}

#currentHour{
    text-align:center;
    font-size:38px;
    font-weight:bold;
    color:#bfdbfe;
}

#countdown{
    text-align:center;
    font-size:26px;
    margin-bottom:25px;
    color:#cbd5e1;
}

.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:15px;
}

.weather-box{
    background:#1e293b;
    color:#e2e8f0;
    padding:15px;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.4);
    transition:all .3s;
}

#box7{
    text-align:center;
}

.weather-box h2{
    color:#60a5fa;
    border-bottom:1px solid #334155;
    padding-bottom:8px;
}

.temp-hot{
    color:#d50000;
}

.temp-mid{
    color:#ff9800;
}

.temp-cold{
    color:#1565c0;
}

.rain-low{
    color:#00c853;
}

.rain-mid{
    color:#ff9800;
}

.rain-high{
    color:#d50000;
}

.value{
    font-weight:bold;
}

</style>

</head>
<body>

<h1>Torsbyvädret</h1>

<div id="currentDate"></div>

<div id="currentHour">
Tid: 00:00
</div>

<div id="countdown">
Nästa timme om 5 sek
</div>

<div class="container">

    <div class="weather-box" id="box1"></div>
    <div class="weather-box" id="box2"></div>
    <div class="weather-box" id="box3"></div>
    <div class="weather-box" id="box4"></div>
    <div class="weather-box" id="box5"></div>
    <div class="weather-box" id="box6"></div>

</div>

<div class="weather-box" id="box7" style="margin-top:20px;">
    AI analyserar...
</div>


<div id="weeklyForecast">
    <h2>📅 7-dygnsprognos (sammanslagning av ovan källor och en AI-bedömning)</h2>
    <div id="forecastContent">
        Hämtar prognos...
    </div>
</div>

<script>
async function updateWeeklyForecast() {

    const lat = 59.76;
    const lon = 12.99;

    const url =
        `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_mean,wind_gusts_10m_mean,surface_pressure_mean&timezone=auto`;

    try {

        const response = await fetch(url);
        const data = await response.json();

        let html = "";

        for (let i = 0; i < 7; i++) {

            const date =
                new Date(data.daily.time[i]);
const dayDate =
    date.toLocaleDateString("sv-SE", {
        day: "numeric",
        month: "short"
    });
            const weekday =
                date.toLocaleDateString("sv-SE", {
                    weekday: "long"
                });

            const maxTemp =
                data.daily.temperature_2m_max[i];

            const minTemp =
                data.daily.temperature_2m_min[i];

            const rainRisk =
                data.daily.precipitation_probability_max[i];
const rainAmount =
    data.daily.precipitation_sum[i];
const windSpeed =
    data.daily.wind_speed_10m_mean[i];

const windGust =
    data.daily.wind_gusts_10m_mean[i];
            const pressure =
    data.daily.surface_pressure_mean[i];
            let thunderRisk =
    Math.min(Math.round(rainRisk * 0.6), 100);

if (rainAmount >= 10)
    thunderRisk += 15;

if (rainAmount >= 20)
    thunderRisk += 15;

thunderRisk = Math.min(thunderRisk, 100);
let assessment = "";
            assessment = "Normala väderförhållanden väntas.";
if (rainRisk >= 80) {
    assessment +=
        " Mycket hög risk för regn. Planera för blöt väderlek.";
} else if (rainRisk >= 60) {
    assessment +=
        " Förhållandevis ostadigt med flera möjligheter till regn.";
} else if (rainRisk >= 40) {
    assessment +=
        " Viss risk för skurar under dagen.";
} else {
    assessment +=
        " Relativt stabilt väder med liten nederbördsrisk.";
}

if (thunderRisk >= 60) {
    assessment +=
        " Förhöjd risk för åska.";
}
else if (thunderRisk >= 30) {
    assessment +=
        " Mindre risk för åska.";
}

            if (maxTemp >= 25) {
                assessment +=
                    " Temperaturen väntas bli somrig och varm.";
            }

            html += `
                <div class="forecast-day">
<strong style="color:#60a5fa;font-size:18px;">
${weekday} ${dayDate}
</strong><br>
🌡️ ${minTemp}°C till ${maxTemp}°C<br>
🌬️ Medelvind:
<strong>${windSpeed} m/s</strong>

💨 Kastvind:
<strong>${windGust} m/s</strong><br>
📈 Lufttryck:
<strong>${pressure} hPa</strong><br>
🌧️ Regnrisk:
<strong>${rainRisk}%</strong><br>

💧 Regnmängd:
<strong>${rainAmount} mm</strong><br>

⚡ Åskrisk:
<strong>${thunderRisk}%</strong><br>
<br>
📋 <strong>Bedömning:</strong><br>
${assessment}
                </div>
            `;
        }

        document.getElementById("forecastContent").innerHTML =
            html;

    } catch (error) {

        document.getElementById("forecastContent").innerHTML =
            "Kunde inte hämta prognosen.";

        console.error(error);
    }
}

const LAT = 60.136;
const LON = 13.006;

const models = [

{
    id:"box1",
    namn:"Vädertjänst Tyskland",
    model:"icon_global",
    data:null
},
{
    id:"box2",
    namn:"Vädertjänst USA",
    model:"gfs_global",
    data:null
},
{
    id:"box3",
    namn:"Vädertjänst Kanada",
    model:"gem_global",
    data:null
},
{
    id:"box4",
    namn:"Vädertjänst Europa",
    model:"icon_eu",
    data:null
},
{
    id:"box5",
    namn:"Vädertjänst Danmark",
    model:"dmi_seamless",
    data:null
},
{
    id:"box6",
    namn:"Mixad vädertjänst",
    model:"best_match",
    data:null
}

];

let forecastIndex = new Date().getHours();

let countdown = 5;
async function loadWeather(source){

try{

const url =
`https://api.open-meteo.com/v1/forecast?latitude=${LAT}` +
`&longitude=${LON}` +
`&models=${source.model}` +
`&hourly=temperature_2m,surface_pressure,wind_speed_10m,wind_direction_10m,precipitation_probability,precipitation` +
`&forecast_days=2`;

const response = await fetch(url);
const data = await response.json();

source.data = data;

console.log(
    source.namn,
    data.hourly.time[0],
    data.hourly.time[data.hourly.time.length - 1]
);

}
catch(error){

console.error(error);

document.getElementById(source.id).innerHTML =
`<h2>${source.namn}</h2>
Fel vid hämtning av data`;

}
}
function getWindDirection(degrees) {

    const directions = [
        "N",
        "NO",
        "O",
        "SO",
        "S",
        "SV",
        "V",
        "NV"
    ];

    return directions[
        Math.round(degrees / 45) % 8
    ];
}
function getWindArrow(degrees) {

    const arrows = [
        "⬆️", // N
        "↗️", // NO
        "➡️", // O
        "↘️", // SO
        "⬇️", // S
        "↙️", // SV
        "⬅️", // V
        "↖️"  // NV
    ];

    return arrows[
        Math.round(degrees / 45) % 8
    ];    
}
    
function showHour(hour){

const forecastTime =
    models[0]?.data?.hourly?.time?.[hour];

document.getElementById("currentHour").innerHTML =
`Tid: ${forecastTime}`;

let temperatures = [];

models.forEach(model=>{

if(!model.data) return;
console.log(model.namn, model.data);
temperatures.push(
model.data.hourly.temperature_2m[hour]
);

})

models.forEach(model=>{

if(!model.data) return;

const h = model.data.hourly;

console.log(
    "forecastIndex:",
    forecastIndex,
    "Prognostid:",
    h.time?.[hour]
);

const temperature =
h.temperature_2m?.[hour] ?? "-";

const nextTemperature =
h.temperature_2m?.[hour + 1] ?? temperature;

const wind =
h.wind_speed_10m?.[hour] ?? "-";
const windDirection =
h.wind_direction_10m?.[hour] ?? 0;

const pressure =
h.surface_pressure?.[hour] ?? "-";

const rainRisk =
h.precipitation_probability?.[hour] ?? "-";

const rainAmount =
h.precipitation?.[hour] ?? 0;

const thunderRisk =
Math.min(Math.round(rainRisk * 0.6),100);

let rainAmountClass = "rain-low";

if (rainAmount >= 2)
    rainAmountClass = "rain-mid";

if (rainAmount >= 5)
    rainAmountClass = "rain-high";

let trend = "➡";

if(nextTemperature > temperature)
trend = "⬆";

if(nextTemperature < temperature)
trend = "⬇";

let tempClass = "temp-mid";

if(temperature <= 5)
tempClass = "temp-cold";

if(temperature >= 20)
tempClass = "temp-hot";

let rainClass = "rain-low";

if(rainRisk >= 30)
rainClass = "rain-mid";

if(rainRisk >= 70)
rainClass = "rain-high";

const box =
document.getElementById(model.id);

box.innerHTML = `

<h2>${model.namn}</h2>

Temperatur:
<span class="${tempClass}">
<b>${temperature} °C ${trend}</b>
</span>

<br><br>

Vind:
<b>${wind} m/s ${getWindArrow(windDirection)} ${getWindDirection(windDirection)}</b>

<br><br>

Lufttryck:
<b>${pressure} hPa</b>

<br><br>

Regnrisk:
<span class="${rainClass}">
<b>${rainRisk} %</b>
</span>

<br><br>

Regnmängd:
<span class="${rainAmountClass}">
<b>${rainAmount} mm</b>
</span>

<br><br>

Åskrisk:
<b>${thunderRisk} %</b>

`;

});

 

updateAIBox(hour);

 

}

 

function updateAIBox(hour){

    let tempSum = 0;
    let windSum = 0;
    let pressureSum = 0;
    let rainRiskSum = 0;
    let rainAmountSum = 0;

    let count = 0;

    models.forEach(model => {

        if(!model.data) return;

        const h = model.data.hourly;

        tempSum += h.temperature_2m?.[hour] ?? 0;
        windSum += h.wind_speed_10m?.[hour] ?? 0;
        pressureSum += h.surface_pressure?.[hour] ?? 0;
        rainRiskSum += h.precipitation_probability?.[hour] ?? 0;
        rainAmountSum += h.precipitation?.[hour] ?? 0;

        count++;

    });

    if(count === 0) return;

    const avgTemp = (tempSum / count).toFixed(1);
    const avgWind = (windSum / count).toFixed(1);
    const avgPressure = (pressureSum / count).toFixed(1);
    const avgRainRisk = Math.round(rainRiskSum / count);
    const avgRainAmount = (rainAmountSum / count).toFixed(1);
    const avgThunderRisk = Math.min(
        Math.round(avgRainRisk * 0.6),
        100
    );
    document.getElementById("box7").innerHTML = `

        <h2>🧠 Sammanvägt medelvärde</h2>

        Temperatur:
        <b>${avgTemp} °C</b>

        <br><br>

        Vind:
        <b>${avgWind} m/s</b>

        <br><br>

        Lufttryck:
        <b>${avgPressure} hPa</b>

        <br><br>

        Regnrisk:
        <b>${avgRainRisk} %</b>

        <br><br>

        Regnmängd:
        <b>${avgRainAmount} mm</b>

        <br><br>

        Åskrisk:
        <b>${avgThunderRisk} %</b>
    `;

}
updateWeeklyForecast();
async function loadAllData(){

await Promise.all(
models.map(loadWeather)
);

showHour(forecastIndex);

}

async function startDashboard(){

    updateDate();

    await loadAllData();

setInterval(async()=>{

    forecastIndex++;

    if (forecastIndex >= 48)
        forecastIndex = 0;

    showHour(forecastIndex);

    countdown = 5;

},5000);

setInterval(()=>{

countdown--;

if (countdown < 0)
    countdown = 5;

document.getElementById("countdown").innerHTML =
    `Nästa timme om ${countdown} sek`;

}, 1000);

}

function updateDate() {

    const options = {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
    };

const dateText =
    new Date().toLocaleDateString("sv-SE", options);

    document.getElementById("currentDate").innerHTML =
        dateText.charAt(0).toUpperCase() +
        dateText.slice(1);

}

startDashboard();

</script>

</body>
</html>
