function getWindDirection(degrees) {

    const directions = [
        "N",
        "NO",
        "O",
        "SO",
        "S",
        "SV",
        "V",
        "NV"
    ];

    return directions[
        Math.round(degrees / 45) % 8
    ];
}
function getWindArrow(degrees) {

    if (degrees === undefined || degrees === null)
        return "";

    const arrows = [
    "⬆️", // N
    "↗️", // NO
    "➡️", // O
    "↘️", // SO
    "⬇️", // S
    "↙️", // SV
    "⬅️", // V
    "↖️"  // NV
];

    return arrows[
        Math.round(degrees / 45) % 8
    ];
}
function getScoreClass(score){

    if(score >= 16)

        return "score-good";

    if(score >= 6)

}

function updateAIBox(hour){

    if(!models[0]?.data?.hourly)
        return;

    const forecastTime =
        models[0]?.data?.hourly?.time?.[hour];

const displayTime =
    new Date(forecastTime)
        .toLocaleString("sv-SE", {
            hour: "2-digit",
            minute: "2-digit"
        });
const forecastDate = new Date(forecastTime);

const displayDate =
    forecastDate.toLocaleDateString("sv-SE", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
    });

const capitalizedDate =
    displayDate.charAt(0).toUpperCase() +
    displayDate.slice(1);
let tempSum = 0;
let windSum = 0;
let windX = 0;
let windY = 0;
let pressureSum = 0;
let rainRiskSum = 0;
let rainAmountSum = 0;

let weightSum = 0;
    models.forEach(model => {

        if(!model.data) return;

        const h = model.data.hourly;

const weight =
    weights[model.model] ?? 0;

tempSum +=
    (h.temperature_2m?.[hour] ?? 0) * weight;

windSum +=
    ((h.wind_speed_10m?.[hour] ?? 0) * WIND_FACTOR) * weight;

const dir =
    h.wind_direction_10m?.[hour] ?? 0;

const rad =
    dir * Math.PI / 180;

windX +=
    Math.cos(rad) * weight;

windY +=
    Math.sin(rad) * weight;

pressureSum +=
    (h.surface_pressure?.[hour] ?? 0) * weight;

rainRiskSum +=
    (h.precipitation_probability?.[hour] ?? 0) * weight;

rainAmountSum +=
    (h.precipitation?.[hour] ?? 0) * weight;

weightSum += weight;

    });

if(weightSum === 0) return;

const avgTemp =
    (tempSum / weightSum).toFixed(1);

let avgTempClass = "";

if(Number(avgTemp) <= -20)
    avgTempClass = "temp-cold";

if(Number(avgTemp) >= 30)
    avgTempClass = "temp-hot";
const avgWind =
    (windSum / weightSum).toFixed(1);
let avgWindClass = "";

if(Number(avgWind) >= 10)
    avgWindClass = "wind-high";

else if(Number(avgWind) >= 5)
    avgWindClass = "wind-mid";

const avgWindDirection =
(
    Math.atan2(windY, windX)
    * 180 / Math.PI
    + 360
) % 360;

if (isNaN(avgWindDirection))
    return;

const avgPressure =
    (pressureSum / weightSum).toFixed(1);
const avgRainRisk =
    Math.round(rainRiskSum / weightSum);
let avgRainClass = "rain-low";

if(avgRainRisk >= 30)
    avgRainClass = "rain-mid";

if(avgRainRisk >= 80)
    avgRainClass = "rain-high";
const avgRainAmount =
    (rainAmountSum / weightSum).toFixed(1);
let avgRainAmountClass = "rain-low";

if(Number(avgRainAmount) > 0 &&
   Number(avgRainAmount) < 2)
{
    avgRainAmountClass = "rain-green";
}

if(Number(avgRainAmount) >= 2 &&
   Number(avgRainAmount) < 10)
{
    avgRainAmountClass = "rain-mid";
}

if(Number(avgRainAmount) >= 10)
{
    avgRainAmountClass = "rain-high";
}
