name: Weather Update

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hämta väderdata
        run: |
          curl "https://api.open-meteo.com/v1/forecast?latitude=60.136&longitude=13.006&models=icon_global&hourly=temperature_2m" -o weather.json

      - name: Commit fil
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add weather.json

          git diff --staged --quiet || git commit -m "Uppdatera väderdata"

          git push
