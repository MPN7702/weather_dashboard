name: Weather Update

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Hämta väderdata
        run: |
          mkdir -p temp

          models=(
            icon_global
            gfs_global
            gem_global
            icon_eu
            dmi_seamless
            best_match
          )

          download_location() {
            NAME="$1"
            LAT="$2"
            LON="$3"

            mkdir -p "temp/$NAME"

            for MODEL in "${models[@]}"
            do
              curl -L --fail --silent --show-error \
              "https://api.open-meteo.com/v1/forecast?latitude=$LAT&longitude=$LON&models=$MODEL&hourly=temperature_2m,surface_pressure,wind_speed_10m,wind_direction_10m,precipitation_probability,precipitation&forecast_days=2" \
              -o "temp/$NAME/$MODEL.json"
            done

            curl -L --fail --silent --show-error \
            "https://api.open-meteo.com/v1/forecast?latitude=$LAT&longitude=$LON&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_mean,wind_gusts_10m_mean,surface_pressure_mean&timezone=auto&forecast_days=7" \
            -o "temp/$NAME/weekly.json"
          }

          download_location "Torsby" "60.136" "13.006"
          download_location "Syssleback" "60.729" "13.006"
          download_location "Stollet" "60.416" "13.256"

      - name: Skapa weather.json
        run: |
          cat > weather.json <<EOF
          {
            "updated":"$(date -u +%Y-%m-%dT%H:%M:%SZ)",

            "Torsby":{
              "icon_global":
          EOF

          cat temp/Torsby/icon_global.json >> weather.json

          cat >> weather.json <<EOF
          ,
              "gfs_global":
          EOF

          cat temp/Torsby/gfs_global.json >> weather.json

          cat >> weather.json <<EOF
          ,
              "gem_global":
          EOF

          cat temp/Torsby/gem_global.json >> weather.json

          cat >> weather.json <<EOF
          ,
              "icon_eu":
          EOF

          cat temp/Torsby/icon_eu.json >> weather.json

          cat >> weather.json <<EOF
          ,
              "dmi_seamless":
          EOF

          cat temp/Torsby/dmi_seamless.json >> weather.json

          cat >> weather.json <<EOF
          ,
              "best_match":
          EOF

          cat temp/Torsby/best_match.json >> weather.json

          cat >> weather.json <<EOF
          ,
              "weekly":
          EOF

          cat temp/Torsby/weekly.json >> weather.json

          cat >> weather.json <<EOF
            }
          }
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add weather.json
          git commit -m "Update weather cache" || true
          git push
