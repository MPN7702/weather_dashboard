name: Weather Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hämta väderdata
        run: |
          curl "https://api.open-meteo.com/v1/forecast?latitude=60.136&longitude=13.006&hourly=temperature_2m" -o weather.json

      - name: Visa fil
        run: cat weather.json

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add weather.json

          git diff --staged --quiet || git commit -m "Update weather"

          git push
