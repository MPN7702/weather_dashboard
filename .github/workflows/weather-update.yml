name: Weather Update

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Hämta väderdata
        run: |
          mkdir -p temp

          locations=(
            "Torsby|60.136|13.006"
            "Syssleback|60.729|13.006"
            "Stollet|60.416|13.256"
            "Likenas|60.640|13.220"
            "Ostmark|60.314|12.996"
            "Holjes|60.815|12.790"
            "Ambjorby|60.480|13.115"
            "Varnas|60.285|13.173"
            "Vitsand|60.542|13.017"
            "Branas|60.689|13.189"
          )

          for loc in "${locations[@]}"
          do
            NAME=$(echo "$loc" | cut -d'|' -f1)
            LAT=$(echo "$loc" | cut -d'|' -f2)
            LON=$(echo "$loc" | cut -d'|' -f3)

            mkdir -p "temp/$NAME"

            curl -L --fail --silent --show-error \
              --connect-timeout 15 \
              --max-time 60 \
              "https://api.open-meteo.com/v1/forecast?latitude=$LAT&longitude=$LON&models=best_match&hourly=temperature_2m,surface_pressure,wind_speed_10m,wind_direction_10m,precipitation_probability,precipitation&forecast_days=2" \
              -o "temp/$NAME/best_match.json"

            curl -L --fail --silent --show-error \
              --connect-timeout 15 \
              --max-time 60 \
              "https://api.open-meteo.com/v1/forecast?latitude=$LAT&longitude=$LON&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_mean,wind_gusts_10m_mean,surface_pressure_mean&timezone=auto&forecast_days=7" \
              -o "temp/$NAME/weekly.json"

            sleep 1
          done

      - name: Skapa weather.json
        run: |
          echo '{' > weather.json

          echo '"updated":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'",' >> weather.json

          locations=(
            "Torsby"
            "Syssleback"
            "Stollet"
            "Likenas"
            "Ostmark"
            "Holjes"
            "Ambjorby"
            "Varnas"
            "Vitsand"
            "Branas"
          )

          total=${#locations[@]}

          for ((i=0; i<total; i++))
          do
            ort="${locations[$i]}"

            echo "\"$ort\":{" >> weather.json

            echo '"best_match":' >> weather.json
            cat "temp/$ort/best_match.json" >> weather.json

            echo ',' >> weather.json

            echo '"weekly":' >> weather.json
            cat "temp/$ort/weekly.json" >> weather.json

            if [ $i -lt $((total - 1)) ]
            then
              echo '},' >> weather.json
            else
              echo '}' >> weather.json
            fi
          done

          echo '}' >> weather.json

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add weather.json

          git commit -m "Update weather cache" || true

          git push
