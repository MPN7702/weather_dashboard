name: Weather Update

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Hämta väderdata
        run: |
          mkdir -p temp/Torsby
          mkdir -p temp/Syssleback
          mkdir -p temp/Stollet
          mkdir -p temp/Likenas
          mkdir -p temp/Ostmark

          models=(
            icon_global
            gfs_global
            gem_global
            icon_eu
            dmi_seamless
            best_match
          )

          download_location () {
            NAME=$1
            LAT=$2
            LON=$3

            for model in "${models[@]}"
            do
              curl -L --fail --silent --show-error \
                --connect-timeout 15 \
                --max-time 60 \
                "https://api.open-meteo.com/v1/forecast?latitude=$LAT&longitude=$LON&models=$model&hourly=temperature_2m,surface_pressure,wind_speed_10m,wind_direction_10m,precipitation_probability,precipitation&forecast_days=2" \
                -o "temp/$NAME/$model.json"
            done

            curl -L --fail --silent --show-error \
              --connect-timeout 15 \
              --max-time 60 \
              "https://api.open-meteo.com/v1/forecast?latitude=$LAT&longitude=$LON&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_mean,wind_gusts_10m_mean,surface_pressure_mean&timezone=auto&forecast_days=7" \
              -o "temp/$NAME/weekly.json"
          }

          download_location Torsby 60.136 13.006
          download_location Syssleback 60.729 13.006
          download_location Stollet 60.416 13.256
          download_location Likenas 60.640 13.220
          download_location Ostmark 60.314 12.996

      - name: Skapa weather.json
        run: |
          echo '{' > weather.json

          echo '"updated":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'",' >> weather.json

          build_location () {
            NAME=$1

            echo "\"$NAME\":{" >> weather.json

            echo '"icon_global":' >> weather.json
            cat "temp/$NAME/icon_global.json" >> weather.json
            echo ',' >> weather.json

            echo '"gfs_global":' >> weather.json
            cat "temp/$NAME/gfs_global.json" >> weather.json
            echo ',' >> weather.json

            echo '"gem_global":' >> weather.json
            cat "temp/$NAME/gem_global.json" >> weather.json
            echo ',' >> weather.json

            echo '"icon_eu":' >> weather.json
            cat "temp/$NAME/icon_eu.json" >> weather.json
            echo ',' >> weather.json

            echo '"dmi_seamless":' >> weather.json
            cat "temp/$NAME/dmi_seamless.json" >> weather.json
            echo ',' >> weather.json

            echo '"best_match":' >> weather.json
            cat "temp/$NAME/best_match.json" >> weather.json
            echo ',' >> weather.json

            echo '"weekly":' >> weather.json
            cat "temp/$NAME/weekly.json" >> weather.json

            echo '}' >> weather.json
          }

          build_location Torsby
          echo ',' >> weather.json

          build_location Syssleback
          echo ',' >> weather.json

          build_location Stollet
          echo ',' >> weather.json

          build_location Likenas
          echo ',' >> weather.json

          build_location Ostmark

          echo '}' >> weather.json

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add weather.json

          git commit -m "Update weather cache" || true

          git push
