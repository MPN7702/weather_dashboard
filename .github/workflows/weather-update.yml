name: Weather Update

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Hämta väderdata
        run: |
          mkdir -p temp

          models=(
            icon_global
            gfs_global
            gem_global
            icon_eu
            dmi_seamless
            best_match
          )

          for model in "${models[@]}"
          do
            curl -L --fail --silent --show-error \
              --connect-timeout 15 \
              --max-time 60 \
              "https://api.open-meteo.com/v1/forecast?latitude=60.136&longitude=13.006&models=$model&hourly=temperature_2m,surface_pressure,wind_speed_10m,wind_direction_10m,precipitation_probability,precipitation&forecast_days=2" \
              -o "temp/$model.json"
          done

          curl -L --fail --silent --show-error \
            --connect-timeout 15 \
            --max-time 60 \
            "https://api.open-meteo.com/v1/forecast?latitude=60.136&longitude=13.006&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_mean,wind_gusts_10m_mean,surface_pressure_mean&timezone=auto&forecast_days=7" \
            -o temp/weekly.json

      - name: Skapa weather.json
        run: |
          echo '{' > weather.json

          echo '"updated":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'",' >> weather.json

          echo '"icon_global":' >> weather.json
          cat temp/icon_global.json >> weather.json
          echo ',' >> weather.json

          echo '"gfs_global":' >> weather.json
          cat temp/gfs_global.json >> weather.json
          echo ',' >> weather.json

          echo '"gem_global":' >> weather.json
          cat temp/gem_global.json >> weather.json
          echo ',' >> weather.json

          echo '"icon_eu":' >> weather.json
          cat temp/icon_eu.json >> weather.json
          echo ',' >> weather.json

          echo '"dmi_seamless":' >> weather.json
          cat temp/dmi_seamless.json >> weather.json
          echo ',' >> weather.json

          echo '"best_match":' >> weather.json
          cat temp/best_match.json >> weather.json
          echo ',' >> weather.json

          echo '"weekly":' >> weather.json
          cat temp/weekly.json >> weather.json

          echo '}' >> weather.json

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add weather.json

          git commit -m "Update weather cache" || true

          git push
