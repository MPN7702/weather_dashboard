name: Weather Update

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Hämta väderdata
        run: |
          mkdir -p temp

          locations=(
            "Torsby|60.136|13.006"
            "Sysslebäck|60.729|13.006"
            "Stöllet|60.416|13.256"
            "Likenäs|60.640|13.220"
            "Östmark|60.314|12.996"
            "Höljes|60.815|12.790"
            "Ambjörby|60.480|13.115"
            "Värnäs|60.285|13.173"
            "Vitsand|60.542|13.017"
            "Branäs|60.689|13.189"
          )

          models=(
            icon_global
            gfs_global
            gem_global
            icon_eu
            dmi_seamless
            best_match
          )

          fetch_file() {
            local url="$1"
            local outfile="$2"

            for attempt in 1 2 3
            do
              echo "Försök $attempt -> $outfile"

              if curl -L -s \
                --connect-timeout 30 \
                --max-time 90 \
                --retry 3 \
                --retry-delay 5 \
                "$url" \
                -o "$outfile"
              then

                if [ -s "$outfile" ]; then
                  return 0
                fi

              fi

              echo "Misslyckades, väntar 10 sek..."
              sleep 10

            done

            echo "KUNDE INTE HÄMTA: $outfile"

            return 1
          }

          for loc in "${locations[@]}"
          do
            name=$(echo "$loc" | cut -d'|' -f1)
            lat=$(echo "$loc" | cut -d'|' -f2)
            lon=$(echo "$loc" | cut -d'|' -f3)

            echo ""
            echo "=================================="
            echo "ORT: $name"
            echo "=================================="

            mkdir -p "temp/$name"

                       for model in "${models[@]}"
            do
              echo "Modell: $model"

              fetch_file \
              "https://api.open-meteo.com/v1/forecast?latitude=$lat&longitude=$lon&models=$model&hourly=temperature_2m,surface_pressure,wind_speed_10m,wind_direction_10m,precipitation_probability,precipitation&forecast_days=2" \
              "temp/$name/$model.json"

              sleep 1
            done

            echo "Weekly: $name"

            fetch_file \
           fetch_file \
"https://api.open-meteo.com/v1/forecast?latitude=$lat&longitude=$lon&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_mean,wind_direction_10m_dominant,wind_gusts_10m_mean,surface_pressure_mean&timezone=auto&forecast_days=7" \
"temp/$name/weekly.json"
            "temp/$name/weekly.json"

            sleep 2

          done

      - name: Skapa weather.json
        run: |
          echo '{' > weather.json

          echo '"updated":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'",' >> weather.json

          locations=(
            "Torsby"
            "Sysslebäck"
            "Stöllet"
            "Likenäs"
            "Östmark"
            "Höljes"
            "Ambjörby"
            "Värnäs"
            "Vitsand"
            "Branäs"
          )

          total=${#locations[@]}

          for ((i=0; i<total; i++))
          do
            ort="${locations[$i]}"

            echo "\"$ort\":{" >> weather.json

            echo '"icon_global":' >> weather.json
            cat "temp/$ort/icon_global.json" >> weather.json
            echo ',' >> weather.json

            echo '"gfs_global":' >> weather.json
            cat "temp/$ort/gfs_global.json" >> weather.json
            echo ',' >> weather.json

            echo '"gem_global":' >> weather.json
            cat "temp/$ort/gem_global.json" >> weather.json
            echo ',' >> weather.json

            echo '"icon_eu":' >> weather.json
            cat "temp/$ort/icon_eu.json" >> weather.json
            echo ',' >> weather.json

            echo '"dmi_seamless":' >> weather.json
            cat "temp/$ort/dmi_seamless.json" >> weather.json
            echo ',' >> weather.json

            echo '"best_match":' >> weather.json
            cat "temp/$ort/best_match.json" >> weather.json
            echo ',' >> weather.json

            echo '"weekly":' >> weather.json
            cat "temp/$ort/weekly.json" >> weather.json

            if [ $i -lt $((total - 1)) ]; then
              echo '},' >> weather.json
            else
              echo '}' >> weather.json
            fi
          done

          echo '}' >> weather.json

      - name: Commit weather.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add weather.json

          git commit -m "Update weather cache" || true

          git push
